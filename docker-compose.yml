services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: overflow
      POSTGRES_USER: overflow
      POSTGRES_PASSWORD: overflow_local_only
    ports:
      # Loopback only by default; set POSTGRES_HOST_BIND to widen deliberately.
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - overflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overflow -d overflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: "."
      args:
        # Plumbs the image's provenance through compose builds: export
        # SOURCE_SHA="$(git rev-parse HEAD)" first (deploy/container.md).
        SOURCE_SHA: "${SOURCE_SHA:-}"
    profiles: [app]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Deliberate override of any loopback DATABASE_URL in .env: inside the
      # compose network the app reaches postgres by service name, not loopback.
      DATABASE_URL: postgresql://overflow:overflow_local_only@postgres:5432/overflow
    ports:
      # Loopback only by default, like postgres; set APP_HOST_BIND to widen.
      # APP_URL must still name the address users browse to.
      - "${APP_HOST_BIND:-127.0.0.1}:3000:3000"
    healthcheck:
      # Same readiness probe the image's HEALTHCHECK runs (issue 688), in
      # postgres's healthcheck shape: bookworm-slim has no curl/wget, so the
      # command is a node fetch one-liner whose response status drives the
      # exit code. During start_period failures do not yet count as
      # failures, so the app's migrate-then-start boot fits the window.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/readiness').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  overflow-postgres-data:
