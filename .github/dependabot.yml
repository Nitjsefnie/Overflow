version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:17"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # postgres is pinned by a deliberate local-patch regime: patches/postgres@3.4.9.patch
      # is maintained on purpose (not filed upstream, by standing maintainer decision) and
      # pnpm-lock.yaml pins its content hash under patchedDependencies.postgres@3.4.9.
      # An automated version bump invalidates the patch and breaks `pnpm install
      # --frozen-lockfile`. Bump postgres by hand only — extend the patch and update the
      # lockfile hash together.
      - dependency-name: "postgres"
    groups:
      # react-dom refuses to load beside any other react version ("Incompatible
      # React versions"), and @types/react-dom peers on a matching @types/react
      # range, so these four move together in one pull request. A group
      # without applies-to covers version updates only, and security updates
      # are enabled here, so the second group keeps a React advisory from
      # opening a single-package pull request. Exact names only: a wildcard
      # such as `*react*` would also sweep in @vitejs/plugin-react and
      # @testing-library/react.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Workflow actions are SHA-pinned; dependabot proposes their bumps as SHA
  # updates (the intended behavior for the two Nitjsefnie-Actions workflows,
  # which stay SHA-pinned by maintainer decision). Every action therefore
  # travels together in one grouped pull request per week, majors included —
  # the old minor-and-patch group left a codeql-action v4 to v5 bump as one pull
  # request per `uses:` line. That matters here because the three codeql-action
  # sub-actions (init, analyze, upload-sarif) are pinned to one SHA and used as a
  # matched set — init and analyze are two steps of the same analyze job in
  # code-scanning.yml — so a split major bump could leave one job running two
  # versions of the same action against each other. One group carrying every
  # action removes that hazard. Neither group narrows itself with update-types,
  # and tests/api/ci-workflows.test.ts resolves the patterns against the
  # workflows' real `uses:` inventory so a group cannot quietly stop covering
  # one. A group without applies-to covers version updates only and security
  # updates are enabled here, so the second group keeps a single-action advisory
  # from opening a single-package pull request. That weekly grouped pull request
  # lands red on arrival by design: tests/api/ci-workflows.test.ts pins those
  # action SHAs, so the handler completes the second edit (the test pins) before
  # merging — CONTRIBUTING.md's two-edit regime for a workflow change.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "04:23"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Matches the root Dockerfile (the repository's only one). Its base image is
  # digest-pinned, so bumps arrive as tag+digest updates for that one image.
  # That digest is a shared literal across Dockerfile's two FROM lines, the
  # provenance LABEL's base.digest (issue 461) and a constant in
  # tests/deploy/container-image.test.ts, so a FROM-only bump lands red with
  # the rest stale: the handler makes the coordinated edit (all FROM lines,
  # LABEL, test constant) or the lane becomes an `ignore` entry by maintainer
  # decision.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:31"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # Declined in #771: node 26 enters LTS only on 2026-10-28 per the
      # nodejs.org release schedule (nodejs/Release schedule.json), and a Node
      # runtime major is not taken before LTS. Revisit on/after 2026-10-28:
      # remove this ignore entry, take the next node major proposal, and make
      # the coordinated edit the dependabot docker section comment describes
      # (both Dockerfile FROM lines, the provenance LABEL's base digest, the
      # container-image test constant).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
