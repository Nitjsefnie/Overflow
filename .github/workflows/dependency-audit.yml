name: dependency audit

# Main's lockfile audit runs on push, daily and dispatch with no paths filter:
# every merged SHA needs a dependency-audit conclusion for deployment.
# The PR leg is pr-gates.yml's dependency-audit job. Both audit manifests as
# data with no project install or build, under an explicit read-only grant.
# pnpm's JSON report distinguishes advisories, clean reports, registry errors
# and unreadable output. Only registry 429/5xx replies receive the bounded
# retry; advisories and unreadable reports fail immediately. Job-level env
# holds the package-manager choice, registry, TLS store and severity bar.

on:
  push:
    branches:
      - main
  schedule:
    # Daily 06:37 UTC. The minute stays 37: it is the minimal diff, and it is
    # already this workflow's documented reason for being off the top of the
    # hour where the Actions queue is busiest. It also collides with nothing —
    # secret-scan fires at :41 and code-scanning at :43, so :37 is free. What
    # changed is the day-of-week: weekly meant an advisory published against an
    # unchanged pin went unreported for up to seven days, and Monday was the
    # slot every other weekly cron wanted.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main-push, daily and dispatch producers key on SHA and never cancel a
  # running audit. PR arrivals use pr-gates.yml's dependency-audit job and
  # its per-PR cancelling group; no PR trigger reaches this file.
  group: dependency-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The job id IS the required context's name: branch protection requires
  # `dependency-audit` and the relay's decideContexts matches producing jobs
  # by this name (issue 1149; formerly `audit`).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Job scope carries these controls through setup and audit alike.
    env:
      # `corepack install --global pnpm@10.33.0` sets corepack's DEFAULT and
      # nothing more: when the `pnpm` shim runs, corepack otherwise reads
      # `packageManager` from the nearest package.json and downloads THAT
      # version. On this file's legs the checkout is main's own tree, so the
      # pin's work is to hold the audit at the measured 10.33.0 whatever
      # `packageManager` main's package.json names — "verified against pnpm
      # 10.33.0" describes a version this repository chose, not one a manifest
      # edit picked. The pull-request-facing measurement (a pull request
      # picking the binary through its own packageManager) is recorded
      # identically on pr-gates.yml, job dependency-audit's copy of this block.
      #
      # This has to reach the step that runs `pnpm audit` and not merely the
      # one that installs pnpm, which is why it is here rather than on either
      # step. Set at job level, the audit step resolves a `pnpm@9.15.9` tree to
      # 10.33.0; set on the install step alone it resolves to 9.15.9.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      # pnpm reads `.npmrc` from the working directory, and a `registry=` there
      # redirects the advisory endpoint. On this file's legs the checkout is
      # main's own tree, so the pin holds the audit at the registry this
      # repository chose even if a future edit to main's `.npmrc` names
      # another one; the pull-request-facing threat (a pull request pointing
      # the audit at a registry it controls) lives on pr-gates.yml, job dependency-audit,
      # which materializes no `.npmrc` at all and carries the same pin.
      # Measured on pnpm 10.33.0: a project `.npmrc` does redirect `pnpm
      # config get registry`, and this variable outranks it. corepack does not
      # read `.npmrc` at all, so the audit step is the only one with this
      # exposure — at job level it costs the install step nothing.
      npm_config_registry: "https://registry.npmjs.org/"
      # The transport half of the same attack. A project `.npmrc` `proxy=` or
      # `https-proxy=` is honoured by the audit's own HTTP agent, and an env
      # value cannot neutralise it: measured on pnpm 10.33.0, a non-empty
      # `npm_config_proxy`/`npm_config_https_proxy` is honoured and an EMPTY one
      # does NOT beat `.npmrc`, so no proxy pin exists — a pull request can
      # still choose the network path the audit request takes. What it cannot
      # choose is what the audit TRUSTS at the end of that path. Measured on
      # pnpm 10.33.0 against a local TLS endpoint: a project `strict-ssl=false`
      # accepts a self-signed certificate the default configuration rejects,
      # and `npm_config_strict_ssl` at `true` outranks it, so an intercepted
      # connection fails closed (red run) instead of reporting the
      # intercepting server's answer. The same measurement with a project
      # `cafile=` showed the cafile REPLACES the whole trust store — one
      # attacker-chosen CA would launder any interception — and the non-empty
      # `npm_config_cafile` outranks it, so the pin below holds the store at
      # the runner's system bundle. Both probe runs under the empty env values
      # left the project's attack in place, which is why these are values and
      # not empty strings.
      npm_config_strict_ssl: "true"
      npm_config_cafile: "/etc/ssl/certs/ca-certificates.crt"
      # low is pnpm's lowest reportable severity; a higher bar hides findings.
      npm_config_audit_level: "low"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the audit step's fast-path ancestor check: the
          # previous tip must be present and provably an ancestor of the
          # pushed HEAD, or the classification falls through to the full
          # audit (safe, but never fast). A depth-1 checkout would hold
          # neither.
          fetch-depth: 0

      # The PR-event suppression check is dormant on this file's trigger set.
      # ci-pr.yml's required verify job judges suppression changes, while
      # pr-gates.yml's dependency-audit job materializes only two manifests.
      - name: Refuse a pull request that changes the audit suppression list
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          file=package.json
          ws_file=pnpm-workspace.yaml
          npmrc_file=.npmrc
          
          # Two more suppression surfaces, measured on pnpm 10.33.0 with a real advisory
          # carrying its github_advisory_id (the invalid-first-leg lesson applied): the
          # audit honours auditConfig, auditLevel and the registries mapping from
          # pnpm-workspace.yaml — the mapping BEATS a pinned npm_config_registry, so it
          # redirects the advisory endpoint — and audit-level, registry, strict-ssl,
          # cafile, proxy and https-proxy from .npmrc. Both files are therefore compared
          # alongside package.json; absent compares equal to a file carrying none of the
          # audited keys, and an unparseable CHANGED file is a refusal, never a silent
          # pass.
          
          # Reads a commit's package.json as git objects with the ls-tree single-blob
          # discipline: exactly one mode-100644 blob entry at package.json, or refuse.
          # Prints the blob id on stdout.
          blob_of() {
            entries=$(git ls-tree "${1:?}" -- "${file}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::package.json must be exactly one mode-100644 blob entry in a tree; refusing. The suppression list is read from git objects, never from the filesystem, so a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          
          # Reads a commit's pnpm-workspace.yaml or .npmrc as git objects: absent is a
          # legitimate state — the files are optional — so unlike package.json it prints
          # the ABSENT sentinel instead of refusing. Any PRESENT shape other than exactly
          # one mode-100644 blob is a refusal: pnpm reads these files from the checkout
          # on disk, where a symlink leaf redirects the read outside the tree, so the
          # git-objects read must refuse what a filesystem read would follow.
          optional_entry_of() {
            entries=$(git ls-tree "${1:?}" -- "${2:?}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -eq 0 ]; then
              printf 'ABSENT\n'
              return 0
            fi
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::pnpm-workspace.yaml and .npmrc must be absent or exactly one mode-100644 blob entry in a tree; refusing. These files are read from git objects, never from the filesystem — pnpm reads the checkout on disk, where a symlink leaf redirects the read outside the tree, so a symlink leaf, a wrong mode and a non-blob type are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          
          # Pipes the named blob through the inline python pre-parse, which emits the
          # CANONICAL form of .pnpm.auditConfig: sort_keys and compact separators make
          # the dump uniquely parseable back to one value, so string equality of the two
          # sides is structural equality - key order, indentation and escaping in
          # package.json never reach the comparison, while every nested value and the
          # order of the ignoreGhsas list itself do.
          value_of() {
            git cat-file blob "${1:?}" | python3 -c "${pre_parse}"
          }
          
          # Projects one side's pnpm-workspace.yaml (a blob id, or the ABSENT sentinel)
          # to the canonical form of its audit-affecting settings. Absent compares equal
          # to a file carrying none of the audited keys; identical bytes cannot diverge,
          # so identical blob ids never reach the parse — the PyYAML install below runs
          # only when a side actually needs judging, and a runner without a working
          # module only ever reds a pull request that CHANGED the file.
          ws_value_of() {
            if [ "${1:?}" = "ABSENT" ]; then
              printf 'absent\n'
              return 0
            fi
            git cat-file blob "${1:?}" | PYTHONPATH="${pyyaml_site}${PYTHONPATH:+:${PYTHONPATH}}" python3 -c "${ws_pre_parse}"
          }
          
          # Projects one side's .npmrc to the canonical form of its audit-affecting
          # keys, with the same ABSENT handling as the workspace projection.
          npmrc_value_of() {
            if [ "${1:?}" = "ABSENT" ]; then
              printf 'absent\n'
              return 0
            fi
            git cat-file blob "${1:?}" | python3 -c "${npmrc_pre_parse}"
          }
          
          pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::package.json is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::package.json carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::package.json is not valid UTF-8; refusing\n")
              sys.exit(1)
          try:
              parsed = json.loads(text)
          except ValueError:
              sys.stderr.write("::error::package.json does not parse as JSON; refusing\n")
              sys.exit(1)
          config = None
          if isinstance(parsed, dict):
              pnpm = parsed.get("pnpm")
              if isinstance(pnpm, dict):
                  config = pnpm.get("auditConfig")
          if config is None:
              sys.stdout.write("absent")
          else:
              sys.stdout.write(json.dumps(config, sort_keys=True, separators=(",", ":")))
          PY
          )
          ws_pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc carry a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are not valid UTF-8; refusing\n")
              sys.exit(1)
          try:
              import yaml
          except ImportError:
              sys.stderr.write("::error::python3 has no yaml module; refusing to judge pnpm-workspace.yaml without it — the hash-pinned install above provides it, so a missing module means the install failed and is a red run, never a silent pass\n")
              sys.exit(1)
          try:
              parsed = yaml.safe_load(text)
          except Exception:
              sys.stderr.write("::error::pnpm-workspace.yaml does not parse as a mapping of settings; refusing to judge the audit-affecting settings without a parse\n")
              sys.exit(1)
          if parsed is None:
              parsed = {}
          if not isinstance(parsed, dict):
              sys.stderr.write("::error::pnpm-workspace.yaml does not parse as a mapping of settings; refusing to judge the audit-affecting settings without a parse\n")
              sys.exit(1)
          projection = {}
          for key in ("auditConfig", "auditLevel", "registries"):
              if key in parsed:
                  projection[key] = parsed[key]
          try:
              dump = json.dumps(projection, sort_keys=True, separators=(",", ":"))
          except (TypeError, ValueError):
              sys.stderr.write("::error::pnpm-workspace.yaml carries audit-affecting settings that do not serialize to JSON; refusing\n")
              sys.exit(1)
          sys.stdout.write(dump if projection else "absent")
          PY
          )
          
          npmrc_pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc carry a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are not valid UTF-8; refusing\n")
              sys.exit(1)
          ALLOWED = ("audit-level", "registry", "strict-ssl", "cafile", "proxy", "https-proxy")
          projection = {}
          for line in text.split("\n"):
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or stripped.startswith(";"):
                  continue
              if "=" not in stripped:
                  sys.stderr.write("::error::.npmrc carries a line that is neither blank, a comment, nor key=value; refusing to judge its audit-affecting keys without a parse\n")
                  sys.exit(1)
              key, _, value = stripped.partition("=")
              key = key.strip().lower()
              value = value.strip()
              if not key:
                  sys.stderr.write("::error::.npmrc carries a line that is neither blank, a comment, nor key=value; refusing to judge its audit-affecting keys without a parse\n")
                  sys.exit(1)
              if key in ALLOWED:
                  projection[key] = value
          if projection:
              sys.stdout.write(json.dumps(projection, sort_keys=True, separators=(",", ":")))
          else:
              sys.stdout.write("absent")
          PY
          )

          # The workspace parse needs PyYAML, and the runner image does not
          # ship it. The module is installed from the BASE's hash-pinned
          # manifest — the fetched FETCH_HEAD, read from git objects exactly
          # like the audited files, so a pull request can neither substitute
          # the manifest nor the wheel content (--require-hashes). Called only
          # when the two sides' pnpm-workspace.yaml blob ids differ; identical
          # trees skip the install (and its network round trip) entirely.
          pyyaml_manifest_of() {
            entries=$(git ls-tree "${1:?}" -- "${manifest}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -eq 0 ]; then
              echo "::error::.github/requirements-pyyaml.txt is missing from the base; the workspace gate judges pnpm-workspace.yaml with a hash-pinned PyYAML install and refuses without it — the manifest moves only through a maintainer-reviewed merge, like the list it installs for" >&2
              exit 1
            fi
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::.github/requirements-pyyaml.txt must be exactly one mode-100644 blob entry in the base; refusing. The manifest is read from git objects, never from the filesystem — a pull request can neither substitute it nor hide it — so a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }

          # Validates the manifest by the pin grammar (pyyaml==VERSION followed
          # by one to 32 --hash=sha256:HEX64 values) and writes the sanitized
          # copy pip installs from — no includes, index options, URL lines or
          # environment markers ever reach pip.
          pyyaml_manifest_pre_parse=$(cat <<'PY'
          import os
          import re
          import sys

          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::the PyYAML manifest is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::the PyYAML manifest carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::the PyYAML manifest is not valid UTF-8; refusing\n")
              sys.exit(1)
          pin = re.compile(r"pyyaml==[A-Za-z0-9][A-Za-z0-9._+-]*( --hash=sha256:[0-9a-f]{64}){1,32}")
          accepted = None
          for number, line in enumerate(text.split("\n"), start=1):
              if line == "" or line.startswith("#"):
                  continue
              if accepted is not None:
                  sys.stderr.write(f"::error::line {number}: the PyYAML manifest carries a second requirement line; exactly one is allowed\n")
                  sys.exit(1)
              if pin.fullmatch(line) is None:
                  sys.stderr.write(f"::error::line {number}: refused by the pin grammar — the one accepted shape is pyyaml==VERSION followed by one to 32 --hash=sha256:HEX64 values; includes, index options, URL lines, environment markers, CRLF and stray whitespace are refused\n")
                  sys.exit(1)
              accepted = line
          if accepted is None:
              sys.stderr.write("::error::the PyYAML manifest carries no requirement line; refusing\n")
              sys.exit(1)
          with open(os.environ["PYAML_SANITIZED_REQUIREMENTS"], "w", encoding="utf-8", newline="\n") as handle:
              handle.write(accepted)
              handle.write("\n")
          PY
          )

          install_pyyaml() {
            manifest=.github/requirements-pyyaml.txt
            pyyaml_manifest=$(pyyaml_manifest_of "${1:?}")
            sanitized="${RUNNER_TEMP}/pyyaml-manifest-check"
            if [ -e "${sanitized}" ] || [ -L "${sanitized}" ]; then
              echo "::error::${sanitized} already exists; refusing to write the sanitized pin into a directory this run did not create"
              exit 1
            fi
            mkdir -- "${sanitized}"
            git cat-file blob "${pyyaml_manifest}" | PYAML_SANITIZED_REQUIREMENTS="${sanitized}/requirements.txt" python3 -c "${pyyaml_manifest_pre_parse}" || return 1
            # pip writes its progress to stdout; this function's stdout is the
            # site path the caller captures, so pip's own output is diverted to
            # the step log — captured, it would ride inside PYTHONPATH and the
            # import would fall back to the system module or fail.
            pip install --no-deps --require-hashes --disable-pip-version-check --no-input --retries 2 --timeout 60 --target "${sanitized}/site" -r "${sanitized}/requirements.txt" 1>&2 || return 1
            printf '%s\n' "${sanitized}/site"
          }

          if ! git fetch --quiet --depth=1 origin "${BASE_SHA:?}"; then
            echo "::error::could not fetch the pull request's base commit; refusing to judge the suppression list without it" >&2
            exit 1
          fi
          base_blob=$(blob_of FETCH_HEAD)
          merge_blob=$(blob_of HEAD)
          base_value=$(value_of "${base_blob}") || exit 1
          merge_value=$(value_of "${merge_blob}") || exit 1
          if [ "${base_value}" != "${merge_value}" ]; then
            echo "::error::this pull request changes pnpm.auditConfig; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
            exit 1
          fi
          base_ws=$(optional_entry_of FETCH_HEAD "${ws_file}")
          merge_ws=$(optional_entry_of HEAD "${ws_file}")
          if [ "${base_ws}" != "${merge_ws}" ]; then
            pyyaml_site=$(install_pyyaml FETCH_HEAD) || exit 1
            base_ws_value=$(ws_value_of "${base_ws}") || exit 1
            merge_ws_value=$(ws_value_of "${merge_ws}") || exit 1
            if [ "${base_ws_value}" != "${merge_ws_value}" ]; then
              echo "::error::this pull request changes audit-affecting settings in pnpm-workspace.yaml; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
              exit 1
            fi
          fi
          
          base_npmrc=$(optional_entry_of FETCH_HEAD "${npmrc_file}")
          merge_npmrc=$(optional_entry_of HEAD "${npmrc_file}")
          if [ "${base_npmrc}" != "${merge_npmrc}" ]; then
            base_npmrc_value=$(npmrc_value_of "${base_npmrc}") || exit 1
            merge_npmrc_value=$(npmrc_value_of "${merge_npmrc}") || exit 1
            if [ "${base_npmrc_value}" != "${merge_npmrc_value}" ]; then
              echo "::error::this pull request changes audit-affecting keys in .npmrc; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
              exit 1
            fi
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      # Reads pnpm-lock.yaml directly — no pnpm install, no build — and is the
      # only step that reads anything the pull request controls other than the
      # lockfile itself. Every run ends in exactly one of five verdicts: clean,
      # advisories, transient (a 5xx or 429 to retry), unreachable (an answered
      # or unconnected registry that is not retryable), and unreadable. The
      # verdict word is echoed into this step's log, so the last two stay
      # distinguishable to whoever reads a red run; they share the same arm and
      # the same exit status, which is asserted too. `unreadable` fails closed
      # rather than reading as a clean lockfile, which is the failure mode a
      # detection signal cannot have.
      - name: Audit lockfile advisories
        env:
          # The fast path's two inputs, delivered through env like every event
          # value (no ${{ }} in run blocks). github.event.before is the
          # previous tip on main for a push, and the all-zeros SHA when there
          # is no previous tip — a new branch or a force push.
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # THE FAST PATH IS AN OUTCOME, NOT A SKIP (issue 1149 fix round 2).
          # The deploy gate derives its required set from branch protection,
          # so a push whose diff touched no manifest must still leave a green
          # dependency-audit check-run — a skipped audit would strand it. The
          # manifest and the lockfile ARE the audit's inputs, so a push that
          # changed neither cannot have changed what the audit reads, and the
          # green verdict is recorded here without asking the registry. The
          # branch is gated to push events, and EVERY ambiguity falls through
          # to the full audit below: a before-SHA that is not 40 hex, the
          # all-zeros SHA, a before commit missing from the checkout, a before
          # that is not an ancestor of the pushed HEAD, and a diff error are
          # all ambiguity, and ambiguity audits. The schedule and dispatch
          # legs never enter this branch — they audit unconditionally.
          if [ "${EVENT_NAME:?}" = "push" ] \
            && [[ "${BEFORE_SHA:?}" != *$'\n'* ]] \
            && printf '%s' "${BEFORE_SHA}" | grep -Eq '^[0-9a-f]{40}$' \
            && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "${BEFORE_SHA}" HEAD 2>/dev/null \
            && git diff --quiet "${BEFORE_SHA}" HEAD -- package.json pnpm-lock.yaml; then
            echo "no manifest change since the previous push — audit skipped, context green"
            exit 0
          fi
          set -uo pipefail
          attempts=3
          delay="${DEPENDENCY_AUDIT_RETRY_DELAY_SECONDS:-30}"
          for attempt in $(seq 1 "$attempts"); do
            code=0
            pnpm audit --json > audit.json 2> audit.err || code=$?
            result=$(AUDIT_EXIT="$code" node -e '
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          } catch {
            console.log("unreadable|the audit produced no JSON report");
            process.exit(0);
          }
          if (report && report.error) {
            const statuses = [...String(report.error.message ?? "").matchAll(/responded with (\d{3})/g)]
              .map((match) => Number(match[1]));
            const transient = statuses.length > 0
              && statuses.every((status) => status === 429 || (status >= 500 && status < 600));
            const first = (message) => String(message).split("\n")[0];
            const reported = first(report.error.message ?? "the advisory endpoint did not answer");
            console.log(String(report.error.code ?? "") === "ERR_PNPM_AUDIT_NO_LOCKFILE"
              ? "unreadable|" + reported
              : transient
                ? "transient|" + first("the advisory endpoint answered " + statuses.join(" and "))
                : "unreachable|" + reported);
            process.exit(0);
          }
          const advisories = report && report.advisories ? Object.keys(report.advisories).length : -1;
          if (advisories > 0) {
            const counts = report.metadata?.vulnerabilities ?? {};
            const summary = ["critical", "high", "moderate", "low", "info"]
              .map((severity) => (counts[severity] ?? 0) + " " + severity)
              .filter((entry) => !entry.startsWith("0 "))
              .join(", ");
            console.log("advisories|" + advisories + " advisories (" + (summary || "severities unreported") + ")");
            process.exit(0);
          }
          console.log(advisories === 0
            ? process.env.AUDIT_EXIT === "0"
              ? "clean|no known vulnerabilities found"
              : "unreadable|the audit report carried an empty advisories map and exited " + process.env.AUDIT_EXIT
            : "unreadable|the audit report carried no advisories field and exited " + process.env.AUDIT_EXIT);
          ')
            verdict="${result%%|*}"
            detail="${result#*|}"
            echo "attempt $attempt of $attempts, pnpm audit --json exited $code: $verdict — $detail"
            case "$verdict" in
              clean)
                echo "$detail"
                exit 0
                ;;
              advisories)
                echo "$detail"
                echo "advisory ids and patched versions:"
                node -e '
          const report = JSON.parse(require("node:fs").readFileSync("audit.json", "utf8"));
          for (const advisory of Object.values(report.advisories ?? {})) {
            console.log("  " + advisory.module_name + " " + advisory.severity + ": " + advisory.title
              + " (vulnerable " + advisory.vulnerable_versions + ", patched " + advisory.patched_versions + ")");
          }
          '
                exit 1
                ;;
              transient)
                cat audit.err
                if [ "$attempt" -lt "$attempts" ]; then
                  echo "$detail — a registry outage, not a finding; retrying"
                  sleep "$delay"
                  continue
                fi
                echo "$detail — the advisory endpoint was still unavailable after $attempts attempts"
                exit 1
                ;;
              *)
                cat audit.err
                echo "$detail — the lockfile was NOT audited, so this run reports nothing about it"
                exit 1
                ;;
            esac
          done
          exit 1
