name: dependency audit

# Lockfile-aware vulnerability audit: a detection signal, not a fix pipeline.
# pnpm audit reads pnpm-lock.yaml and queries the registry's advisory
# endpoint, so there is deliberately no project install and no build — which
# is also what keeps it safe to run on a pull request (issue 985).
#
# FORK SAFETY. The pull_request trigger means the checkout IS the pull request,
# so everything a pull request controls is an input to be checked rather than
# assumed harmless. What this workflow runs:
#
#   - the SHA-pinned `actions/checkout` and `actions/setup-node`, with no
#     `ref:` and no `repository:` taken from the event;
#   - `corepack enable`, `corepack install --global pnpm@10.33.0` and
#     `pnpm --version`, and later this file's `pnpm audit` — both under the
#     JOB-level env below, which is what stops the pull request's own
#     `packageManager` choosing the pnpm that either of them runs;
#   - this file's run script, and nothing else — no install, no build, no
#     module out of the checked-out tree. That is why the classifier below is a
#     run-script step rather than `scripts/dependency-audit.ts`:
#     `node scripts/anything.ts` would execute the pull request's copy of it.
#
# What it READS as data: pnpm-lock.yaml, package.json, and whatever `.npmrc`
# the pull request carries — the last neutralised by the same job-level env,
# because a project `.npmrc` can point the advisory endpoint at a registry the
# pull request controls. The permissions block stays at `contents: read`, which
# is all a fork run has.
#
# WHY THE OUTPUT IS MACHINE-READ. Captured against pnpm 10.33.0 — the version
# every step that runs pnpm resolves to under the job-level env below, which is
# what makes that claim hold rather than merely be written down — `pnpm audit`
# exits 1 both when the lockfile carries advisories and when the registry could
# not answer, so the exit code alone cannot tell a finding from an outage.
# `pnpm audit --json` tells them apart, and each of these three writes its
# whole report to stdout with stderr left empty:
#
#   clean       exit 0   {"advisories": {},      "metadata": {…}}
#   advisories  exit 1   {"advisories": {"1106913": {…}}, "metadata": {…}}
#   registry    exit 1   {"error": {"code": "ERR_PNPM_AUDIT_BAD_RESPONSE", …}}
#
# `error` and `advisories` are disjoint: a report carries one or the other, so
# "the audit never completed" and "the lockfile has findings" cannot both be
# true of one report. Anything else — empty stdout from an unusable invocation,
# a report with no `advisories` key, an empty `advisories` map with a nonzero
# exit — is neither, and is reported as unreadable rather than resolved. All
# three are red and all three share the verdict word, so they are told apart by
# the DETAIL, which names each of them for what it is: an unparseable report, a
# report with no `advisories` key, and a report whose `advisories` map was empty
# while pnpm exited nonzero. That last one is the case worth its own sentence —
# it is the only one of the three that says the report parsed AND carried a
# field, and a reader told it carried none goes hunting for a malformed report
# that is not there.
#
# The registry row was captured against a local server answering the advisory
# endpoint 503 and 429. pnpm tries `…/audits/quick`, falls back to `…/audits`,
# and on any non-200 throws AUDIT_BAD_RESPONSE naming BOTH statuses in its
# message — so the statuses are read back out of that message, and a retry is
# spent only when EVERY one of them is a 429 or in 500–599. One transient leg
# is not a transient answer: a 503 on the quick endpoint beside a 403 on the
# fallback is a registry that answered "no", and re-asking cannot change it.
#
# A transport failure (ECONNREFUSED, ERR_SOCKET_TIMEOUT) arrives in the same
# `error` shape with no status in it and is NOT retried. That is a coverage
# choice, not a safety one: retrying it could not mask an advisory, because the
# two branches are disjoint, so leaving it out buys no safety and costs a red
# run per network blip. It is left out because the retry was scoped to
# "registry 5xx/429", and holding an explicit line beats widening against one.
#
# One more `error` worth naming: a pull request that DELETES pnpm-lock.yaml
# makes pnpm answer ERR_PNPM_AUDIT_NO_LOCKFILE. That is reported red, which is
# right — there is no lockfile to audit and a human should see that. It is
# routed to `unreadable` rather than `unreachable` because no registry was ever
# asked: `unreachable` means an answered or unconnected registry, and there was
# neither. `unreadable` says the one true thing, which is that there is no
# report to read, and the detail carries pnpm's own sentence.
#
# THE RETRY IS NARROW ON PURPOSE. It fires on a transient registry answer and
# on nothing else — never on advisories, never on a 403 or a 404, never on
# output that does not parse. Re-asking a lockfile that carries advisories
# cannot change the answer, and a retry loop over every failure would turn a
# real finding into a delayed one while masking a broken invocation as a slow
# one. A finding fails on the first attempt. Three attempts, 30 seconds apart;
# the budget is pinned by the suite because a larger one would overrun this
# job's `timeout-minutes`.
#
# Do not add --audit-level to the command: it sets a severity bar, and findings
# below the bar still print but exit 0 (captured: a critical bar over 3 moderate
# + 3 high advisories printed all six and exited 0) — a bar on a detection
# signal silently passes below-bar findings. The bar itself is pinned instead:
# the job-level `npm_config_audit_level: "low"` below sets the severity bar at
# pnpm's lowest reportable rung, where the pull request's own `.npmrc`
# `audit-level=` cannot raise it (measured; see that pin's comment). Do not add
# --ignore-registry-errors: a
# registry outage also exits 1, so a red run would mean only "advisories
# found, or the registry could not answer" — either way a human looks, which is
# what a detection signal is for. The retry does not change what a red run
# MEANS and does not claim to: a sustained outage still ends red, exactly as
# before. What it changes is that a blip gets a second chance first.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
  pull_request:
    branches:
      - main
    # The sibling workflows' pull-request legs carry these three types
    # explicitly (ci.yml, actionlint.yml, ratchet-guard.yml). `edited` is
    # deliberately absent: a title edit changes no lockfile, and this workflow
    # is already narrowed by the path filter above.
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - package.json
      - pnpm-lock.yaml
  schedule:
    # Daily 06:37 UTC. The minute stays 37: it is the minimal diff, and it is
    # already this workflow's documented reason for being off the top of the
    # hour where the Actions queue is busiest. It also collides with nothing —
    # secret-scan fires at :41 and code-scanning at :43, so :37 is free. What
    # changed is the day-of-week: weekly meant an advisory published against an
    # unchanged pin went unreported for up to seven days, and Monday was the
    # slot every other weekly cron wanted.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Issue 1149 made `dependency-audit` a required context in
  # .github/required-checks.json, so this workflow is a required-context
  # producer and tests/ci/concurrency.test.ts refuses such a producer a
  # per-pull-request group — a cancelled conclusion on a required context is
  # the peer's blocked pull request, which no later push unblocks. The shape
  # is the bounded event-class form shared with the sibling producers: a
  # pull-request arrival joins one repository-level group, and every other
  # leg — push, schedule, dispatch — falls through to a private per-SHA group,
  # so no push to main shares a group with another event and the issue-474
  # deploy-gate refusal can never fire on this workflow's own pushes.
  #
  # cancel-in-progress is the literal false, for the same reason: no in-flight
  # run of a required context is ever destroyed. It does NOT stop GitHub
  # cancelling the PENDING run when a newer arrival claims the repo-wide
  # slot; that pull request stays blocked until its author pushes again.
  # (ci-pr.yml's block and tests/ci/concurrency.test.ts hold the full
  # argument and the measured rates.)
  group: dependency-audit-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: false

jobs:
  # The job id IS the required context's name: branch protection requires
  # `dependency-audit` and the relay's decideContexts matches producing jobs
  # by this name (issue 1149; formerly `audit`).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # JOB level, and that is the whole point. GitHub Actions `env:` is
    # step-scoped and does not carry forward, so a variable pinned on the step
    # that INSTALLS pnpm is simply absent from the environment of the step that
    # EXECUTES `pnpm audit` — which is how an earlier version of this file
    # shipped a fix that did nothing. Measured on the Node 24.17.0 pinned
    # below, replaying the two steps as separate processes against a
    # `packageManager` of `pnpm@9.15.9`:
    #
    #   step 1, with this variable on the step:  `pnpm --version` -> 10.33.0
    #   step 2, without it:                       `pnpm --version` -> 9.15.9
    #
    # At job level both variables are in effect for every step in the job,
    # including a step added later, and there is no step left on which to
    # forget one.
    env:
      # `corepack install --global pnpm@10.33.0` sets corepack's DEFAULT and
      # nothing more: when the `pnpm` shim runs, corepack otherwise reads
      # `packageManager` from the nearest package.json and downloads THAT
      # version. package.json is one of the two files this workflow's path
      # filter names, so without this the pull request picks the binary and
      # "verified against pnpm 10.33.0" describes a version it chose.
      #
      # This has to reach the step that runs `pnpm audit` and not merely the
      # one that installs pnpm, which is why it is here rather than on either
      # step. Set at job level, the audit step resolves a `pnpm@9.15.9` tree to
      # 10.33.0; set on the install step alone it resolves to 9.15.9.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      # pnpm reads `.npmrc` from the working directory, and a `registry=` there
      # redirects the advisory endpoint — a pull request touching both `.npmrc`
      # and `package.json` could point the audit at a registry it controls and
      # have the audit answer "no known vulnerabilities". `.npmrc` is not in the
      # path filter so that combination does not trigger on its own, but this
      # workflow already runs on the `package.json` half of it. Measured on
      # pnpm 10.33.0: a project `.npmrc` does redirect `pnpm config get
      # registry`, and this variable outranks it. corepack does not read
      # `.npmrc` at all, so the audit step is the only one with this exposure —
      # at job level it costs the install step nothing.
      npm_config_registry: "https://registry.npmjs.org/"
      # The transport half of the same attack. A project `.npmrc` `proxy=` or
      # `https-proxy=` is honoured by the audit's own HTTP agent, and an env
      # value cannot neutralise it: measured on pnpm 10.33.0, a non-empty
      # `npm_config_proxy`/`npm_config_https_proxy` is honoured and an EMPTY one
      # does NOT beat `.npmrc`, so no proxy pin exists — a pull request can
      # still choose the network path the audit request takes. What it cannot
      # choose is what the audit TRUSTS at the end of that path. Measured on
      # pnpm 10.33.0 against a local TLS endpoint: a project `strict-ssl=false`
      # accepts a self-signed certificate the default configuration rejects,
      # and `npm_config_strict_ssl` at `true` outranks it, so an intercepted
      # connection fails closed (red run) instead of reporting the
      # intercepting server's answer. The same measurement with a project
      # `cafile=` showed the cafile REPLACES the whole trust store — one
      # attacker-chosen CA would launder any interception — and the non-empty
      # `npm_config_cafile` outranks it, so the pin below holds the store at
      # the runner's system bundle. Both probe runs under the empty env values
      # left the project's attack in place, which is why these are values and
      # not empty strings.
      npm_config_strict_ssl: "true"
      npm_config_cafile: "/etc/ssl/certs/ca-certificates.crt"
      # The severity bar, pinned for the same reason as the registry above: the
      # audit reads it from the project `.npmrc` the pull request carries, and a
      # `.npmrc audit-level=critical` filters a HIGH advisory out of
      # `pnpm audit --json` — reported clean, exit 0, no MITM needed (measured
      # on pnpm 10.33.0 with an advisory carrying its github_advisory_id; the
      # earlier probe whose mock advisory lacked that field could never have
      # seen this filter). The audit resolves the bar as
      # `AUDIT_LEVEL_NUMBER[opts.auditLevel ?? "low"]` over the ladder
      # `{low: 0, moderate: 1, high: 2, critical: 3}` (dist/pnpm.cjs:137290,
      # :137504-137505), so `low` is the lowest bar the ladder defines and
      # reports every advisory pnpm can report. There is no lower safe value:
      # `npm_config_audit_level: "info"` was MEASURED filtering EVERY advisory —
      # the ladder has no `info` key, `AUDIT_LEVEL_NUMBER[severity] >=
      # undefined` is false for all four severities — so an "info" pin would
      # silently disable the audit. And the env value outranks `.npmrc`:
      # measured with `npm_config_audit_level=low` set, the same
      # `audit-level=critical` no longer filters the high advisory.
      npm_config_audit_level: "low"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Issue 1035, defence in depth. The audit honours the audit suppression
      # list the pull request writes into package.json (pnpm.auditConfig) AND,
      # as the fix-round-3 measurement below records, from pnpm-workspace.yaml;
      # the severity bar and the transport settings it honours from the pull
      # request's .npmrc. So before auditing, this leg deep-compares all three
      # files against the pull request's BASE, fetched by its pinned event SHA,
      # and refuses divergence — the audit then never runs on a divergent
      # configuration, and a red here says it moved without a maintainer-
      # reviewed merge.
      #
      # THIS LEG IS ADVISORY. It is defined by the pull request's own workflow
      # copy — this workflow runs under pull_request, so the checkout IS the
      # pull request — and the pull request could edit or delete the step. The
      # LOAD-BEARING guard is the same comparison in ci-pr.yml's verify job:
      # that job is base-defined and required, so a hostile pull request cannot
      # remove it and a red blocks the merge. All three files are read as git
      # objects on both sides (ls-tree single-blob discipline, 65536-byte cap,
      # NUL and UTF-8 refusals, an inline python pre-parse emitting the
      # canonical form of .pnpm.auditConfig and of the workspace file's and
      # .npmrc's audit-affecting subset, structural comparison), and every
      # refusal is a fixed constant carrying no pull-request bytes. Measured
      # with the repository's other gates: identical configurations exit 0
      # silently.
      #
      # WHY BOTH FILES, AND THE MEASUREMENT THAT FIRST SAID OTHERWISE. pnpm
      # 10.33.0, the version the Enable the pinned package manager step pins,
      # reads auditConfig from BOTH package.json and pnpm-workspace.yaml, so a
      # pull request CAN move the suppression list to the workspace file, and
      # guarding package.json alone is guarding half the list. Measured with
      # this repository's lockfile against a local registry answering one
      # advisory that carries its github_advisory_id: with the identical
      # ignoreGhsas entry present only in pnpm-workspace.yaml, the advisory was
      # suppressed end to end (clean, exit 0). The earlier comment here said
      # the opposite, and the reason it was wrong is recorded because the
      # failure mode is reusable: its probe's mock advisory carried NO
      # github_advisory_id, and pnpm's filter matches on exactly that field, so
      # no list from any source could have matched and "unsuppressed" was
      # guaranteed regardless of where the list lived — the measurement
      # measured its own broken fixture. pnpm's audit also reads auditLevel and
      # the registries mapping from pnpm-workspace.yaml (measured: a critical
      # auditLevel filters a high advisory, and the registries mapping BEATS a
      # pinned npm_config_registry, so it redirects the advisory endpoint) —
      # both are part of the workspace comparison below. THE OBLIGATION THIS
      # MEASUREMENT CARRIES: re-measure all three files' key sets on any bump
      # of the pnpm pin above. A version whose audit starts honouring a NEW
      # file or key would let a pull request silence the audit from a surface
      # neither guard reads, and nothing would go red — the re-measurement
      # belongs in the upgrade checklist beside that pin.
      - name: Refuse a pull request that changes the audit suppression list
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          file=package.json
          ws_file=pnpm-workspace.yaml
          npmrc_file=.npmrc
          
          # Two more suppression surfaces, measured on pnpm 10.33.0 with a real advisory
          # carrying its github_advisory_id (the invalid-first-leg lesson applied): the
          # audit honours auditConfig, auditLevel and the registries mapping from
          # pnpm-workspace.yaml — the mapping BEATS a pinned npm_config_registry, so it
          # redirects the advisory endpoint — and audit-level, registry, strict-ssl,
          # cafile, proxy and https-proxy from .npmrc. Both files are therefore compared
          # alongside package.json; absent compares equal to a file carrying none of the
          # audited keys, and an unparseable CHANGED file is a refusal, never a silent
          # pass.
          
          # Reads a commit's package.json as git objects with the ls-tree single-blob
          # discipline: exactly one mode-100644 blob entry at package.json, or refuse.
          # Prints the blob id on stdout.
          blob_of() {
            entries=$(git ls-tree "${1:?}" -- "${file}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::package.json must be exactly one mode-100644 blob entry in a tree; refusing. The suppression list is read from git objects, never from the filesystem, so a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          
          # Reads a commit's pnpm-workspace.yaml or .npmrc as git objects: absent is a
          # legitimate state — the files are optional — so unlike package.json it prints
          # the ABSENT sentinel instead of refusing. Any PRESENT shape other than exactly
          # one mode-100644 blob is a refusal: pnpm reads these files from the checkout
          # on disk, where a symlink leaf redirects the read outside the tree, so the
          # git-objects read must refuse what a filesystem read would follow.
          optional_entry_of() {
            entries=$(git ls-tree "${1:?}" -- "${2:?}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -eq 0 ]; then
              printf 'ABSENT\n'
              return 0
            fi
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::pnpm-workspace.yaml and .npmrc must be absent or exactly one mode-100644 blob entry in a tree; refusing. These files are read from git objects, never from the filesystem — pnpm reads the checkout on disk, where a symlink leaf redirects the read outside the tree, so a symlink leaf, a wrong mode and a non-blob type are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          
          # Pipes the named blob through the inline python pre-parse, which emits the
          # CANONICAL form of .pnpm.auditConfig: sort_keys and compact separators make
          # the dump uniquely parseable back to one value, so string equality of the two
          # sides is structural equality - key order, indentation and escaping in
          # package.json never reach the comparison, while every nested value and the
          # order of the ignoreGhsas list itself do.
          value_of() {
            git cat-file blob "${1:?}" | python3 -c "${pre_parse}"
          }
          
          # Projects one side's pnpm-workspace.yaml (a blob id, or the ABSENT sentinel)
          # to the canonical form of its audit-affecting settings. Absent compares equal
          # to a file carrying none of the audited keys; identical bytes cannot diverge,
          # so identical blob ids never reach the parse — the PyYAML install below runs
          # only when a side actually needs judging, and a runner without a working
          # module only ever reds a pull request that CHANGED the file.
          ws_value_of() {
            if [ "${1:?}" = "ABSENT" ]; then
              printf 'absent\n'
              return 0
            fi
            git cat-file blob "${1:?}" | PYTHONPATH="${pyyaml_site}${PYTHONPATH:+:${PYTHONPATH}}" python3 -c "${ws_pre_parse}"
          }
          
          # Projects one side's .npmrc to the canonical form of its audit-affecting
          # keys, with the same ABSENT handling as the workspace projection.
          npmrc_value_of() {
            if [ "${1:?}" = "ABSENT" ]; then
              printf 'absent\n'
              return 0
            fi
            git cat-file blob "${1:?}" | python3 -c "${npmrc_pre_parse}"
          }
          
          pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::package.json is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::package.json carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::package.json is not valid UTF-8; refusing\n")
              sys.exit(1)
          try:
              parsed = json.loads(text)
          except ValueError:
              sys.stderr.write("::error::package.json does not parse as JSON; refusing\n")
              sys.exit(1)
          config = None
          if isinstance(parsed, dict):
              pnpm = parsed.get("pnpm")
              if isinstance(pnpm, dict):
                  config = pnpm.get("auditConfig")
          if config is None:
              sys.stdout.write("absent")
          else:
              sys.stdout.write(json.dumps(config, sort_keys=True, separators=(",", ":")))
          PY
          )
          ws_pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc carry a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are not valid UTF-8; refusing\n")
              sys.exit(1)
          try:
              import yaml
          except ImportError:
              sys.stderr.write("::error::python3 has no yaml module; refusing to judge pnpm-workspace.yaml without it — the hash-pinned install above provides it, so a missing module means the install failed and is a red run, never a silent pass\n")
              sys.exit(1)
          try:
              parsed = yaml.safe_load(text)
          except Exception:
              sys.stderr.write("::error::pnpm-workspace.yaml does not parse as a mapping of settings; refusing to judge the audit-affecting settings without a parse\n")
              sys.exit(1)
          if parsed is None:
              parsed = {}
          if not isinstance(parsed, dict):
              sys.stderr.write("::error::pnpm-workspace.yaml does not parse as a mapping of settings; refusing to judge the audit-affecting settings without a parse\n")
              sys.exit(1)
          projection = {}
          for key in ("auditConfig", "auditLevel", "registries"):
              if key in parsed:
                  projection[key] = parsed[key]
          try:
              dump = json.dumps(projection, sort_keys=True, separators=(",", ":"))
          except (TypeError, ValueError):
              sys.stderr.write("::error::pnpm-workspace.yaml carries audit-affecting settings that do not serialize to JSON; refusing\n")
              sys.exit(1)
          sys.stdout.write(dump if projection else "absent")
          PY
          )
          
          npmrc_pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc carry a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are not valid UTF-8; refusing\n")
              sys.exit(1)
          ALLOWED = ("audit-level", "registry", "strict-ssl", "cafile", "proxy", "https-proxy")
          projection = {}
          for line in text.split("\n"):
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or stripped.startswith(";"):
                  continue
              if "=" not in stripped:
                  sys.stderr.write("::error::.npmrc carries a line that is neither blank, a comment, nor key=value; refusing to judge its audit-affecting keys without a parse\n")
                  sys.exit(1)
              key, _, value = stripped.partition("=")
              key = key.strip().lower()
              value = value.strip()
              if not key:
                  sys.stderr.write("::error::.npmrc carries a line that is neither blank, a comment, nor key=value; refusing to judge its audit-affecting keys without a parse\n")
                  sys.exit(1)
              if key in ALLOWED:
                  projection[key] = value
          if projection:
              sys.stdout.write(json.dumps(projection, sort_keys=True, separators=(",", ":")))
          else:
              sys.stdout.write("absent")
          PY
          )

          # The workspace parse needs PyYAML, and the runner image does not
          # ship it. The module is installed from the BASE's hash-pinned
          # manifest — the fetched FETCH_HEAD, read from git objects exactly
          # like the audited files, so a pull request can neither substitute
          # the manifest nor the wheel content (--require-hashes). Called only
          # when the two sides' pnpm-workspace.yaml blob ids differ; identical
          # trees skip the install (and its network round trip) entirely.
          pyyaml_manifest_of() {
            entries=$(git ls-tree "${1:?}" -- "${manifest}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -eq 0 ]; then
              echo "::error::.github/requirements-pyyaml.txt is missing from the base; the workspace gate judges pnpm-workspace.yaml with a hash-pinned PyYAML install and refuses without it — the manifest moves only through a maintainer-reviewed merge, like the list it installs for" >&2
              exit 1
            fi
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::.github/requirements-pyyaml.txt must be exactly one mode-100644 blob entry in the base; refusing. The manifest is read from git objects, never from the filesystem — a pull request can neither substitute it nor hide it — so a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }

          # Validates the manifest by the pin grammar (pyyaml==VERSION followed
          # by one to 32 --hash=sha256:HEX64 values) and writes the sanitized
          # copy pip installs from — no includes, index options, URL lines or
          # environment markers ever reach pip.
          pyyaml_manifest_pre_parse=$(cat <<'PY'
          import os
          import re
          import sys

          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::the PyYAML manifest is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::the PyYAML manifest carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::the PyYAML manifest is not valid UTF-8; refusing\n")
              sys.exit(1)
          pin = re.compile(r"pyyaml==[A-Za-z0-9][A-Za-z0-9._+-]*( --hash=sha256:[0-9a-f]{64}){1,32}")
          accepted = None
          for number, line in enumerate(text.split("\n"), start=1):
              if line == "" or line.startswith("#"):
                  continue
              if accepted is not None:
                  sys.stderr.write(f"::error::line {number}: the PyYAML manifest carries a second requirement line; exactly one is allowed\n")
                  sys.exit(1)
              if pin.fullmatch(line) is None:
                  sys.stderr.write(f"::error::line {number}: refused by the pin grammar — the one accepted shape is pyyaml==VERSION followed by one to 32 --hash=sha256:HEX64 values; includes, index options, URL lines, environment markers, CRLF and stray whitespace are refused\n")
                  sys.exit(1)
              accepted = line
          if accepted is None:
              sys.stderr.write("::error::the PyYAML manifest carries no requirement line; refusing\n")
              sys.exit(1)
          with open(os.environ["PYAML_SANITIZED_REQUIREMENTS"], "w", encoding="utf-8", newline="\n") as handle:
              handle.write(accepted)
              handle.write("\n")
          PY
          )

          install_pyyaml() {
            manifest=.github/requirements-pyyaml.txt
            pyyaml_manifest=$(pyyaml_manifest_of "${1:?}")
            sanitized="${RUNNER_TEMP}/pyyaml-manifest-check"
            if [ -e "${sanitized}" ] || [ -L "${sanitized}" ]; then
              echo "::error::${sanitized} already exists; refusing to write the sanitized pin into a directory this run did not create"
              exit 1
            fi
            mkdir -- "${sanitized}"
            git cat-file blob "${pyyaml_manifest}" | PYAML_SANITIZED_REQUIREMENTS="${sanitized}/requirements.txt" python3 -c "${pyyaml_manifest_pre_parse}" || return 1
            # pip writes its progress to stdout; this function's stdout is the
            # site path the caller captures, so pip's own output is diverted to
            # the step log — captured, it would ride inside PYTHONPATH and the
            # import would fall back to the system module or fail.
            pip install --no-deps --require-hashes --disable-pip-version-check --no-input --retries 2 --timeout 60 --target "${sanitized}/site" -r "${sanitized}/requirements.txt" 1>&2 || return 1
            printf '%s\n' "${sanitized}/site"
          }

          if ! git fetch --quiet --depth=1 origin "${BASE_SHA:?}"; then
            echo "::error::could not fetch the pull request's base commit; refusing to judge the suppression list without it" >&2
            exit 1
          fi
          base_blob=$(blob_of FETCH_HEAD)
          merge_blob=$(blob_of HEAD)
          base_value=$(value_of "${base_blob}") || exit 1
          merge_value=$(value_of "${merge_blob}") || exit 1
          if [ "${base_value}" != "${merge_value}" ]; then
            echo "::error::this pull request changes pnpm.auditConfig; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
            exit 1
          fi
          base_ws=$(optional_entry_of FETCH_HEAD "${ws_file}")
          merge_ws=$(optional_entry_of HEAD "${ws_file}")
          if [ "${base_ws}" != "${merge_ws}" ]; then
            pyyaml_site=$(install_pyyaml FETCH_HEAD) || exit 1
            base_ws_value=$(ws_value_of "${base_ws}") || exit 1
            merge_ws_value=$(ws_value_of "${merge_ws}") || exit 1
            if [ "${base_ws_value}" != "${merge_ws_value}" ]; then
              echo "::error::this pull request changes audit-affecting settings in pnpm-workspace.yaml; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
              exit 1
            fi
          fi
          
          base_npmrc=$(optional_entry_of FETCH_HEAD "${npmrc_file}")
          merge_npmrc=$(optional_entry_of HEAD "${npmrc_file}")
          if [ "${base_npmrc}" != "${merge_npmrc}" ]; then
            base_npmrc_value=$(npmrc_value_of "${base_npmrc}") || exit 1
            merge_npmrc_value=$(npmrc_value_of "${merge_npmrc}") || exit 1
            if [ "${base_npmrc_value}" != "${merge_npmrc_value}" ]; then
              echo "::error::this pull request changes audit-affecting keys in .npmrc; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
              exit 1
            fi
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      # Reads pnpm-lock.yaml directly — no pnpm install, no build — and is the
      # only step that reads anything the pull request controls other than the
      # lockfile itself. Every run ends in exactly one of five verdicts: clean,
      # advisories, transient (a 5xx or 429 to retry), unreachable (an answered
      # or unconnected registry that is not retryable), and unreadable. The
      # verdict word is echoed into this step's log, so the last two stay
      # distinguishable to whoever reads a red run; they share the same arm and
      # the same exit status, which is asserted too. `unreadable` fails closed
      # rather than reading as a clean lockfile, which is the failure mode a
      # detection signal cannot have.
      - name: Audit lockfile advisories
        run: |
          set -uo pipefail
          attempts=3
          delay="${DEPENDENCY_AUDIT_RETRY_DELAY_SECONDS:-30}"
          for attempt in $(seq 1 "$attempts"); do
            code=0
            pnpm audit --json > audit.json 2> audit.err || code=$?
            result=$(AUDIT_EXIT="$code" node -e '
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          } catch {
            console.log("unreadable|the audit produced no JSON report");
            process.exit(0);
          }
          if (report && report.error) {
            const statuses = [...String(report.error.message ?? "").matchAll(/responded with (\d{3})/g)]
              .map((match) => Number(match[1]));
            const transient = statuses.length > 0
              && statuses.every((status) => status === 429 || (status >= 500 && status < 600));
            const first = (message) => String(message).split("\n")[0];
            const reported = first(report.error.message ?? "the advisory endpoint did not answer");
            console.log(String(report.error.code ?? "") === "ERR_PNPM_AUDIT_NO_LOCKFILE"
              ? "unreadable|" + reported
              : transient
                ? "transient|" + first("the advisory endpoint answered " + statuses.join(" and "))
                : "unreachable|" + reported);
            process.exit(0);
          }
          const advisories = report && report.advisories ? Object.keys(report.advisories).length : -1;
          if (advisories > 0) {
            const counts = report.metadata?.vulnerabilities ?? {};
            const summary = ["critical", "high", "moderate", "low", "info"]
              .map((severity) => (counts[severity] ?? 0) + " " + severity)
              .filter((entry) => !entry.startsWith("0 "))
              .join(", ");
            console.log("advisories|" + advisories + " advisories (" + (summary || "severities unreported") + ")");
            process.exit(0);
          }
          console.log(advisories === 0
            ? process.env.AUDIT_EXIT === "0"
              ? "clean|no known vulnerabilities found"
              : "unreadable|the audit report carried an empty advisories map and exited " + process.env.AUDIT_EXIT
            : "unreadable|the audit report carried no advisories field and exited " + process.env.AUDIT_EXIT);
          ')
            verdict="${result%%|*}"
            detail="${result#*|}"
            echo "attempt $attempt of $attempts, pnpm audit --json exited $code: $verdict — $detail"
            case "$verdict" in
              clean)
                echo "$detail"
                exit 0
                ;;
              advisories)
                echo "$detail"
                echo "advisory ids and patched versions:"
                node -e '
          const report = JSON.parse(require("node:fs").readFileSync("audit.json", "utf8"));
          for (const advisory of Object.values(report.advisories ?? {})) {
            console.log("  " + advisory.module_name + " " + advisory.severity + ": " + advisory.title
              + " (vulnerable " + advisory.vulnerable_versions + ", patched " + advisory.patched_versions + ")");
          }
          '
                exit 1
                ;;
              transient)
                cat audit.err
                if [ "$attempt" -lt "$attempts" ]; then
                  echo "$detail — a registry outage, not a finding; retrying"
                  sleep "$delay"
                  continue
                fi
                echo "$detail — the advisory endpoint was still unavailable after $attempts attempts"
                exit 1
                ;;
              *)
                cat audit.err
                echo "$detail — the lockfile was NOT audited, so this run reports nothing about it"
                exit 1
                ;;
            esac
          done
          exit 1
