name: dependency audit

# Lockfile-aware vulnerability audit: a detection signal, not a fix pipeline.
# pnpm audit reads pnpm-lock.yaml and queries the registry's advisory
# endpoint, so there is deliberately no project install and no build — which
# is also what keeps it safe to run on a pull request (issue 985).
#
# FORK SAFETY. The pull_request trigger means the checkout IS the pull request,
# so everything a pull request controls is an input to be checked rather than
# assumed harmless. What this workflow runs:
#
#   - the SHA-pinned `actions/checkout` and `actions/setup-node`, with no
#     `ref:` and no `repository:` taken from the event;
#   - `corepack enable`, `corepack install --global pnpm@10.33.0` and
#     `pnpm --version`, and later this file's `pnpm audit` — both under the
#     JOB-level env below, which is what stops the pull request's own
#     `packageManager` choosing the pnpm that either of them runs;
#   - this file's run script, and nothing else — no install, no build, no
#     module out of the checked-out tree. That is why the classifier below is a
#     run-script step rather than `scripts/dependency-audit.ts`:
#     `node scripts/anything.ts` would execute the pull request's copy of it.
#
# What it READS as data: pnpm-lock.yaml, package.json, and whatever `.npmrc`
# the pull request carries — the last neutralised by the same job-level env,
# because a project `.npmrc` can point the advisory endpoint at a registry the
# pull request controls. The permissions block stays at `contents: read`, which
# is all a fork run has.
#
# WHY THE OUTPUT IS MACHINE-READ. Captured against pnpm 10.33.0 — the version
# every step that runs pnpm resolves to under the job-level env below, which is
# what makes that claim hold rather than merely be written down — `pnpm audit`
# exits 1 both when the lockfile carries advisories and when the registry could
# not answer, so the exit code alone cannot tell a finding from an outage.
# `pnpm audit --json` tells them apart, and each of these three writes its
# whole report to stdout with stderr left empty:
#
#   clean       exit 0   {"advisories": {},      "metadata": {…}}
#   advisories  exit 1   {"advisories": {"1106913": {…}}, "metadata": {…}}
#   registry    exit 1   {"error": {"code": "ERR_PNPM_AUDIT_BAD_RESPONSE", …}}
#
# `error` and `advisories` are disjoint: a report carries one or the other, so
# "the audit never completed" and "the lockfile has findings" cannot both be
# true of one report. Anything else — empty stdout from an unusable invocation,
# a report with no `advisories` key, an empty `advisories` map with a nonzero
# exit — is neither, and is reported as unreadable rather than resolved.
#
# The registry row was captured against a local server answering the advisory
# endpoint 503 and 429. pnpm tries `…/audits/quick`, falls back to `…/audits`,
# and on any non-200 throws AUDIT_BAD_RESPONSE naming BOTH statuses in its
# message — so the statuses are read back out of that message, and a retry is
# spent only when EVERY one of them is a 429 or in 500–599. One transient leg
# is not a transient answer: a 503 on the quick endpoint beside a 403 on the
# fallback is a registry that answered "no", and re-asking cannot change it.
#
# A transport failure (ECONNREFUSED, ERR_SOCKET_TIMEOUT) arrives in the same
# `error` shape with no status in it and is NOT retried. That is a coverage
# choice, not a safety one: retrying it could not mask an advisory, because the
# two branches are disjoint, so leaving it out buys no safety and costs a red
# run per network blip. It is left out because the retry was scoped to
# "registry 5xx/429", and holding an explicit line beats widening against one.
#
# One more `error` worth naming: a pull request that DELETES pnpm-lock.yaml
# makes pnpm answer ERR_PNPM_AUDIT_NO_LOCKFILE. That is reported red, which is
# right — there is no lockfile to audit and a human should see that.
#
# THE RETRY IS NARROW ON PURPOSE. It fires on a transient registry answer and
# on nothing else — never on advisories, never on a 403 or a 404, never on
# output that does not parse. Re-asking a lockfile that carries advisories
# cannot change the answer, and a retry loop over every failure would turn a
# real finding into a delayed one while masking a broken invocation as a slow
# one. A finding fails on the first attempt. Three attempts, 30 seconds apart;
# the budget is pinned by the suite because a larger one would overrun this
# job's `timeout-minutes`.
#
# Do not add --audit-level: it sets a severity bar, and findings below the bar
# still print but exit 0 (captured: a critical bar over 3 moderate + 3 high
# advisories printed all six and exited 0) — a bar on a detection signal
# silently passes below-bar findings. Do not add --ignore-registry-errors: a
# registry outage also exits 1, so a red run would mean only "advisories
# found, or the registry could not answer" — either way a human looks, which is
# what a detection signal is for. The retry does not change what a red run
# MEANS and does not claim to: a sustained outage still ends red, exactly as
# before. What it changes is that a blip gets a second chance first.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
  pull_request:
    branches:
      - main
    # The sibling workflows' pull-request legs carry these three types
    # explicitly (ci.yml, actionlint.yml, ratchet-guard.yml). `edited` is
    # deliberately absent: a title edit changes no lockfile, and this workflow
    # is already narrowed by the path filter above.
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - package.json
      - pnpm-lock.yaml
  schedule:
    # Daily 06:37 UTC. The minute stays 37: it is the minimal diff, and it is
    # already this workflow's documented reason for being off the top of the
    # hour where the Actions queue is busiest. It also collides with nothing —
    # secret-scan fires at :41 and code-scanning at :43, so :37 is free. What
    # changed is the day-of-week: weekly meant an advisory published against an
    # unchanged pin went unreported for up to seven days, and Monday was the
    # slot every other weekly cron wanted.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request, and cancellation true only on a pull-request
  # event. On the schedule, push and dispatch legs
  # github.event.pull_request.number is null, so the group falls through to
  # github.ref and nothing cancels an in-flight run — the daily tick is never
  # disturbed. On a pull-request event the group is dependency-audit-<number>,
  # so the run a new push cancels is always that same pull request's superseded
  # head, and the push that superseded it scheduled the replacement. Cancelling
  # it costs nothing: an audit is reproducible from the next push, and this
  # workflow produces no required check, so a cancelled run blocks no merge.
  # (Not ci.yml's shape, which is one repository-level group for every pull
  # request: bounding this one there would cap the audit at a single run no
  # matter how many pull requests are open. tests/ci/concurrency.test.ts holds
  # the entry and the reasoning.)
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # JOB level, and that is the whole point. GitHub Actions `env:` is
    # step-scoped and does not carry forward, so a variable pinned on the step
    # that INSTALLS pnpm is simply absent from the environment of the step that
    # EXECUTES `pnpm audit` — which is how an earlier version of this file
    # shipped a fix that did nothing. Measured on the Node 24.17.0 pinned
    # below, replaying the two steps as separate processes against a
    # `packageManager` of `pnpm@9.15.9`:
    #
    #   step 1, with this variable on the step:  `pnpm --version` -> 10.33.0
    #   step 2, without it:                       `pnpm --version` -> 9.15.9
    #
    # At job level both variables are in effect for every step in the job,
    # including a step added later, and there is no step left on which to
    # forget one.
    env:
      # `corepack install --global pnpm@10.33.0` sets corepack's DEFAULT and
      # nothing more: when the `pnpm` shim runs, corepack otherwise reads
      # `packageManager` from the nearest package.json and downloads THAT
      # version. package.json is one of the two files this workflow's path
      # filter names, so without this the pull request picks the binary and
      # "verified against pnpm 10.33.0" describes a version it chose.
      #
      # This is also the step that runs `pnpm audit`, so the variable has to
      # reach there and not merely the install step. With it set at job level,
      # that step resolves a `pnpm@9.15.9` tree to 10.33.0.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      # pnpm reads `.npmrc` from the working directory, and a `registry=` there
      # redirects the advisory endpoint — a pull request touching both `.npmrc`
      # and `package.json` could point the audit at a registry it controls and
      # have the audit answer "no known vulnerabilities". `.npmrc` is not in the
      # path filter so that combination does not trigger on its own, but this
      # workflow already runs on the `package.json` half of it. Measured on
      # pnpm 10.33.0: a project `.npmrc` does redirect `pnpm config get
      # registry`, and this variable outranks it. corepack does not read
      # `.npmrc` at all, so the audit step is the only one with this exposure —
      # at job level it costs the install step nothing.
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      # Reads pnpm-lock.yaml directly — no pnpm install, no build — and is the
      # only step that reads anything the pull request controls other than the
      # lockfile itself. Every run ends in exactly one of five verdicts: clean,
      # advisories, transient (a 5xx or 429 to retry), unreachable (an answered
      # or unconnected registry that is not retryable), and unreadable. The
      # verdict word is echoed into this step's log, so the last two stay
      # distinguishable to whoever reads a red run; they share the same arm and
      # the same exit status, which is asserted too. `unreadable` fails closed
      # rather than reading as a clean lockfile, which is the failure mode a
      # detection signal cannot have.
      - name: Audit lockfile advisories
        run: |
          set -uo pipefail
          attempts=3
          delay="${DEPENDENCY_AUDIT_RETRY_DELAY_SECONDS:-30}"
          for attempt in $(seq 1 "$attempts"); do
            code=0
            pnpm audit --json > audit.json 2> audit.err || code=$?
            result=$(AUDIT_EXIT="$code" node -e '
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          } catch {
            console.log("unreadable|the audit produced no JSON report");
            process.exit(0);
          }
          if (report && report.error) {
            const statuses = [...String(report.error.message ?? "").matchAll(/responded with (\d{3})/g)]
              .map((match) => Number(match[1]));
            const transient = statuses.length > 0
              && statuses.every((status) => status === 429 || (status >= 500 && status < 600));
            const first = (message) => String(message).split("\n")[0];
            console.log(transient
              ? "transient|" + first("the advisory endpoint answered " + statuses.join(" and "))
              : "unreachable|" + first(report.error.message ?? "the advisory endpoint did not answer"));
            process.exit(0);
          }
          const advisories = report && report.advisories ? Object.keys(report.advisories).length : -1;
          if (advisories > 0) {
            const counts = report.metadata?.vulnerabilities ?? {};
            const summary = ["critical", "high", "moderate", "low", "info"]
              .map((severity) => (counts[severity] ?? 0) + " " + severity)
              .filter((entry) => !entry.startsWith("0 "))
              .join(", ");
            console.log("advisories|" + advisories + " advisories (" + (summary || "severities unreported") + ")");
            process.exit(0);
          }
          console.log(advisories === 0 && process.env.AUDIT_EXIT === "0"
            ? "clean|no known vulnerabilities found"
            : "unreadable|the audit report carried no advisories field and exited " + process.env.AUDIT_EXIT);
          ')
            verdict="${result%%|*}"
            detail="${result#*|}"
            echo "attempt $attempt of $attempts, pnpm audit --json exited $code: $verdict — $detail"
            case "$verdict" in
              clean)
                echo "$detail"
                exit 0
                ;;
              advisories)
                echo "$detail"
                echo "advisory ids and patched versions:"
                node -e '
          const report = JSON.parse(require("node:fs").readFileSync("audit.json", "utf8"));
          for (const advisory of Object.values(report.advisories ?? {})) {
            console.log("  " + advisory.module_name + " " + advisory.severity + ": " + advisory.title
              + " (vulnerable " + advisory.vulnerable_versions + ", patched " + advisory.patched_versions + ")");
          }
          '
                exit 1
                ;;
              transient)
                cat audit.err
                if [ "$attempt" -lt "$attempts" ]; then
                  echo "$detail — a registry outage, not a finding; retrying"
                  sleep "$delay"
                  continue
                fi
                echo "$detail — the advisory endpoint was still unavailable after $attempts attempts"
                exit 1
                ;;
              *)
                cat audit.err
                echo "$detail — the lockfile was NOT audited, so this run reports nothing about it"
                exit 1
                ;;
            esac
          done
          exit 1
