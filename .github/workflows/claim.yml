name: claim

# GitHub has no built-in self-assignment; in Overflow the assignee field is what reserves a
# sponsor's credit, and the assignment fires the `issues` `assigned` webhook Overflow already
# reconciles, so the claim reaches the ledger with no further wiring. `/claim` assigns the commenter
# to an open, unassigned issue; `/unclaim` and `/release` are one command under two names removing
# only the commenter's OWN assignment.

on:
  issue_comment:
    types: [created]

# Narrowest token: nothing reads the tree, so no checkout and no contents: read.
permissions:
  issues: write

concurrency:
  # Per issue, NOT cancel-in-progress: two racers must both get an answer.
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claim:
    # A PR is an issue to this event (its assignees mean something else); a closed issue can't be worked;
    # a bot's comment is never a claim. Cheap prefilter only — the shared action enforces the exact body.
    if: >-
      github.event.issue.pull_request == null
      && github.event.issue.state == 'open'
      && github.event.comment.user.type != 'Bot'
      && (contains(github.event.comment.body, '/claim')
          || contains(github.event.comment.body, '/unclaim')
          || contains(github.event.comment.body, '/release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: Nitjsefnie-Actions/claim@d9976f1f803f7a662eed3be17772800b7925e650
