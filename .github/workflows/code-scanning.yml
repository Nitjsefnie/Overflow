name: code scanning

# A detection signal on application source, not a pipeline gate. CodeQL for
# JS/TS extracts from source, so there is deliberately no install and no
# build — the same principle as the dependency audit's no-install audit.
# Findings land in the Security tab as a triage surface for a human; they do
# not block a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 05:43 UTC, off the top of the hour where the Actions queue
    # is busiest. Query packs evolve, so periodic re-analysis is the point.
    - cron: "43 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A per-PR group lets a newer run cancel only the same PR's older scan.
  # Other PRs have separate groups; push, schedule and dispatch runs key on
  # their SHA and never cancel an in-flight run.
  group: code-scanning-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    # Least privilege at the job level: only what uploading SARIF requires.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
