name: code scanning

# A detection signal on application source, not a pipeline gate. CodeQL for
# JS/TS extracts from source, so there is deliberately no install and no
# build — the same principle as the dependency audit's no-install audit.
# Findings land in the Security tab as a triage surface for a human; they do
# not block a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 05:43 UTC, off the top of the hour where the Actions queue
    # is busiest. Query packs evolve, so periodic re-analysis is the point.
    - cron: "43 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same event-class shape as ci.yml: every pull request shares one
  # repository-level group, so the repository's Actions minutes stop scaling
  # with the number of open pull requests, and GitHub keeps one PENDING run per
  # group so `code-scanning-repo-wide` is a single slot. Scheduled and
  # main-branch runs key on their own SHA. The parentheses are load-bearing:
  # && binds tighter than ||, and without them the pull_request arm falls
  # through to github.sha and the bound is gone.
  #
  # cancel-in-progress is false here too, even though this workflow is NOT one
  # of the required contexts in .github/required-checks.json — so a cancelled
  # run blocks nobody, which is the whole argument for letting it cancel. The
  # flag still adds no bound (GitHub cancels the pending run in a group by
  # default), and what it would buy is the unused remainder of a ~2 minute
  # analyze job on roughly 30% of arrivals. What it would cost is the SARIF
  # upload: cancelling mid-analysis discards the scan for that pull request and
  # the next run may not come. The same rule as the three required workflows is
  # worth more here than the remainder it saves, and one rule is one rule for
  # the next workflow to follow. See ci.yml's concurrency block for the full
  # argument and the measured contention rate.
  group: code-scanning-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege at the job level: only what uploading SARIF requires.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
