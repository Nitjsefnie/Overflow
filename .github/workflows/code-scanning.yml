name: code scanning

# A detection signal on application source, not a pipeline gate. CodeQL for
# JS/TS extracts from source, so there is deliberately no install and no
# build — the same principle as the dependency audit's no-install audit.
# Findings land in the Security tab as a triage surface for a human; they do
# not block a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 05:43 UTC, off the top of the hour where the Actions queue
    # is busiest. Query packs evolve, so periodic re-analysis is the point.
    - cron: "43 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same event-class shape as ci.yml: every pull request shares one
  # repository-level group, so the repository's Actions minutes stop scaling
  # with the number of open pull requests, and GitHub keeps one PENDING run per
  # group so `code-scanning-repo-wide` is a single slot. Scheduled and
  # main-branch runs key on their own SHA and queue instead of cancelling each
  # other, and cancellation is gated on the event being a pull request. The
  # parentheses are load-bearing: && binds tighter than ||, and without them
  # the pull_request arm falls through to github.sha and the bound is gone.
  group: code-scanning-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege at the job level: only what uploading SARIF requires.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
