name: code scanning

# A detection signal on application source, not a pipeline gate. CodeQL for
# JS/TS extracts from source, so there is deliberately no install and no
# build — the same principle as the dependency audit's no-install audit.
# Findings land in the Security tab as a triage surface for a human; they do
# not block a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 05:43 UTC, off the top of the hour where the Actions queue
    # is busiest. Query packs evolve, so periodic re-analysis is the point.
    - cron: "43 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A per-PR group lets a newer run cancel only the same PR's older scan.
  # Other PRs have separate groups; push, schedule and dispatch runs key on
  # their SHA and never cancel an in-flight run.
  group: code-scanning-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      records-only: ${{ steps.changes.outputs.records-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the push diff
        id: changes
        env:
          OVERFLOW_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_records.py classify >> "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || (needs.changes.result == 'success' && needs.changes.outputs.records-only != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    # Least privilege at the job level: only what uploading SARIF requires.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
