name: actionlint

# The gate on the gates. actionlint checks workflow/schema/expression/shell
# correctness; zizmor independently checks workflow security and supply-chain
# posture. Both are pinned, and actionlint's archive is checksum-verified.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the upstream
      # checksums file. Bump the version and checksum together.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          python -m pip install --upgrade pip
          pip install zizmor==1.29.0

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Still run when actionlint finds a schema issue so one invocation
        # reports both classes of failure. Do not run if installation failed.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/

      # A pull_request run tests refs/pull/N/merge — the head merged with the
      # base as it stood at event time — and branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # scripts/ci-base-freshness.sh, which certifies when the base is
      # unchanged OR advanced only disjointly from the files this pull request
      # changes — an advance that touched none of them carried its own required
      # checks, and only cross-file interaction goes unverified — and refuses
      # on everything else: an overlapping advance, a failed or empty API
      # response, an unrepresentative compare (issue 510; the first version
      # demanded main frozen for the whole run, which no run could satisfy at
      # the repository's merge cadence). Push and workflow_dispatch runs test
      # main itself and skip the gate.
      - name: Base freshness
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-base-freshness.sh
