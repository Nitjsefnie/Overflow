name: actionlint

# The gate on the gates. actionlint checks workflow/schema/expression/shell
# correctness; zizmor independently checks workflow security and supply-chain
# posture. Both are pinned, and actionlint's archive is checksum-verified.
#
# pull_request_target so the definition, the checkout and the tools all come
# from main: a pull request that edits its own workflow files cannot shape
# the gate that judges them (issue 822). The PR head is data-only, like
# ratchet-guard: it enters only as git objects (refs/pull/<N>/head), and is
# extracted as data into .github/workflows-pr/ with `git show` — never
# checked out, installed or executed. The `# zizmor: ignore[dangerous-triggers]`
# annotation marks the trigger for the same reason ratchet-guard.yml's header
# gives: pull_request_target is dangerous in general and safe here because no
# pull-request code runs, and the job's token is contents:read-only.
on:
  push:
    branches: [main]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group for every pull request, so the repository's Actions minutes stop
  # scaling with the number of open pull requests. GitHub keeps one PENDING run
  # per group and cancels the superseded one, so `actionlint-repo-wide` is a
  # single slot. Every other leg — push, workflow_dispatch — keys on its own
  # SHA. The parentheses are load-bearing: && binds tighter than ||, and without
  # them the pull_request arm falls through to github.sha and the bound is gone.
  #
  # cancel-in-progress is false because the group is shared by every pull
  # request, and this job is a required context in .github/required-checks.json.
  # GitHub cancels the PENDING run in a group by default whatever this flag says,
  # so the flag adds no bound — it only decides whether the RUNNING job is
  # destroyed as well, and on a shared group that run can belong to a different
  # pull request. See ci.yml's concurrency block for the full argument and the
  # measured contention rate.
  group: actionlint-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: false

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the upstream
      # checksums file. Bump the version and checksum together.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      # Under pull_request_target no ref input at all: GitHub points GITHUB_REF
      # at the default branch and GITHUB_SHA at its last commit, so the
      # default checkout is the trusted base — main's tip — never the merge
      # ref, and actions/checkout's fork guard exempts exactly that. The PR's
      # own .github/workflows/ is never the lint target; it is fetched below
      # as git objects and extracted as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The head is fetched only as git objects, and only under
      # pull_request_target — the other events have no pull request to fetch.
      # Values from the event reach the shell through env:, never through
      # ${{ }} interpolation in run:.
      - name: Fetch the pull request head
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          pip install --require-hashes -r .github/requirements-zizmor.txt

      # Populated on every event, so the lint steps keep one runtime-invariant
      # target: on pull_request_target from the fetched head ref via `git show`
      # (the PR's tree is never checked out); on push and workflow_dispatch by
      # copying the checked-out, trusted tree's own workflows.
      - name: Collect the workflow files to lint
        run: |
          mkdir -p .github/workflows-pr
          if [ "${GITHUB_EVENT_NAME}" = pull_request_target ]; then
            git ls-tree -z --name-only refs/remotes/pr/head:.github/workflows/ |
              while IFS= read -r -d '' f; do
                git show "refs/remotes/pr/head:.github/workflows/$f" > ".github/workflows-pr/$f"
              done
          else
            cp .github/workflows/*.yml .github/workflows-pr/
          fi

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows-pr/*.yml

      - name: zizmor
        # Still run when actionlint finds a schema issue so one invocation
        # reports both classes of failure. Do not run if installation failed.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows-pr/*.yml

      # A pull_request_target run tests refs/pull/N/merge — the head merged with the
      # base as it stood at event time — and branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # scripts/ci-base-freshness.sh, which certifies when the base is
      # unchanged OR advanced only disjointly from the files this pull request
      # changes — an advance that touched none of them carried its own required
      # checks, and only cross-file interaction goes unverified — and refuses
      # on everything else: an overlapping advance, a failed or empty API
      # response, an unrepresentative compare (issue 510; the first version
      # demanded main frozen for the whole run, which no run could satisfy at
      # the repository's merge cadence). Push and workflow_dispatch runs test
      # main itself and skip the gate.
      - name: Base freshness
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-base-freshness.sh
