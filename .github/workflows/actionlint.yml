name: actionlint

# The gate on the gates. actionlint checks workflow/schema/expression/shell
# correctness; zizmor independently checks workflow security and supply-chain
# posture. Both are pinned, and actionlint's archive is checksum-verified.
#
# THE PULL-REQUEST LEG IS NOT HERE (issue 1090). It is
# .github/workflows/actionlint-pr.yml, whose only trigger is
# `pull_request_target`, because it fetches a pull request's head ref and a
# privileged trigger would run that step with the default branch's privileges.
# What is left here — push to main and workflow_dispatch — lints main's own
# checked-out tree and reads no pull-request data at all: no `refs/pull`
# fetch, no `pull_request.*` value in any step's `run` or `env`.
# tests/ci/pr-data-triggers.test.ts decides that from the workflow text rather
# than from this comment, and refuses any job that both runs a
# checkout/fetch/pull and names a pull-request-derived value outside a
# pull_request_target-only workflow.
#
# Both files produce the `actionlint` job name, and
# .github/required-checks.json pins that context to BOTH paths, so a
# required-context conclusion arrives on a pull-request head and on a main
# push alike.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every leg here keys on its own SHA, so no push to main and no dispatch
  # shares a group: GitHub keeps one PENDING run per group and cancels the
  # superseded one even with cancel-in-progress false, and a cancelled
  # conclusion on a merged SHA makes the deploy gate refuse immediately
  # (issue 474). There is no pull-request leg in this file to bound — the one
  # repository-level group is actionlint-pr-repo-wide, in the sibling.
  #
  # cancel-in-progress is false so no in-flight run is destroyed; on a
  # per-SHA group the run it could destroy is this SHA's own earlier attempt,
  # which a later push replaces anyway.
  group: actionlint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # actionlint from the Nitjsefnie-OSC fork, not from rhysd/actionlint.
      # Upstream's newest release is still 1.7.12, and its workflow schema has no
      # `queue` key under `concurrency` — the key claim.yml needs so a second
      # /claim arriving mid-run is queued rather than dropped unanswered. Stock
      # 1.7.12 fails that file as an unexpected key, which would leave the gate
      # unable to lint the workflow it exists to lint.
      #
      # RETURN TO UPSTREAM as soon as an upstream release accepts `queue` under
      # `concurrency`: set ACTIONLINT_REPO back to rhysd/actionlint, take the
      # version and the sha256 from that release's own checksums file, and
      # re-verify .github/workflows/ with the stock binary.
      # tests/api/ci-workflows.test.ts pins all three values by exact equality, so
      # it goes red until the same change bumps them there; the failure names
      # the mismatched key. Until then the fork release is the same upstream code plus
      # that one schema key. Keep these three in step with actionlint-pr.yml, which
      # installs the same gate on the pull-request leg.
      ACTIONLINT_REPO: Nitjsefnie-OSC/actionlint
      ACTIONLINT_VERSION: 1.7.12-queue.1
      # sha256 of actionlint_1.7.12-queue.1_linux_amd64.tar.gz from the fork's
      # checksums file. Bump the repository, version and checksum together.
      ACTIONLINT_SHA256: dcc2c42a7caaa197dfe63584a3851f62ef260f80b2cf221baaf05479661e1521

    steps:
      # The default checkout: on push it is the pushed commit and on dispatch
      # the selected ref, both trusted main-line content. No `refs/pull`
      # fetch happens in this file, so nothing here is pull-request content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/${ACTIONLINT_REPO}/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          pip install --require-hashes -r .github/requirements-zizmor.txt

      # The lint target is the checked-out, trusted tree's own workflows. The
      # pull-request leg extracts the head ref's workflows with `git show`
      # instead; it is actionlint-pr.yml that does that.
      - name: Collect the workflow files to lint
        run: |
          mkdir -p .github/workflows-pr
          cp .github/workflows/*.yml .github/workflows-pr/

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows-pr/*.yml

      - name: zizmor
        # Still run when actionlint finds a schema issue so one invocation
        # reports both classes of failure. Do not run if installation failed.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows-pr/*.yml
