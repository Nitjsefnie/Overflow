name: ratchet guard

# pull_request_target so the gate survives a malicious PR that disables the
# pull_request workflow: the workflow definition, the checkout and the script
# that executes all come from main, never from the pull request. The head is
# fetched only as git objects (refs/pull/<N>/head) and read as data with
# `git show` inside scripts/check-ratchets.ts — no head code is checked out,
# installed, built or executed. The `push` trigger covers the same story for
# commits main itself lands: this repo merges with --rebase, so a merged SHA
# is a brand-new commit that no pull_request run covered, and every push to
# main must carry a ratchet-guard run for the check to be required and for
# the deploy gate (scripts/deploy-revision.sh) to pass on the tip it lands —
# the gate checks only the fetched tip of main, which is always a pushed
# tip. Under push the executed script comes from the previous main tip
# (github.event.before) and the pushed commit is read only as git objects.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    # main only: a PR retargeted to main (an edited event) gets no new run,
    # so without this filter its stale green would carry over — required
    # contexts match by name on the head SHA
    branches: [main]
    types: [opened, synchronize, reopened]
  # No paths filter: every push to main must get its own run, or deploys of
  # the tip it lands wait out `ratchet-guard (absent)` and refuse.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pushes to main must never share a group: GitHub keeps only one PENDING
  # run per concurrency group and cancels the older pending one even with
  # cancel-in-progress false, and a cancelled conclusion on a merged SHA
  # makes the deploy gate refuse immediately. Keying on the SHA gives each
  # push its own group; pull requests keep one group per PR, where
  # cancellation supersedes the queued rest.
  group: ratchet-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  ratchet-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Under pull_request_target no ref input at all: GitHub points
      # GITHUB_REF at the default branch and GITHUB_SHA at its last commit,
      # so the default checkout is the trusted base, never the merge ref,
      # and actions/checkout's fork guard exempts exactly that. main
      # provides scripts/check-ratchets.ts under both events; untrusted
      # content contributes no byte of the executed code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      # Under push the ref is github.event.before, the previous main tip,
      # whose copy of scripts/check-ratchets.ts executes. The event-name
      # gate replaces the `ref: A && B || ''` idiom, whose empty-string
      # fallback would silently check out the pushed commit and run its
      # script when `before` is empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          ref: ${{ github.event.before }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      # Head content enters only as git objects in refs/remotes/pr/head.
      # Values from the event reach the shell through env:, never through
      # ${{ }} interpolation in the script.
      - name: Fetch the pull request head
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      # The base of the comparison is the checked-out commit itself — under
      # pull_request_target that is main's tip when the event fired (GITHUB_SHA) — never
      # the event's base.sha: that value is recorded when the pull request
      # opens and can trail main, and once the branch has rebased onto a
      # newer main the merge base of the stale base and the head sits below
      # the real fork point, so the guard would compare against the looser
      # document at that older base and pass a real relaxation. Checking
      # against main's latest commit cannot have that failure: a newer base
      # only moves the merge base forward. The head SHA is the commit the
      # event is about (passed through env, never ${{ }} in run:); if it was
      # force-pushed away and is unreachable, the script exits 2 and the
      # concurrency group has already cancelled the superseded run.
      - name: Ratchet documents
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ratchets.ts HEAD "$HEAD_SHA"

      # Push: the pushed commit enters only as git objects, fetched onto
      # FETCH_HEAD; the event value reaches the shell through env:, never
      # through ${{ }} interpolation in the script.
      - name: Fetch the pushed commit
        if: ${{ github.event_name == 'push' }}
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: git fetch --no-tags origin "$PUSHED_SHA"

      # The base is HEAD — the checked-out previous main tip
      # (github.event.before), a direct ancestor of the pushed SHA, so the
      # merge base is the previous tip itself and the comparison is exactly
      # "did this push relax a ratchet document relative to the main it
      # replaced". If the pushed SHA were somehow unreachable, the script
      # exits 2 and the run fails.
      - name: Ratchet documents against the previous main
        if: ${{ github.event_name == 'push' }}
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: node scripts/check-ratchets.ts HEAD "$PUSHED_SHA"
