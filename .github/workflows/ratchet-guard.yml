name: ratchet guard

# THE PULL-REQUEST LEG IS NOT HERE (issue 1090). It is
# .github/workflows/ratchet-guard-pr.yml, whose only trigger is
# `pull_request_target`, because it fetches a pull request's head ref and a
# privileged trigger would run that step with the default branch's privileges.
# What is left here — push to main and workflow_dispatch — reads no
# pull-request data at all: no `refs/pull` fetch, no `pull_request.*` value in
# any step's `run` or `env`. tests/ci/pr-data-triggers.test.ts decides that
# from the workflow text rather than from this comment.
#
# Both files produce the `ratchet-guard` job name, and
# .github/required-checks.json pins that context to BOTH paths, so a
# required-context conclusion arrives on a pull-request head and on a main
# push alike.
#
# The `push` trigger covers the same story for commits main itself lands: this
# repo merges with --rebase, so a merged SHA is a brand-new commit that no
# pull_request run covered, and every push to main must carry a ratchet-guard
# run for the check to be required and for the deploy gate
# (scripts/deploy-revision.sh) to pass on the tip it lands — the gate checks
# only the fetched tip of main. Under push the executed script comes from the
# previous main tip (github.event.before) and the pushed commit is read only as
# git objects. A dropped push event (issue 796) can leave a main tip with no
# runs; workflow_dispatch recovers that tip by comparing it against the last
# certified main tip, not HEAD^1 or a guessed `before`. The dispatched SHA
# enters only as git objects. All executed code comes from the checked-out,
# trusted main ancestor, never untrusted content.
on:
  # No paths filter: every push to main must get its own run, or deploys of
  # the tip it lands wait out `ratchet-guard (absent)` and refuse.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Full SHA of the newest main commit carrying a successful ratchet-guard run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Pushes to main must never share a group: GitHub keeps only one PENDING
  # run per concurrency group and cancels the older pending one even with
  # cancel-in-progress false, and a cancelled conclusion on a merged SHA
  # makes the deploy gate refuse immediately. Keying on the SHA gives each
  # push its own group. Dispatch keys on the SHA it was handed, so a dispatch
  # never contends with the push that landed the same commit.
  #
  # There is no pull-request leg in this file to bound: the one
  # repository-level group is ratchet-guard-pr-repo-wide, in the sibling.
  #
  # cancel-in-progress is false so no in-flight run is destroyed; on a per-SHA
  # group the run it could destroy is this SHA's own earlier attempt.
  group: ratchet-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ratchet-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each event must have a comparison path; otherwise a new trigger could
      # produce a green job that ran only setup-node.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Unhandled ratchet-guard event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # Reject an invalid dispatch before checkout touches the supplied ref.
      # The input enters the shell only through env, never expression interpolation.
      - name: Validate dispatch base and ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BASE_SHA: ${{ inputs.base }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Dispatch must target refs/heads/main"
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch base must be a full lowercase 40-character SHA"
            exit 1
          fi

      # Under push the ref is github.event.before, the previous main tip,
      # whose copy of scripts/check-ratchets.ts executes.
      # On a push GitHub always sets `before` to a 40-hex SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          ref: ${{ github.event.before }}
          persist-credentials: false
          fetch-depth: 0

      # Dispatch checks out the supplied base only after format/ref checks.
      # Prove it is a trusted main ancestor before any setup action can probe
      # checkout-controlled files such as Yarn configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
          fetch-depth: 0

      # Fetch the dispatched tip as git objects only. A missed push can span
      # multiple commits, so HEAD^1 is not the last certified baseline.
      - name: Fetch the dispatched commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: git fetch --no-tags origin "$DISPATCHED_SHA"

      # Both objects are present. Fail before setup-node, whose Yarn probe
      # could execute checkout-controlled configuration from an arbitrary SHA.
      - name: Validate dispatch ancestry
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$DISPATCHED_SHA" ]]; then
            echo "::error::Dispatch base must differ from the dispatched commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "$DISPATCHED_SHA"; then
            echo "::error::Dispatch base must be an ancestor of the dispatched commit"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      # Push: the pushed commit enters only as git objects, fetched onto
      # FETCH_HEAD; the event value reaches the shell through env:, never
      # through ${{ }} interpolation in the script.
      - name: Fetch the pushed commit
        if: ${{ github.event_name == 'push' }}
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: git fetch --no-tags origin "$PUSHED_SHA"

      # The base is HEAD — the checked-out previous main tip
      # (github.event.before), which for a non-forced push is a direct
      # ancestor of the pushed SHA, so the merge base is the previous tip
      # itself and the comparison is exactly "did this push relax a ratchet
      # document relative to the main it replaced". If the pushed SHA were
      # somehow unreachable, the script exits 2 and the run fails.
      - name: Ratchet documents against the previous main
        if: ${{ github.event_name == 'push' }}
        env:
          PUSHED_SHA: ${{ github.sha }}
        run: node scripts/check-ratchets.ts HEAD "$PUSHED_SHA"

      # HEAD is the last certified main tip; the dispatched tip remains data.
      # The two endpoint documents are compared as one interval change, like
      # a push run on a multi-commit push. Intermediate relaxations that are
      # later re-tightened past the base are not reported by this comparison.
      - name: Ratchet documents against the last certified main tip
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DISPATCHED_SHA: ${{ github.sha }}
        run: node scripts/check-ratchets.ts HEAD "$DISPATCHED_SHA"
