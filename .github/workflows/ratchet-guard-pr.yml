name: ratchet guard pull request

# The pull-request leg of the ratchet guard, in a file of its own so that the
# only trigger it can be started by is `pull_request_target` (issue 1090).
#
# WHY THE SPLIT. This job fetches a pull request's head ref and compares it to
# a trusted base. `push`, `schedule` and `workflow_dispatch` all run a workflow
# from the default branch with the default branch's privileges, so a step
# reading pull-request content under one of them is untrusted content entering a
# privileged job — the shape CodeQL's
# `actions/cache-poisoning/poisonable-step` and `actions/untrusted-checkout`
# alerts report. The `if: github.event_name == 'pull_request_target'` gates
# that used to hold the shapes apart made the paths safe, not structural.
# tests/ci/pr-data-triggers.test.ts decides which jobs read pull-request data
# from the workflow text and requires this file's whole `on:` set to be
# {pull_request_target}.
#
# The other half — the push and dispatch legs, which read no pull-request data
# at all — is .github/workflows/ratchet-guard.yml. Both files produce the
# `ratchet-guard` job name, and .github/required-checks.json pins that context
# to BOTH paths.
#
# pull_request_target so the gate survives a malicious PR that disables the
# pull_request workflow: the workflow definition, the checkout and the script
# that executes all come from main, never from the pull request. The head is
# fetched only as git objects (refs/pull/<N>/head) and read as data with
# `git show` inside scripts/check-ratchets.ts — no head code is checked out,
# installed, built or executed.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    # main only: a PR retargeted to main (an edited event) gets no new run,
    # so without this filter its stale green would carry over — required
    # contexts match by name on the head SHA
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Every pull request shares one repository-level group, so the repository's
  # Actions minutes stop scaling with the number of open pull requests; GitHub
  # keeps one PENDING run per group and cancels the superseded one, so
  # `ratchet-guard-pr-repo-wide` is a single slot. The parentheses are
  # load-bearing: && binds tighter than || in a GitHub expression, and without
  # them the pull_request arm falls through to github.sha and the bound is gone.
  #
  # cancel-in-progress is false, so no in-flight run is destroyed — on a group
  # shared by every pull request, a destroyed run can belong to a peer, and
  # `ratchet-guard` is a required context in .github/required-checks.json that
  # ledger-relay mirrors a run conclusion onto. It does NOT stop GitHub
  # cancelling the PENDING run when a newer arrival claims the single pending
  # slot: that run can be another pull request's current head with no
  # replacement, which strands its author until they push again. Neither value
  # of this flag removes that; `true` adds destroyed in-flight runs on top of
  # it. See ci.yml's concurrency block for the full argument and the measured
  # rates.
  group: ratchet-guard-pr-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: false

jobs:
  ratchet-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each event must have a comparison path; otherwise a new trigger could
      # produce a green job that ran only setup-node. On a file whose `on:` is
      # one event this guard is not the load-bearing check — the closed-set
      # assertion in tests/ci/pr-data-triggers.test.ts is, and it refuses the
      # extra trigger at build time rather than at run time — but it is the
      # backstop for the edit that lands before any of this is re-run.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request_target" ]]; then
            echo "::error::Unhandled ratchet-guard event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # No ref input at all: GitHub points GITHUB_REF at the default branch
      # and GITHUB_SHA at its last commit, so the default checkout is the
      # trusted base — main's tip — never the merge ref, and actions/checkout's
      # fork guard exempts exactly that. main provides
      # scripts/check-ratchets.ts; untrusted content contributes no byte of the
      # executed code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      # Head content enters only as git objects in refs/remotes/pr/head.
      # Values from the event reach the shell through env:, never through
      # ${{ }} interpolation in the script.
      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      # The base of the comparison is the checked-out commit itself — under
      # pull_request_target that is main's tip when the event fired (GITHUB_SHA) — never
      # the event's base.sha: that value is recorded when the pull request
      # opens and can trail main, and once the branch has rebased onto a
      # newer main the merge base of the stale base and the head sits below the real
      # fork point, so the guard would compare against the looser
      # document at that older base and pass a real relaxation. Checking
      # against main's latest commit cannot have that failure: a newer base
      # only moves the merge base forward. The head SHA is the commit the
      # event is about (passed through env, never ${{ }} in run:); if it was
      # force-pushed away and is unreachable, the script exits 2 and the
      # concurrency group has already cancelled the superseded run.
      - name: Ratchet documents
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ratchets.ts HEAD "$HEAD_SHA"
