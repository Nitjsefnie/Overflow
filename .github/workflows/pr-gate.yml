name: pr gate

# pull_request_target: a fork's pull_request token is read-only, so its
# comment and close would silently do nothing. The pinned action runs its
# own reviewed code and reads consumer policy from the PR's base SHA through
# GitHub's API; no consumer checkout or PR-head execution is needed.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  # Runs for one pull request queue and GitHub keeps only the newest pending
  # one. Never cancel: a cancelled run may already have closed, and the
  # queued run is what reads that and repairs it.
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Nitjsefnie-Actions/pr-gate@50ace1bb77b0599079a3ba0590a7f81794402a19
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          pull-request-author: ${{ github.event.pull_request.user.login }}
