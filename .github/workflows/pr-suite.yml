name: pr suite

# The pull request's own suite, run with no trust. This workflow runs under
# `pull_request`, so its definition and every byte it executes are the pull
# request's: the install, the migrations, the tests, lint, typecheck, the
# production build and the page geometry check. It therefore holds a
# read-only token, references no secret, uses no environment, persists no
# credential, and produces no required context — its job is deliberately not
# named after one.
#
# Its outcome is read as DATA by ci-pr.yml's verify job, which runs under
# pull_request_target from the base branch's definition: the base copy of
# scripts/await-pr-suite.ts accepts only a completed, successful
# pull_request run of exactly this file at exactly the event's head SHA, and
# the base copy of scripts/check-coverage-floor.ts judges the coverage
# summary this run uploads. The integrity gates (migration immutability,
# legal revisions, commit scopes, module size, the coverage floor, base
# freshness) are verify's, never this workflow's. The ledger relay never
# posts a required context from a run of this workflow.
#
# The patch-coverage artifact uploaded here is what coverage-comment.yml
# reads when this workflow completes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# One group per pull request: a newer push to the same pull request
# supersedes its older suite run, and nothing else can. verify awaits the run
# at the event's own head SHA, so a superseded run is one no verify is
# waiting on to succeed.
concurrency:
  group: pr-suite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      APP_URL: https://overflow.invalid
      GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      MODERATOR_GITHUB_USER_IDS: "1"
      # At job scope so every `pnpm` step inherits both pins.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      # The default pull_request checkout is the merge commit GitHub built for
      # this event: base tip first parent, head second. Depth 2 carries the
      # first parent, which the docs-only detection and the patch coverage
      # report diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      # The interpreter actionlint.yml installs zizmor with, pinned the same way:
      # full commit SHA plus the release comment. A floating tag would let this
      # workflow's own definition — the pull request's — choose the interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Binds .github/requirements-zizmor.txt's hashes to the version on its pin
      # line, on the PULL REQUEST's own tree (issue 1094). `--require-hashes`
      # makes pip resolve `zizmor==<version>` from the index and refuse any
      # artifact whose sha256 is not in the file, so a manifest that kept the
      # previous release's hashes under a bumped version fails here — before the
      # merge, in the one workflow that checks out and runs the request's bytes.
      #
      # This had no home on a pull request: actionlint.yml is the only other
      # place the flag is used, and its pull_request_target leg checks out main's
      # tip with no `ref:` (actionlint.yml:80), so it installs MAIN's manifest
      # and cannot see the request's. A Dependabot bump with stale hashes
      # therefore merged green and reddened the required `actionlint` context on
      # the push to main instead. Dependabot-core's own hash refresh does not
      # fire on this file either — the manifest's header comment naming the old
      # version is what its declaration scan matches first — so the arrival is
      # reliably stale and this is the only pre-merge catcher.
      #
      # `pip download`, not an install: nothing is executed and no package is
      # placed on the runner, only resolved and checksummed. `--no-deps` keeps it
      # to the one pin. Unconditional on purpose — the manifest is not
      # application code, and a docs-only detection must not be able to skip it.
      # Reads no secret and needs no token: PyPI is anonymous, and the hash
      # pinning is what makes the download trustworthy.
      #
      # SCOPE, stated rather than left to be assumed: with no --platform flag pip
      # resolves the artifact for THIS runner, so what is verified here is the
      # platform's entry against the version — the case that actually occurs (a
      # bump carrying the whole previous hash set, as PR 1007 does). It is not
      # proof that all eleven entries belong to the version: a manifest stale in
      # only some other platform's wheel would pass here. Verified, not assumed —
      # a manifest with this platform's wheel correct and the other ten entries
      # from 1.29.0 still exits 0. The test file's own hash assertions do not
      # close that either, and are not asked to; see the dependabot pip lane.
      #
      # What WOULD close it is not a matrix: pip resolves cross-platform from one
      # runner, so a loop over the published filenames checks every WHEEL from
      # here — `--only-binary=:all: --platform <tag> --python-version 3.13
      # --implementation cp --abi cp313`, one iteration per wheel (measured:
      # rc=0 on the correct macOS arm64 digest, rc=1 on 1.29.0's). Every wheel,
      # NOT every entry: `--only-binary=:all:` means pip never fetches the sdist,
      # so that eleventh hash needs its own `--no-binary=:all:` pass, without the
      # `--platform` flags (measured both ways — the sdist loop as written exits
      # 0 on a stale sdist digest, and the `--no-binary=:all:` arm exits 1). Left
      # open because it costs one download per artifact per pull request — ten
      # wheels plus that sdist pass, against the one this step runs — and the
      # arrival this branch exists to catch is wholesale, which one download
      # already catches. A future change that wants the stronger guarantee should
      # loop; nothing about the current step prevents it.
      - name: Verify the zizmor pin's hashes match its version
        run: |
          pip download --no-deps --require-hashes \
            --dest "${RUNNER_TEMP}/zizmor-hash-check" \
            -r .github/requirements-zizmor.txt

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      # Decides only whether THIS run measures coverage. verify makes its own
      # docs-only decision with the base copy of the script, and requires this
      # run's coverage summary whenever that decision says code.
      - name: Detect docs-only change
        id: detect-docs
        run: |
          changed=$(node scripts/docs-only.ts HEAD^1)
          echo "docs_only=${changed}" >> "$GITHUB_OUTPUT"

      - name: Test suite
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: pnpm test --run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=cobertura --coverage.include='src/**'

      - name: Test suite (docs-only)
        if: ${{ steps.detect-docs.outputs.docs_only == 'true' }}
        run: pnpm test --run

      # Informational, never a gate. HEAD^1..HEAD is exactly the change the
      # pull request carries: GitHub merges the head into the base, so the
      # base tip is the merge commit's first parent.
      - name: Patch coverage report
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: git diff HEAD^1 HEAD | node scripts/patch-coverage.ts coverage/cobertura-coverage.xml

      - name: Upload patch coverage report
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-coverage
          path: coverage/patch-coverage.json
          if-no-files-found: error
          retention-days: 7

      # Seven days: verify downloads this artifact cross-run, and a verify
      # re-run or relay heal can come well after the suite finished.
      - name: Upload coverage summary
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Page geometry check
        run: node scripts/check-page-geometry.mjs
