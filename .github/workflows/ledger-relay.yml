name: ledger relay

# Re-posts the six required contexts as check-runs owned by the Overflow
# Ledger GitHub App (app id 5118623), so branch protection can pin each
# required context to the App instead of the github-actions app. Every relay
# start shares one concurrency group: only one relay run writes at a time
# across the repository. Up to 100 pending starts wait in FIFO order (ordering
# is not guaranteed); a full queue cancels the new arrival. Every start sweeps
# to attest a cancelled arrival's producer within the sweep window, deduplicated
# against the App's own check-runs at each candidate commit. The sweep also re-dispatches eligible
# cancelled producer runs while their pull request's head is still live.
# A workflow_run runs this workflow's definition from the default branch's
# tip, in the default branch's context, so the pin map and the script executed
# here are always the trusted main tip, never pull-request content. Check-run
# writes go through the App installation token the script mints; the rerun
# and the read of this job's own start go through the workflow's own
# repo-scoped token, which holds contents: read + actions: write.
on:
  # workflow_run runs this definition from the default branch's tip, in the
  # default branch's context: the checkout, the pin map and the script are
  # main's own, nothing from the triggering run is checked out, installed or
  # executed, and every event value reaches the script through env:, never
  # through ${{ }} interpolation in run:.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    # The filter matches name: fields. Main-push producers, verify's
    # PR producer, comment share, and the four-job privileged PR aggregate all relay.
    workflows:
      - "ci"
      - "actionlint"
      - "ratchet guard"
      - "ci pull request"
      - "secret scan"
      - "dependency audit"
      - "pr gates"
      - "comment share"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the completed producer run whose relay posting died and must be re-posted"
        required: false
        default: ""
        type: string
  # Sweep every ten minutes without waiting for another producer completion.
  # Every start sweeps, including a start that refuses its triggering producer;
  # a scheduled start shares the same serialized group as every other start.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  # actions: write exists only for the rerun-heal (issue 861): when a producer
  # run was cancelled out of the shared pending concurrency slot while its pull
  # request's head is still live, the relay re-dispatches it. The rerun
  # authenticates as this workflow's own repo-scoped github.token, NOT the
  # ledger App's — the App keeps its narrow permission set — and a rerun
  # re-enters pr-gates.yml's group for the same pull request and follows that
  # group's cancellation policy. Other pull requests have separate groups.
  contents: read
  actions: write

concurrency:
  # Schedule, dispatch with or without run_id, and workflow_run share one
  # literal group: only one relay run writes at a time across the repository.
  group: ledger-relay
  # `false` preserves the running start. Up to 100 pending starts wait in FIFO
  # order (ordering is not guaranteed); a full queue cancels the new arrival.
  # Every start sweeps to attest a cancelled arrival's producer within the sweep window.
  cancel-in-progress: false
  queue: max

jobs:
  # Never named after a required context: protection matches a required check
  # by name and app, so a job named verify/actionlint/ratchet-guard here would
  # satisfy protection without the App's identity. Held by
  # tests/ci/required-checks.test.ts.
  relay-required-checks:
    runs-on: ubuntu-latest
    # Bound every step: 2 + 2 + 11 = 15 minutes; the job gets 1 minute more.
    # The relay step must exceed its script budget: 600s deadline + 30s last
    # request + (1s + 2s) backoff = 633s < 660s (11 minutes).
    # The job timeout also covers the runner's unbounded "Set up job" phase,
    # so the script reads this job's started_at and starts no request later
    # than started_at + 16 min - 30s request bound - 60s margin. The value is
    # RELAY_JOB_TIMEOUT_MINUTES in scripts/ledger-relay-job-budget.ts, and the
    # job id is the name that read selects: change neither alone.
    timeout-minutes: 16
    environment: overflow-ledger
    steps:
      # No ref input: under workflow_run the default checkout is the default
      # branch's tip — the trusted main tip the pin map is read from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: "24.17.0"

      # Event data reaches the script through env only, never ${{ }}
      # interpolation in run:.
      - name: Relay the required checks under the ledger App
        timeout-minutes: 11
        env:
          LEDGER_APP_ID: "5118623"
          LEDGER_INSTALLATION_ID: "166057493"
          LEDGER_APP_KEY: ${{ secrets.LEDGER_APP_KEY }}
          GITHUB_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_WORKFLOW_RUN_PATH: ${{ github.event.workflow_run.path }}
          GITHUB_WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GITHUB_WORKFLOW_RUN_HTML_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          # With the event, decides whether the run executed main's definition;
          # a pinned run that did not is refused, and the sweep still runs.
          GITHUB_WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RELAY_RERUN_TOKEN: ${{ github.token }}
          # Rule: the job-start read uses the runner's default GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT; never set them here.
          LEDGER_DISPATCH_RUN_ID: ${{ inputs.run_id }}
          # A schedule or a dispatch without run_id has no triggering run to
          # mirror. Carry the sweep-only mode so the script fails closed on
          # ambiguity with a named run; every mode sweeps and shares one group.
          LEDGER_SWEEP_ONLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_id == '') }}
        run: node scripts/ledger-relay.ts
