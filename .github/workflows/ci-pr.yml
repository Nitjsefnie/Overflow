name: ci pull request
run-name: verify for pr suite run ${{ github.event.workflow_run.id }}

# The required verify producer starts only after pr suite completes. workflow_run
# uses the default branch's definition and checkout, whose scripts judge the PR
# merge tree as data; no pull-request code executes here (issues 822, 1090, 1183).
# The base-copy resolver API-validates the triggering run's path, event and
# completion, then binds exactly one open PR to its head repository and branch,
# forks included. Success requires the exact head SHA. An API-proven superseded
# cancellation skips later steps; every other non-success or ambiguous head
# fails verify. The job itself is never skippable.
#
# The pull request's own install, migrations, tests, lint, typecheck, build and
# page geometry run only in pr-suite.yml under pull_request. The base checkout's
# integrity gates judge the materialised merge tree. The exact triggering suite
# run and one supersession listing are read by await-pr-suite.ts; no polling.
# Newer same-head runs or attempts refuse certification. Coverage floor
# reads that run's summary as data, and Base freshness stays last. The relay
# resolves the upstream id from run-name and publishes verify on its head SHA,
# never this default-branch workflow_run run's own head SHA. ci.yml separately
# produces verify for main pushes and dispatches.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] — default-branch checkout only, API-bound head repository/branch/SHA, PR tree and artifacts read only as data; base scripts execute, never PR code
    workflows: [pr suite]
    types: [completed]

permissions:
  contents: read

# Completions can arrive out of head order: a per-PR cancelling group could
# let a stale head's verify destroy the current head's. Isolate each head SHA
# and preserve running work, including retries of the same head.
concurrency:
  group: ci-pr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read the triggering suite run, bind its open PR, and download its summary.
    # The resolver needs pull-requests: read; no step receives a write grant.
    permissions:
      contents: read
      actions: read
      pull-requests: read

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system. There is no
    # PostgreSQL service here and none is needed: no step in this file applies a
    # migration or connects to a database, because the pull request's own code —
    # which is what would need the schema — runs in pr-suite.yml.
    env:
      DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      APP_URL: https://overflow.invalid
      GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      MODERATOR_GITHUB_USER_IDS: "1"

    steps:
      # workflow_run defaults to the trusted default branch's checkout, not
      # the triggering run's head. Full history serves the integrity gates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"

      # Reuse coverage-comment's owner:branch + exact repository/SHA binding.
      # Read the triggering run from the API and re-read the selected PR so a
      # moved successful head fails closed; a superseded cancellation is a no-op.
      # This is always the base checkout's script.
      - name: Resolve the suite's pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node "${GITHUB_WORKSPACE}/scripts/resolve-suite-pull-request.ts"

      # The pull request enters as git objects only: the suite's head SHA and
      # the current PR base SHA from the resolver. Fetch each by SHA, never a
      # refs/pull/<number> refspec or head ref. The head is never checked out
      # in the workspace, installed or executed. The two-parent bind is the
      # trust boundary: the materialised commit must merge exactly the
      # resolved base and suite head, or the step fails closed.
      #
      # Build the merge here: GitHub's merge preview is asynchronous and can
      # still name an earlier head's merge. A local merge of these exact SHAs
      # cannot substitute that old head. A conflict fails, with no fallback.
      # Materialise the merge as a detached worktree under RUNNER_TEMP, outside
      # the base workspace. Later steps receive path and SHA through env: as
      # PR_TREE and MERGE_SHA. Only base copies of scripts execute over it.
      - name: Materialise the pull request's merge tree as data
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        id: pr-tree
        env:
          # The API-bound suite head and current PR base, not the workflow_run
          # producer's own default-branch SHA or an asynchronous merge preview.
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          # actions/checkout's default: checking the tree out fetches no LFS
          # object the pull request's attributes point at.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          if ! git fetch --no-tags origin "${HEAD_SHA:?}"; then
            echo "::error::could not fetch the pull request's head ${HEAD_SHA} from origin; refusing to judge a tree this event is not about"
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA:?}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin "${BASE_SHA:?}"; then
              echo "::error::could not fetch the pull request's base ${BASE_SHA} from origin; refusing to judge a tree this event is not about"
              exit 1
            fi
          fi
          # Main's linear history makes this fork point no newer than the base
          # the suite tested. Freshness must cover the entire potentially
          # untested advance; static gates still merge the current PR base.
          if ! freshness_base=$(git merge-base --all "${BASE_SHA:?}" "${HEAD_SHA:?}"); then
            echo "::error::could not compute the freshness merge-base; refusing to certify"
            exit 1
          fi
          if [[ "$freshness_base" == *$'\n'* ]] || ! printf '%s' "$freshness_base" | grep -Eq '^[0-9a-f]{40}$' \
            || ! git cat-file -e "${freshness_base}^{commit}"; then
            echo "::error::freshness requires exactly one merge-base commit; refusing to certify"
            exit 1
          fi
          if merged_tree=$(git merge-tree --write-tree "${BASE_SHA:?}" "${HEAD_SHA:?}" 2>&1); then
            :
          else
            merge_status=$?
            if [ "${merge_status}" -eq 1 ]; then
              echo "::error::the pull request's head ${HEAD_SHA} does not merge cleanly into its base ${BASE_SHA}; rebase the branch onto the base and push again."
            else
              # git exits 1 on a merge-tree conflict and reserves everything else
              # for its own failure: a git without --write-tree answers an
              # unknown option with a usage error. Reporting that as a conflict
              # would send the reader to rebase over a tool problem.
              echo "${merged_tree}"
              echo "::error::git merge-tree could not produce a merge tree for this pull request (exit ${merge_status}); this runner's git may not support 'git merge-tree --write-tree'"
            fi
            exit 1
          fi
          # The identity is only what lets commit-tree run: this commit is a
          # local object read as data, and nothing on this job's path
          # configures one for us. The -m is not cosmetic: without it
          # commit-tree reads the commit message from stdin, and a runner that
          # leaves stdin open turns this into a step that hangs.
          merge_sha=$(git -c user.name='Overflow verify' -c user.email='verify@localhost' \
            -c commit.gpgSign=false \
            commit-tree "${merged_tree}" -p "${BASE_SHA:?}" -p "${HEAD_SHA:?}" \
            -m "Overflow verify: this pull request's head merged into its base")
          read -r _ first_parent second_parent extra_parent \
            <<< "$(git rev-list --parents -n 1 "${merge_sha}")"
          if [ -z "${first_parent}" ] || [ -n "${extra_parent}" ] \
            || [ "${first_parent}" != "${BASE_SHA}" ] \
            || [ "${second_parent}" != "${HEAD_SHA}" ]; then
            echo "::error::the merge built for this event (${merge_sha}) is not a two-parent merge of its base ${BASE_SHA} and the event's head ${HEAD_SHA}; refusing to judge a tree this event is not about"
            exit 1
          fi
          pr_tree="${RUNNER_TEMP}/pr-tree"
          git worktree add --detach "${pr_tree}" "${merge_sha}"
          {
            echo "path=${pr_tree}"
            echo "merge_sha=${merge_sha}"
            echo "freshness_base_sha=${freshness_base}"
          } >> "$GITHUB_OUTPUT"

      # Issue 988 ports this mechanical check: in the claim repository,
      # claim#56 shipped a conflict marker through three review rounds.
      # A conflict marker is text that looks like prose in a Markdown file,
      # so only a mechanical check can see it. git grep reads the tracked
      # files out of the working tree, and -I keeps a binary from being
      # reported as a match. The three markers are matched in the shapes git
      # writes them: `<<<<<<< ` and `>>>>>>> ` carry the label after seven
      # characters, and the separator is exactly seven `=`; diff3's extra
      # `||||||| base` line changes nothing, because the other three are
      # still written. The step carries no event gate: this file receives
      # nothing but workflow_run, so the tree searched is always the
      # pull request's materialised merge tree.
      - name: Check no tracked file carries a merge-conflict marker
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          PR_TREE: ${{ steps.pr-tree.outputs.path }}
        run: |
          cd "${PR_TREE:?the pull request tree was not materialised}"
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      # A change that touched only documentation cannot move coverage, so the
      # measurement below would compare the same tree against itself. Detect
      # it instead of measuring it: the script checks the endpoint diff and
      # every first-parent commit since the base, which on this event is the
      # whole PR change — the materialised merge tree measured against its
      # first parent. The script that runs is the base checkout's copy. Rename
      # detection is off, so a code source renamed to a doc counts as code
      # (issue 646). The base checkout's copy over a push or a dispatch is in
      # ci.yml; both write this same output, which the three steps below read.
      - name: Detect docs-only change
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        id: detect-docs
        env:
          PR_TREE: ${{ steps.pr-tree.outputs.path }}
        run: |
          cd "${PR_TREE:?the pull request tree was not materialised}"
          changed=$(node "${GITHUB_WORKSPACE}/scripts/docs-only.ts" HEAD^1)
          echo "docs_only=${changed}" >> "$GITHUB_OUTPUT"

      # The base checkout's script, run with the judged tree as its working
      # directory — which here is always the materialised merge tree. The
      # ceilings and baseline document the script reads is therefore the pull
      # request's, which ratchet-guard.yml, running main's copy of
      # check-ratchets.ts on every pull request, holds tighten-only against the
      # merge base.
      - name: Module size ceilings
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          PR_TREE: ${{ steps.pr-tree.outputs.path }}
        run: |
          cd "${PR_TREE:?the pull request tree was not materialised}"
          node "${GITHUB_WORKSPACE}/scripts/check-module-size.ts"

      # No ratchet-document step here: ratchet-guard.yml runs main's copy of
      # scripts/check-ratchets.ts on every pull request (and every push to
      # main) as its own required context, reading the head only as git
      # objects, so a second copy in this job would add no judge.

      # Compares the base tip (the merge commit's first parent) against the
      # merge commit itself, not the raw PR head — the merge result already
      # carries migrations main added after the branch was cut, and a raw-head
      # comparison false-positives such a migration as "deleted" (issue 841).
      # The base checkout's script reads both revisions as git objects.
      - name: Migration immutability
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          MERGE_SHA: ${{ steps.pr-tree.outputs.merge_sha }}
        run: node "${GITHUB_WORKSPACE}/scripts/check-migration-edits.ts" "${MERGE_SHA:?}^1" "${MERGE_SHA}"

      # Unlike the migration step above — which compares the range's two
      # endpoints — the legal-revision gate walks EVERY commit of base..head:
      # a legal page edited in one commit and its revision record bumped in
      # the next still violates, so a reordered pair cannot slip through. The
      # checkout's full history plus the fetched head carry the range's
      # whole ancestry.
      - name: Legal revision currency
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          MERGE_SHA: ${{ steps.pr-tree.outputs.merge_sha }}
        run: node "${GITHUB_WORKSPACE}/scripts/check-legal-revisions.ts" "${MERGE_SHA:?}^1" "${MERGE_SHA}"

      # CONTRIBUTING.md allows a workflow's name as a scope only with type
      # ci. This belongs in the already-required verify job: a new job would
      # be a new required status context. The base checkout's script judges
      # the merge tree's outgoing range against freshly fetched main, and
      # derives the workflow-name set from the merge tree's workflows.
      - name: Refuse a commit whose scope names a workflow outside the ci type
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          PR_TREE: ${{ steps.pr-tree.outputs.path }}
        run: python3 "${GITHUB_WORKSPACE}/scripts/commit_scopes.py" --root "${PR_TREE:?}"

      # Issue 1099. pr-suite.yml's pin check runs under `pull_request` — the pull
      # request's own definition — so a pull request can delete the one step its
      # manifest is judged by. This is the base's own copy of that gate, and it
      # never opens a path under PR_TREE: the pin is read from the merge commit's
      # GIT OBJECTS (`git ls-tree` + `git cat-file`), so neither a symlinked leaf
      # nor a symlinked `.github` parent can redirect the read — a symlink entry
      # is a leaf, so the path lookup finds no subtree at all. Refusals name the
      # rule and, per line, the 1-based line number; nothing else from the file
      # is ever printed, so unvalidated bytes cannot reach the run log.
      #
      # The pre-parse is strict on purpose, because pip's own options would
      # otherwise be steerable from inside the file: an in-file `--index-url`
      # beats the command line's, a `name @ url` line satisfies
      # `--require-hashes` against attacker-chosen content, and a `; marker`
      # suffix makes pip skip the requirement entirely (all three measured). So
      # pip is handed ONLY a fresh sanitized copy under RUNNER_TEMP — a
      # directory this step created, refusing one that already exists, exactly
      # the suite-coverage step's hygiene — holding exactly the one accepted
      # `zizmor==<version> --hash=...` line. The step maps MERGE_SHA and
      # nothing else: no token is mapped, and PyPI is anonymous.
      - name: Verify the zizmor pin's hashes match its version
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          MERGE_SHA: ${{ steps.pr-tree.outputs.merge_sha }}
        run: |
          manifest=.github/requirements-zizmor.txt
          entries=$(git ls-tree "${MERGE_SHA:?}" -- "${manifest}")
          count=0
          entry_mode=""
          entry_type=""
          entry_blob=""
          while IFS=$'\t' read -r meta _path; do
            # An empty ls-tree output still feeds the here-string ONE empty
            # line; skipping it is what keeps the count truthful — a deleted
            # manifest must read as zero entries, never as one.
            [ -n "${meta}" ] || continue
            count=$((count + 1))
            entry_mode=${meta%% *}
            rest=${meta#* }
            entry_type=${rest%% *}
            entry_blob=${rest#* }
          done <<< "${entries}"
          if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
            echo "::error::${manifest} must be exactly one mode-100644 blob entry in the merge tree; found ${count} matching entries${entry_mode:+ with mode ${entry_mode}}${entry_type:+ of type ${entry_type}}. The pin is read from git objects, never from the filesystem (issue 1099), so a symlink leaf, a symlinked .github parent, a wrong mode and a non-blob type are all refused."
            exit 1
          fi
          pre_parse=$(cat <<'PY'
          import os
          import re
          import sys

          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::the zizmor manifest is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::the zizmor manifest carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::the zizmor manifest is not valid UTF-8; refusing\n")
              sys.exit(1)
          pin = re.compile(r"zizmor==[A-Za-z0-9][A-Za-z0-9._+-]*( --hash=sha256:[0-9a-f]{64}){1,32}")
          accepted = None
          for number, line in enumerate(text.split("\n"), start=1):
              if line == "" or line.startswith("#"):
                  continue
              if accepted is not None:
                  sys.stderr.write(f"::error::line {number}: the manifest carries a second requirement line; exactly one is allowed\n")
                  sys.exit(1)
              if pin.fullmatch(line) is None:
                  sys.stderr.write(f"::error::line {number}: refused by the pin grammar — the one accepted shape is zizmor==VERSION followed by one to 32 --hash=sha256:HEX64 values; includes, index options, URL lines, environment markers, CRLF and stray whitespace are refused\n")
                  sys.exit(1)
              accepted = line
          if accepted is None:
              sys.stderr.write("::error::the manifest carries no requirement line; refusing\n")
              sys.exit(1)
          with open(os.environ["ZIZMOR_SANITIZED_REQUIREMENTS"], "w", encoding="utf-8", newline="\n") as handle:
              handle.write(accepted)
              handle.write("\n")
          PY
          )
          sanitized="${RUNNER_TEMP}/zizmor-manifest-check"
          if [ -e "${sanitized}" ] || [ -L "${sanitized}" ]; then
            echo "::error::${sanitized} already exists; refusing to write the sanitized pin into a directory this run did not create"
            exit 1
          fi
          mkdir -- "${sanitized}" "${sanitized}/download"
          git cat-file blob "${entry_blob}" | ZIZMOR_SANITIZED_REQUIREMENTS="${sanitized}/requirements.txt" python3 -c "${pre_parse}"
          pip download --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple --no-input --disable-pip-version-check --retries 2 --timeout 60 -d "${sanitized}/download" -r "${sanitized}/requirements.txt"

      # Issue 1035. The dependency audit honours the audit suppression list a
      # pull request itself writes into package.json — pnpm.auditConfig — and,
      # as the fix-round-3 measurement recorded beside the twin guard in
      # dependency-audit.yml, the same auditConfig from pnpm-workspace.yaml
      # (plus auditLevel and the registries mapping there, and audit-level,
      # registry, strict-ssl, cafile, proxy and https-proxy from .npmrc) — so a
      # pull request could silence its own audit by listing an advisory it
      # introduces, and once merged, the scheduled audit on main is silenced
      # too. The list therefore moves only through a maintainer-reviewed merge:
      # this base-defined gate deep-compares the merge tree's package.json,
      # pnpm-workspace.yaml and .npmrc against the base's and refuses
      # divergence on every audit-affecting key.
      #
      # MECHANICS, mirroring the zizmor step above it: package.json is read from
      # GIT OBJECTS on both sides — git ls-tree shows exactly one mode-100644
      # blob at package.json in each tree, or the step refuses (a symlink leaf,
      # a wrong mode, a non-blob type and an absent file are all refusals), and
      # git cat-file pipes each side through an inline python3 pre-parse that
      # enforces the 65536-byte cap, refuses NUL bytes and invalid UTF-8,
      # parses the JSON, and emits the CANONICAL form of .pnpm.auditConfig.
      # Comparing the canonical dumps is structural equality, not string
      # equality: sort_keys with compact separators makes each dump uniquely
      # parseable back to exactly one JSON value, so package.json's key order,
      # indentation and escaping never reach the comparison, while every nested
      # value and the order of the ignoreGhsas list itself do. Removal of the
      # whole key counts as divergence, as does adding one; present-null and
      # absent read as the same, because pnpm treats both as no config.
      #
      # pnpm-workspace.yaml and .npmrc are read the same way, with two
      # differences their optionality buys: absent compares equal to a file
      # carrying none of the audited keys (the base's own state on main), and
      # an unparseable CHANGED file is a refusal, never a silent pass — the
      # workspace side needs PyYAML, which the runner image does not ship
      # (measured on the real runner: the fail-closed ImportError refusal
      # fired on every pull request that changed the file), so the step
      # hash-pins it from the BASE's .github/requirements-pyyaml.txt — read
      # from git objects and pip-installed with --require-hashes, exactly the
      # zizmor manifest's discipline — and fails closed only when the install
      # or the module is genuinely unavailable. A file whose audit-affecting
      # settings do not serialize to JSON refuses too. The audited keys are
      # the MEASURED
      # sets on pnpm 10.33.0: the workspace projection covers auditConfig,
      # auditLevel and the registries mapping (measured beating a pinned
      # npm_config_registry), the .npmrc projection covers audit-level,
      # registry, strict-ssl, cafile, proxy and https-proxy; keys measured
      # NOT honoured by the audit — the workspace's singular registry, its
      # kebab-case audit-level, and .npmrc @scope:registry — stay outside the
      # projections so ordinary edits stay green.
      #
      # Every refusal is a FIXED constant: no pull-request-controlled bytes ever
      # reach the log. Identical lists exit 0 silently. The step carries the
      # event gate the leg itself implies — this file receives nothing but
      # workflow_run, so the gate is redundant by the closed-trigger-set
      # argument, and it is pinned in the reachability suite so it cannot be
      # mutated into unreachability silently.
      - name: Refuse a pull request that changes the audit suppression list
        if: ${{ steps.pr.outputs.superseded != 'true' && (github.event_name == 'workflow_run') }}
        env:
          MERGE_SHA: ${{ steps.pr-tree.outputs.merge_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          file=package.json
          ws_file=pnpm-workspace.yaml
          npmrc_file=.npmrc
          
          # Two more suppression surfaces, measured on pnpm 10.33.0 with a real advisory
          # carrying its github_advisory_id (the invalid-first-leg lesson applied): the
          # audit honours auditConfig, auditLevel and the registries mapping from
          # pnpm-workspace.yaml — the mapping BEATS a pinned npm_config_registry, so it
          # redirects the advisory endpoint — and audit-level, registry, strict-ssl,
          # cafile, proxy and https-proxy from .npmrc. Both files are therefore compared
          # alongside package.json; absent compares equal to a file carrying none of the
          # audited keys, and an unparseable CHANGED file is a refusal, never a silent
          # pass.
          
          # Reads the named commit's package.json as git objects, mirroring the zizmor
          # step's ls-tree gate: exactly one mode-100644 blob entry at package.json, or
          # refuse. Prints the blob id on stdout.
          blob_of() {
            entries=$(git ls-tree "${1:?}" -- "${file}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::package.json must be exactly one mode-100644 blob entry in a tree; refusing. The suppression list is read from git objects, never from the filesystem, so a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          
          # Reads a commit's pnpm-workspace.yaml or .npmrc as git objects: absent is a
          # legitimate state — the files are optional — so unlike package.json it prints
          # the ABSENT sentinel instead of refusing. Any PRESENT shape other than exactly
          # one mode-100644 blob is a refusal: pnpm reads these files from the checkout
          # on disk, where a symlink leaf redirects the read outside the tree, so the
          # git-objects read must refuse what a filesystem read would follow.
          optional_entry_of() {
            entries=$(git ls-tree "${1:?}" -- "${2:?}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -eq 0 ]; then
              printf 'ABSENT\n'
              return 0
            fi
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::pnpm-workspace.yaml and .npmrc must be absent or exactly one mode-100644 blob entry in a tree; refusing. These files are read from git objects, never from the filesystem — pnpm reads the checkout on disk, where a symlink leaf redirects the read outside the tree, so a symlink leaf, a wrong mode and a non-blob type are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          
          # Pipes the named blob through the inline python pre-parse, which emits the
          # CANONICAL form of .pnpm.auditConfig: sort_keys and compact separators make
          # the dump uniquely parseable back to one value, so string equality of the two
          # sides is structural equality - key order, indentation and escaping in
          # package.json never reach the comparison, while every nested value and the
          # order of the ignoreGhsas list itself do.
          value_of() {
            git cat-file blob "${1:?}" | python3 -c "${pre_parse}"
          }
          
          # Projects one side's pnpm-workspace.yaml (a blob id, or the ABSENT sentinel)
          # to the canonical form of its audit-affecting settings. Absent compares equal
          # to a file carrying none of the audited keys; identical bytes cannot diverge,
          # so identical blob ids never reach the parse — the PyYAML install below runs
          # only when a side actually needs judging, and a runner without a working
          # module only ever reds a pull request that CHANGED the file.
          ws_value_of() {
            if [ "${1:?}" = "ABSENT" ]; then
              printf 'absent\n'
              return 0
            fi
            git cat-file blob "${1:?}" | PYTHONPATH="${pyyaml_site}${PYTHONPATH:+:${PYTHONPATH}}" python3 -c "${ws_pre_parse}"
          }
          
          # Projects one side's .npmrc to the canonical form of its audit-affecting
          # keys, with the same ABSENT handling as the workspace projection.
          npmrc_value_of() {
            if [ "${1:?}" = "ABSENT" ]; then
              printf 'absent\n'
              return 0
            fi
            git cat-file blob "${1:?}" | python3 -c "${npmrc_pre_parse}"
          }
          
          pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::package.json is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::package.json carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::package.json is not valid UTF-8; refusing\n")
              sys.exit(1)
          try:
              parsed = json.loads(text)
          except ValueError:
              sys.stderr.write("::error::package.json does not parse as JSON; refusing\n")
              sys.exit(1)
          config = None
          if isinstance(parsed, dict):
              pnpm = parsed.get("pnpm")
              if isinstance(pnpm, dict):
                  config = pnpm.get("auditConfig")
          if config is None:
              sys.stdout.write("absent")
          else:
              sys.stdout.write(json.dumps(config, sort_keys=True, separators=(",", ":")))
          PY
          )
          ws_pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc carry a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are not valid UTF-8; refusing\n")
              sys.exit(1)
          try:
              import yaml
          except ImportError:
              sys.stderr.write("::error::python3 has no yaml module; refusing to judge pnpm-workspace.yaml without it — the hash-pinned install above provides it, so a missing module means the install failed and is a red run, never a silent pass\n")
              sys.exit(1)
          try:
              parsed = yaml.safe_load(text)
          except Exception:
              sys.stderr.write("::error::pnpm-workspace.yaml does not parse as a mapping of settings; refusing to judge the audit-affecting settings without a parse\n")
              sys.exit(1)
          if parsed is None:
              parsed = {}
          if not isinstance(parsed, dict):
              sys.stderr.write("::error::pnpm-workspace.yaml does not parse as a mapping of settings; refusing to judge the audit-affecting settings without a parse\n")
              sys.exit(1)
          projection = {}
          for key in ("auditConfig", "auditLevel", "registries"):
              if key in parsed:
                  projection[key] = parsed[key]
          try:
              dump = json.dumps(projection, sort_keys=True, separators=(",", ":"))
          except (TypeError, ValueError):
              sys.stderr.write("::error::pnpm-workspace.yaml carries audit-affecting settings that do not serialize to JSON; refusing\n")
              sys.exit(1)
          sys.stdout.write(dump if projection else "absent")
          PY
          )
          
          npmrc_pre_parse=$(cat <<'PY'
          import json
          import sys
          
          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc carry a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::pnpm-workspace.yaml and .npmrc are not valid UTF-8; refusing\n")
              sys.exit(1)
          ALLOWED = ("audit-level", "registry", "strict-ssl", "cafile", "proxy", "https-proxy")
          projection = {}
          for line in text.split("\n"):
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or stripped.startswith(";"):
                  continue
              if "=" not in stripped:
                  sys.stderr.write("::error::.npmrc carries a line that is neither blank, a comment, nor key=value; refusing to judge its audit-affecting keys without a parse\n")
                  sys.exit(1)
              key, _, value = stripped.partition("=")
              key = key.strip().lower()
              value = value.strip()
              if not key:
                  sys.stderr.write("::error::.npmrc carries a line that is neither blank, a comment, nor key=value; refusing to judge its audit-affecting keys without a parse\n")
                  sys.exit(1)
              if key in ALLOWED:
                  projection[key] = value
          if projection:
              sys.stdout.write(json.dumps(projection, sort_keys=True, separators=(",", ":")))
          else:
              sys.stdout.write("absent")
          PY
          )

          # The workspace parse needs PyYAML, and the runner image does not ship
          # it. The module is installed from the BASE's hash-pinned manifest,
          # read from git objects exactly like the zizmor gate above: a pull
          # request can neither substitute the manifest (base-defined, not in
          # the merge tree) nor the wheel content (--require-hashes), so the
          # module the parse imports is what main pinned, never what the pull
          # request carries. Called only when the two sides' pnpm-workspace.yaml
          # blob ids differ — identical bytes cannot diverge, so identical
          # trees skip the install (and its network round trip) entirely.
          pyyaml_manifest_of() {
            entries=$(git ls-tree "${1:?}" -- "${manifest}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -eq 0 ]; then
              echo "::error::.github/requirements-pyyaml.txt is missing from the base; the workspace gate judges pnpm-workspace.yaml with a hash-pinned PyYAML install and refuses without it — the manifest moves only through a maintainer-reviewed merge, like the list it installs for" >&2
              exit 1
            fi
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::.github/requirements-pyyaml.txt must be exactly one mode-100644 blob entry in the base; refusing. The manifest is read from git objects, never from the filesystem — a pull request can neither substitute it nor hide it — so a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }

          # Validates the manifest by the pin grammar (pyyaml==VERSION followed
          # by one to 32 --hash=sha256:HEX64 values) and writes the sanitized
          # copy pip installs from — the zizmor pre-parse's shape, so no
          # includes, index options, URL lines or environment markers ever
          # reach pip.
          pyyaml_manifest_pre_parse=$(cat <<'PY'
          import os
          import re
          import sys

          data = sys.stdin.buffer.read()
          if 65536 < len(data):
              sys.stderr.write("::error::the PyYAML manifest is larger than the 65536-byte cap; refusing\n")
              sys.exit(1)
          if b"\x00" in data:
              sys.stderr.write("::error::the PyYAML manifest carries a NUL byte, which is invalid content wherever it sits; refusing\n")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              sys.stderr.write("::error::the PyYAML manifest is not valid UTF-8; refusing\n")
              sys.exit(1)
          pin = re.compile(r"pyyaml==[A-Za-z0-9][A-Za-z0-9._+-]*( --hash=sha256:[0-9a-f]{64}){1,32}")
          accepted = None
          for number, line in enumerate(text.split("\n"), start=1):
              if line == "" or line.startswith("#"):
                  continue
              if accepted is not None:
                  sys.stderr.write(f"::error::line {number}: the PyYAML manifest carries a second requirement line; exactly one is allowed\n")
                  sys.exit(1)
              if pin.fullmatch(line) is None:
                  sys.stderr.write(f"::error::line {number}: refused by the pin grammar — the one accepted shape is pyyaml==VERSION followed by one to 32 --hash=sha256:HEX64 values; includes, index options, URL lines, environment markers, CRLF and stray whitespace are refused\n")
                  sys.exit(1)
              accepted = line
          if accepted is None:
              sys.stderr.write("::error::the PyYAML manifest carries no requirement line; refusing\n")
              sys.exit(1)
          with open(os.environ["PYAML_SANITIZED_REQUIREMENTS"], "w", encoding="utf-8", newline="\n") as handle:
              handle.write(accepted)
              handle.write("\n")
          PY
          )

          install_pyyaml() {
            manifest=.github/requirements-pyyaml.txt
            pyyaml_manifest=$(pyyaml_manifest_of "${1:?}")
            sanitized="${RUNNER_TEMP}/pyyaml-manifest-check"
            if [ -e "${sanitized}" ] || [ -L "${sanitized}" ]; then
              echo "::error::${sanitized} already exists; refusing to write the sanitized pin into a directory this run did not create"
              exit 1
            fi
            mkdir -- "${sanitized}"
            git cat-file blob "${pyyaml_manifest}" | PYAML_SANITIZED_REQUIREMENTS="${sanitized}/requirements.txt" python3 -c "${pyyaml_manifest_pre_parse}" || return 1
            # pip writes its progress to stdout; this function's stdout is the
            # site path the caller captures, so pip's own output is diverted to
            # the step log — captured, it would ride inside PYTHONPATH and the
            # import would fall back to the system module or fail.
            pip install --no-deps --require-hashes --disable-pip-version-check --no-input --retries 2 --timeout 60 --target "${sanitized}/site" -r "${sanitized}/requirements.txt" 1>&2 || return 1
            printf '%s\n' "${sanitized}/site"
          }

          base_blob=$(blob_of "${BASE_SHA:?}")
          merge_blob=$(blob_of "${MERGE_SHA:?}")
          base_value=$(value_of "${base_blob}") || exit 1
          merge_value=$(value_of "${merge_blob}") || exit 1
          if [ "${base_value}" != "${merge_value}" ]; then
            echo "::error::this pull request changes pnpm.auditConfig; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
            exit 1
          fi
          base_ws=$(optional_entry_of "${BASE_SHA:?}" "${ws_file}")
          merge_ws=$(optional_entry_of "${MERGE_SHA:?}" "${ws_file}")
          if [ "${base_ws}" != "${merge_ws}" ]; then
            pyyaml_site=$(install_pyyaml "${BASE_SHA:?}") || exit 1
            base_ws_value=$(ws_value_of "${base_ws}") || exit 1
            merge_ws_value=$(ws_value_of "${merge_ws}") || exit 1
            if [ "${base_ws_value}" != "${merge_ws_value}" ]; then
              echo "::error::this pull request changes audit-affecting settings in pnpm-workspace.yaml; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
              exit 1
            fi
          fi
          
          base_npmrc=$(optional_entry_of "${BASE_SHA:?}" "${npmrc_file}")
          merge_npmrc=$(optional_entry_of "${MERGE_SHA:?}" "${npmrc_file}")
          if [ "${base_npmrc}" != "${merge_npmrc}" ]; then
            base_npmrc_value=$(npmrc_value_of "${base_npmrc}") || exit 1
            merge_npmrc_value=$(npmrc_value_of "${merge_npmrc}") || exit 1
            if [ "${base_npmrc_value}" != "${merge_npmrc_value}" ]; then
              echo "::error::this pull request changes audit-affecting keys in .npmrc; a pull request cannot change the audit suppression list — the list moves only through a maintainer-reviewed merge"
              exit 1
            fi
          fi


      # The pull request's suite — install, migrations, tests, lint,
      # typecheck, build, page geometry — runs as its own code in pr-suite.yml
      # under `pull_request`. This step reads that run's outcome as data: the
      # base copy of the awaiter succeeds only for a completed, successful
      # pull_request run of exactly .github/workflows/pr-suite.yml at exactly
      # resolved head SHA, and writes that run's id. SUITE_RUN_ID names the
      # triggering completion exactly; one same-head listing refuses a newer
      # run, and the judged attempt refuses a rerun. Neither check polls.
      - name: Await the pull request suite
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_RUN_ID: ${{ github.event.workflow_run.id }}
          SUITE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node "${GITHUB_WORKSPACE}/scripts/await-pr-suite.ts"

      # Success must be a positive signal here too, not the absence of a
      # failure: without the awaited run's id there is no run whose outcome
      # was read.
      - name: Require the awaited suite run's id
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          RUN_ID: ${{ steps.suite.outputs.run_id }}
        run: |
          if [[ "${RUN_ID}" == *$'\n'* ]] || ! printf '%s' "${RUN_ID}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::the suite awaiter wrote no run id (got '${RUN_ID}'); refusing to pass without a suite outcome"
            exit 1
          fi

      # The coverage floor over the awaited run's measurement. The summary is
      # the suite run's (pull-request-produced) output and is handled as data
      # in a place neither the pull request nor the base tree occupies: a
      # directory this step creates fresh under RUNNER_TEMP, refusing one that
      # already exists (a symlink included), so the download cannot land in
      # the pull request's tree or in the workspace whose scripts later steps
      # execute. The decision to require it is the BASE docs-only verdict
      # above, not the suite's own.
      - name: Create the suite coverage directory
        id: suite-coverage
        if: ${{ steps.pr.outputs.superseded != 'true' && (steps.detect-docs.outputs.docs_only != 'true') }}
        run: |
          dir="${RUNNER_TEMP}/suite-coverage"
          if [ -e "${dir}" ] || [ -L "${dir}" ]; then
            echo "::error::${dir} already exists; refusing to download into a directory this run did not create"
            exit 1
          fi
          mkdir -- "${dir}"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      # A missing artifact fails the download.
      - name: Download the suite's coverage summary
        if: ${{ steps.pr.outputs.superseded != 'true' && (steps.detect-docs.outputs.docs_only != 'true') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
          path: ${{ steps.suite-coverage.outputs.dir }}
          run-id: ${{ steps.suite.outputs.run_id }}
          github-token: ${{ github.token }}

      # The base checkout's script, run in the merge tree and told exactly
      # which summary to read: the floor document it reads is the pull
      # request's, held tighten-only by ratchet-guard.yml, and nothing under
      # the tree's own coverage/ is consulted.
      - name: Coverage floor over the suite's summary
        if: ${{ steps.pr.outputs.superseded != 'true' && (steps.detect-docs.outputs.docs_only != 'true') }}
        env:
          PR_TREE: ${{ steps.pr-tree.outputs.path }}
          SUMMARY_DIR: ${{ steps.suite-coverage.outputs.dir }}
        run: |
          cd "${PR_TREE:?the pull request tree was not materialised}"
          node "${GITHUB_WORKSPACE}/scripts/check-coverage-floor.ts" --summary "${SUMMARY_DIR:?}/coverage-summary.json"

      # Static gates judge the current PR base, but the suite may have tested
      # an older base. Freshness begins at the head/current-base merge-base:
      # on main's linear history it is no newer than the suite's tested base,
      # so the advance checked includes every potentially untested advance.
      # Branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # the base checkout's scripts/ci-base-freshness.sh, which certifies when
      # the base is unchanged OR advanced only disjointly from the files this
      # pull request changes — an advance that touched none of them carried
      # its own required checks, and only cross-file interaction goes
      # unverified — and refuses on everything else: an overlapping advance, a
      # failed or empty API response, an unrepresentative compare (issue 510;
      # the first version demanded main frozen for the whole run, which no run
      # could satisfy at the repository's merge cadence). The push and
      # workflow_dispatch runs that test main itself are in ci.yml and never
      # reach this gate; this file's only trigger is workflow_run.
      - name: Base freshness
        if: ${{ steps.pr.outputs.superseded != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ steps.pr-tree.outputs.freshness_base_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: bash "${GITHUB_WORKSPACE}/scripts/ci-base-freshness.sh"
