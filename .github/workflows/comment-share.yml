name: comment share
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: comment-share-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: false
jobs:
  comment-share:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default checkout measures the PR merge tree; main pushes measure github.sha.
      # Full history lets the action compare records against the trusted base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/comment-ratchet@e71a665c2784a15318a320a8d40485c1e6ca5311 # v1.1.3
        with:
          target: '15'
          records: '.github/comment-share.json'
          mode: 'auto'
          base-ref: ${{ github.event.pull_request.base.sha }}

      # Staging stays keyless and follows this workflow's successful gate.
      # A records-only push runs it once more, but an unchanged records file
      # stages no artifact and terminates the push chain: JSON is not source
      # the action measures. The base must name the exact measured run head.
      - name: Stage changed records for the ratchet push
        id: stage
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          # Bind the handoff base to the exact checkout the action measured.
          # A mismatched tree must never tighten records on another revision.
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo 'Checkout does not match the measured run head' >&2
            exit 1
          fi
          # Exit code one means changed data; higher codes are a broken diff.
          # An unchanged record stages nothing and ends the automated push chain.
          changed=0
          git diff --quiet -- .github/comment-share.json || changed=$?
          if [ "$changed" -gt 1 ]; then
            echo "git diff failed with $changed" >&2
            exit "$changed"
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Publish plain data and its measured base, never repository source.
          # The privileged consumer merges only these records into current main.
          mkdir -p "$RUNNER_TEMP/ratchet-data"
          cp .github/comment-share.json "$RUNNER_TEMP/ratchet-data/comment-share.json"
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/ratchet-data/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload the changed records
        if: success() && steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comment-share-ratchet
          path: ${{ runner.temp }}/ratchet-data
          if-no-files-found: error
          retention-days: 1
