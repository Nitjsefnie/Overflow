name: pr gates

# Privileged PR gates execute main's definitions and tools. Pull-request
# content enters only as git objects or sanitized data, never executed code.
# The whole trigger set is pull_request_target (issue 1090); push, schedule
# and dispatch producers live in their own files and read no PR data.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Only this pull request's superseded run is cancelled. Its newer event
  # starts all four required jobs again and the relay posts each conclusion
  # on that event's head: cancelling an older run cannot leave a stale head
  # green or cancel a peer pull request's gates.
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # actionlint from the Nitjsefnie-OSC fork, not from rhysd/actionlint.
      # Stock actionlint 1.7.12's workflow schema has no
      # `queue` key under `concurrency` — the key claim.yml needs so a second
      # /claim arriving mid-run is queued rather than dropped unanswered. Stock
      # 1.7.12 fails that file as an unexpected key, which would leave the gate
      # unable to lint the workflow it exists to lint.
      #
      # RETURN TO UPSTREAM as soon as an upstream release accepts `queue` under
      # `concurrency`: set ACTIONLINT_REPO back to rhysd/actionlint, take the
      # version and the sha256 from that release's own checksums file, and
      # re-verify .github/workflows/ with the stock binary.
      # tests/api/ci-workflows.test.ts checks that all three values agree across
      # both actionlint jobs; a one-leg bump fails naming the mismatched key.
      # The fork release is the same upstream code plus
      # that one schema key. Keep these three in step with actionlint.yml, which
      # installs the same gate on the push and dispatch legs.
      OVERFLOW_ACTIONLINT_REPO: Nitjsefnie-OSC/actionlint
      OVERFLOW_ACTIONLINT_VERSION: 1.7.12-queue.1
      # sha256 of actionlint_1.7.12-queue.1_linux_amd64.tar.gz from the fork's
      # checksums file. Bump the repository, version and checksum together.
      OVERFLOW_ACTIONLINT_SHA256: dcc2c42a7caaa197dfe63584a3851f62ef260f80b2cf221baaf05479661e1521

    steps:
      # No ref input at all: GitHub points GITHUB_REF at the default branch and
      # GITHUB_SHA at its last commit, so the default checkout is the trusted
      # base — main's tip — never the merge ref, and actions/checkout's fork
      # guard exempts exactly that. The PR's own .github/workflows/ is never
      # the lint target; it is fetched below as git objects and extracted as
      # data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The head is fetched only as git objects. Values from the event reach the
      # shell through env:, never through ${{ }} interpolation in run:.
      - name: Fetch the pull request head
        env:
          OVERFLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${OVERFLOW_PR_NUMBER}/head:refs/remotes/pr/head"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install actionlint
        run: |
          tarball="actionlint_${OVERFLOW_ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/${OVERFLOW_ACTIONLINT_REPO}/releases/download/v${OVERFLOW_ACTIONLINT_VERSION}/${tarball}"
          echo "${OVERFLOW_ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          pip install --require-hashes -r .github/requirements-zizmor.txt

      # The PR's tree is never checked out; its workflows are read out of the
      # fetched head ref with `git show`, so the lint target is data on disk and
      # nothing else. This file's sibling actionlint.yml copies the checked-out,
      # trusted tree's own workflows instead.
      - name: Collect the workflow files to lint
        run: |
          mkdir -p .github/workflows-pr
          git ls-tree -z --name-only refs/remotes/pr/head:.github/workflows/ |
            while IFS= read -r -d '' f; do
              git show "refs/remotes/pr/head:.github/workflows/$f" > ".github/workflows-pr/$f"
            done

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows-pr/*.yml

      - name: zizmor
        # Still run when actionlint finds a schema issue so one invocation
        # reports both classes of failure. Do not run if installation failed.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows-pr/*.yml

      # A pull_request_target run tests refs/pull/N/merge — the head merged with
      # the base as it stood at event time — and branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # scripts/ci-base-freshness.sh, which certifies when the base is
      # unchanged OR advanced only disjointly from the files this pull request
      # changes — an advance that touched none of them carried its own required
      # checks, and only cross-file interaction goes unverified — and refuses
      # on everything else: an overlapping advance, a failed or empty API
      # response or an unrepresentative compare (issue 510).
      - name: Base freshness
        env:
          GH_TOKEN: ${{ github.token }}
          OVERFLOW_REPO_SLUG: ${{ github.repository }}
          OVERFLOW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OVERFLOW_BASE_REF: ${{ github.event.pull_request.base.ref }}
          OVERFLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
          OVERFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-base-freshness.sh

  ratchet-guard:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each event must have a comparison path; otherwise a new trigger could
      # produce a green job that ran only setup-node. On a file whose `on:` is
      # one event this guard is not the load-bearing check — the closed-set
      # assertion in tests/ci/pr-data-triggers.test.ts is, and it refuses the
      # extra trigger at build time rather than at run time — but it is the
      # backstop for the edit that lands before any of this is re-run.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request_target" ]]; then
            echo "::error::Unhandled ratchet-guard event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # No ref input at all: GitHub points GITHUB_REF at the default branch
      # and GITHUB_SHA at its last commit, so the default checkout is the
      # trusted base — main's tip — never the merge ref, and actions/checkout's
      # fork guard exempts exactly that. main provides
      # scripts/check-ratchets.ts; untrusted content contributes no byte of the
      # executed code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"

      # Head content enters only as git objects in refs/remotes/pr/head.
      # Values from the event reach the shell through env:, never through
      # ${{ }} interpolation in the script.
      - name: Fetch the pull request head
        env:
          OVERFLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${OVERFLOW_PR_NUMBER}/head:refs/remotes/pr/head"

      # The base of the comparison is the checked-out commit itself — under
      # pull_request_target that is main's tip when the event fired (GITHUB_SHA) — never
      # the event's base.sha: that value is recorded when the pull request
      # opens and can trail main, and once the branch has rebased onto a
      # newer main the merge base of the stale base and the head sits below the real
      # fork point, so the guard would compare against the looser
      # document at that older base and pass a real relaxation. Checking
      # against main's latest commit cannot have that failure: a newer base
      # only moves the merge base forward. The head SHA is the commit the
      # event is about (passed through env, never ${{ }} in run:); if it was
      # force-pushed away and is unreachable, the script exits 2 and the
      # concurrency group has already cancelled the superseded run.
      - name: Ratchet documents
        env:
          OVERFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ratchets.ts HEAD "$OVERFLOW_HEAD_SHA"

  secret-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each event must have a comparison path; otherwise a new trigger could
      # produce a green job that ran only setup-node.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request_target" ]]; then
            echo "::error::Unhandled secret-scan event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # No ref input under pull_request_target: the default checkout is main,
      # so only trusted scripts execute. Full history is required, so the PR's
      # commits are in the object set gitleaks walks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read PR content only as git objects. Event values enter through env,
      # never interpolation into run. gitleaks walks all refs, including this one.
      - name: Fetch the pull request head
        env:
          OVERFLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${OVERFLOW_PR_NUMBER}/head:refs/remotes/pr/head"

      # The gitleaks ACTION is deliberately not used: it decides the scanner's
      # version, so a bump inside it would move the rule set under a committed
      # baseline with nothing in this repository to change. The release
      # tarball is downloaded, checksum-verified and extracted here instead, so
      # the version this job scans with is the version the file records.
      # Values reach the shell through env:, never through ${{ }} in run:.
      #
      # `echo "$install_dir" >> "$GITHUB_PATH"` is load-bearing and not
      # decoration. Every `run:` block is a fresh shell whose PATH is the
      # runner's, NOT this step's working directory, so a binary extracted
      # anywhere in this step is invisible to the next one — and the next step
      # resolves `gitleaks` by bare name, through
      # scripts/secret-scan.sh's `command -v`. Appending the install directory
      # to GITHUB_PATH is what lets that later shell resolve the scanner.
      # Extracting into $RUNNER_TEMP
      # rather than the workspace is a second, smaller choice with the same
      # reason behind it: the checkout above just fetched a full history with
      # fetch-depth: 0, and a downloaded executable does not belong in that
      # tree. tests/ci/secret-scan-workflow.test.ts executes both steps against
      # a simulated runner, so the line cannot be dropped again silently.
      - name: Install gitleaks
        env:
          OVERFLOW_GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # gitleaks_8.30.1_checksums.txt. Bump the version and checksum
          # together, and with PINNED_GITLEAKS_VERSION in
          # scripts/secret-scan.sh.
          OVERFLOW_GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The github-env ignore covers the constant value written:
        # "${RUNNER_TEMP}/gitleaks-bin"; no untrusted value reaches GITHUB_PATH
        # under any event, and bare-name resolution (command -v gitleaks in
        # scripts/secret-scan.sh) depends on this line. (issue 984)
        run: | # zizmor: ignore[github-env]
          tarball="gitleaks_${OVERFLOW_GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${OVERFLOW_GITLEAKS_VERSION}/${tarball}"
          # sha256sum is the LAST stage of this pipeline, which is what makes it
          # safe under a runner's `bash -e`: with no pipefail a pipeline's
          # status is the last stage's, so the step inherits THIS check's
          # status. That is a property of the order, not of the flags — an
          # earlier stage failing while a later one succeeded would be
          # invisible, and the downloader's own flags (`-f -sS -L
          # --retry 3`) are what cover the download. Do not reorder these two
          # commands, and do not append a stage after sha256sum.
          echo "${OVERFLOW_GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          tar -xzf "$tarball" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      # The exit code of this step IS the signal. No continue-on-error, no
      # `if: always()` — anything that lets the run proceed past a nonzero exit
      # turns a detection signal into decoration. The script checks the
      # gitleaks version before scanning, so a drifted scanner fails here with a
      # message rather than producing findings the baseline cannot explain.
      - name: Scan the full history
        env:
          OVERFLOW_GITLEAKS_REPORT_PATH: gitleaks-report.json
        run: bash scripts/secret-scan.sh

      # `if: always()` is the only thing that makes a RED run leave the report
      # behind, and the report is what a human reads to learn which commit and
      # which line carried the finding. Uploading a report from a clean run is
      # harmless: it is an empty array.
      - name: Upload the findings report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

      # Baseline commits must be reachable from HEAD or from the fetched PR
      # head. This runs after the upload so an unreachable entry does not
      # discard the scan's report. Full depth lets ancestry distinguish an
      # orphaned entry from a commit a shallow checkout simply never fetched.
      #
      # tests/ci/secret-scan-workflow.test.ts EXECUTES this step's `run:` block
      # verbatim against repositories it builds, with and without an entry that is
      # not an ancestor of HEAD, so the check is shown to reject rather than only
      # to be shaped like a check.
      - name: Check the baseline's commits are reachable from main or the PR
        run: bash scripts/secret-scan-baseline.sh refs/remotes/pr/head

  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # JOB level, and that is the whole point (the measured argument is
    # recorded on the same block in dependency-audit.yml; GitHub Actions env:
    # is step-scoped, so a variable pinned on the step that installs pnpm is
    # simply absent from the step that executes `pnpm audit`). The five pins
    # and their values are identical, and they are second-layer defence here
    # rather than the primary control they are in the push-leg file: this
    # workflow materializes ONLY package.json and pnpm-lock.yaml into the
    # sanitized directory, so no pull-request .npmrc exists for them to
    # outrank — the pins hold the audit at the registry, TLS store and
    # severity bar main chose even if a future edit starts materializing more.
    env:
      # `corepack install --global pnpm@10.33.0` sets corepack's DEFAULT and
      # nothing more: when the `pnpm` shim runs, corepack otherwise reads
      # `packageManager` from the nearest package.json — which is one of the
      # two manifests materialized into the sanitized directory this job's
      # audit step runs in — and downloads THAT version. Without this pin the
      # pull request picks the binary and "verified against pnpm 10.33.0"
      # describes a version it chose.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      # The registry pin holds the advisory endpoint at npmjs even if a future
      # edit materializes a pull-request .npmrc alongside the manifests; in
      # dependency-audit.yml the same pin is the primary control against a
      # project `.npmrc` registry=, where it is load-bearing today.
      npm_config_registry: "https://registry.npmjs.org/"
      # The transport half of the same attack; same second-layer note as the
      # registry pin above. A pull request can still choose the network path
      # the audit request takes (no proxy pin exists — an empty one loses to
      # `.npmrc`), but what it cannot choose is what the audit TRUSTS at the
      # end of that path: an intercepted connection fails closed against the
      # runner's system bundle.
      npm_config_strict_ssl: "true"
      npm_config_cafile: "/etc/ssl/certs/ca-certificates.crt"
      # The severity bar, held at pnpm's lowest reportable rung. The
      # "info" hazard is recorded on dependency-audit.yml's copy: the ladder
      # has no `info` key, so an "info" pin silently disables the audit.
      npm_config_audit_level: "low"

    steps:
      # Under pull_request_target no ref input: the default checkout is the
      # trusted base branch's tip — main's own files, none of the pull
      # request's. Full history, because the merge tree below is built by
      # `git merge-tree`, which needs the two commits' true merge base: a
      # shallow pair of commits shares none, and the merge would read as
      # unrelated histories and refuse edits that merge cleanly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      # ONE step, end to end: resolve this event's two SHAs, build the merge
      # tree, materialize the two manifests as data, then audit them — the
      # audit half is dependency-audit.yml's own audit step, verbatim, so the
      # two files cannot drift (tests/ci/dependency-audit-pr.test.ts extracts
      # both and requires byte equality).
      - name: Audit the pull request's merge-tree manifests
        env:
          # The head this event is about — the commit the pull request carries
          # NOW, and the one the merge below is built from. Deliberately not
          # the event's merge_commit_sha, which GitHub computes asynchronously
          # and can name the previous head's merge (the ci-pr.yml pr-tree
          # step's documented reason).
          OVERFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The base this event is about — the same commit GitHub's own merge
          # preview merges into.
          OVERFLOW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # actions/checkout's default: checking the tree out fetches no LFS
          # object the pull request's attributes point at.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          # The pull request enters as git objects: this event's head, fetched
          # by its SHA, and this event's base, fetched only when the checkout
          # does not already hold it. A SHA fetch follows no ref the pull
          # request could move; no refs/pull refspec is used anywhere.
          if ! git fetch --quiet --no-tags origin "${OVERFLOW_HEAD_SHA:?}"; then
            echo "::error::could not fetch the pull request's head ${OVERFLOW_HEAD_SHA} from origin; refusing to audit a tree this event is not about" >&2
            exit 1
          fi
          if ! git cat-file -e "${OVERFLOW_BASE_SHA:?}^{commit}" 2>/dev/null; then
            if ! git fetch --quiet --no-tags origin "${OVERFLOW_BASE_SHA:?}"; then
              echo "::error::could not fetch the pull request's base commit; refusing to audit a tree this event is not about" >&2
              exit 1
            fi
          fi
          # The merge tree is BUILT here rather than read out of the event
          # payload or a refs/pull/<number>/merge ref: both are about the pull
          # request's state at GitHub's leisure, not this event's two SHAs.
          # merge-tree exits 1 on a conflict, and there is no remote merge to
          # fall back to — a pull request that does not merge cleanly cannot
          # be audited, and a red here is fail-closed, the same direction
          # ci-pr.yml's verify job takes a conflict.
          if merged_tree=$(git merge-tree --write-tree "${OVERFLOW_BASE_SHA:?}" "${OVERFLOW_HEAD_SHA:?}" 2>&1); then
            :
          else
            merge_status=$?
            if [ "${merge_status}" -eq 1 ]; then
              echo "::error::the pull request's head ${OVERFLOW_HEAD_SHA} does not merge cleanly into its base ${OVERFLOW_BASE_SHA}; rebase the branch onto the base and push again."
            else
              # git exits 1 on a merge-tree conflict and reserves everything
              # else for its own failure: a git without --write-tree answers
              # an unknown option with a usage error. Reporting that as a
              # conflict would send the reader to rebase over a tool problem.
              echo "${merged_tree}"
              echo "::error::git merge-tree could not produce a merge tree for this pull request (exit ${merge_status}); this runner's git may not support 'git merge-tree --write-tree'"
            fi
            exit 1
          fi
          # The two manifests are materialized AS DATA into a sanitized
          # RUNNER_TEMP directory: each must be exactly one mode-100644 blob
          # entry at its path in the merge tree, or the run refuses — a
          # symlink leaf, a wrong mode, a non-blob type and an absent file are
          # all refusals, because what the audit reads from disk must be the
          # bytes the tree names and nothing else (the 1035 ls-tree
          # discipline). A manifest the pull request did not touch carries the
          # base's blob here, so the audit runs on the base's bytes exactly
          # when the pull request changed nothing.
          sanitized="${RUNNER_TEMP}/audit-manifests"
          if [ -e "${sanitized}" ] || [ -L "${sanitized}" ]; then
            echo "::error::${sanitized} already exists; refusing to write the pull request's manifests into a directory this run did not create"
            exit 1
          fi
          mkdir -- "${sanitized}"
          manifest_blob_of() {
            entries=$(git ls-tree "${1:?}" -- "${2:?}")
            count=0
            entry_mode=""
            entry_type=""
            entry_blob=""
            while IFS=$'\t' read -r meta _path; do
              [ -n "${meta}" ] || continue
              count=$((count + 1))
              entry_mode=${meta%% *}
              rest=${meta#* }
              entry_type=${rest%% *}
              entry_blob=${rest#* }
            done <<< "${entries}"
            if [ "${count}" -ne 1 ] || [ "${entry_mode}" != "100644" ] || [ "${entry_type}" != "blob" ]; then
              echo "::error::${2} must be exactly one mode-100644 blob entry in the merge tree; refusing. The manifests are read from git objects, never from the filesystem — a symlink leaf, a wrong mode, a non-blob type and an absent file are all refused." >&2
              exit 1
            fi
            printf '%s\n' "${entry_blob}"
          }
          for manifest in package.json pnpm-lock.yaml; do
            blob=$(manifest_blob_of "${merged_tree}" "${manifest}")
            git cat-file blob "${blob}" > "${sanitized}/${manifest}"
          done
          # The audit half is byte-identical to dependency-audit.yml's audit
          # step (extracted, never hand-copied; equality pinned by
          # tests/ci/dependency-audit-pr.test.ts): same five-verdict
          # classifier, same narrow transient retry. audit.json and audit.err
          # are written relative to the working directory, which the cd above
          # puts inside the sanitized directory.
          cd -- "${sanitized}"
          set -uo pipefail
          attempts=3
          delay="${DEPENDENCY_AUDIT_RETRY_DELAY_SECONDS:-30}"
          for attempt in $(seq 1 "$attempts"); do
            code=0
            pnpm audit --json > audit.json 2> audit.err || code=$?
            result=$(AUDIT_EXIT="$code" node -e '
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          } catch {
            console.log("unreadable|the audit produced no JSON report");
            process.exit(0);
          }
          if (report && report.error) {
            const statuses = [...String(report.error.message ?? "").matchAll(/responded with (\d{3})/g)]
              .map((match) => Number(match[1]));
            const transient = statuses.length > 0
              && statuses.every((status) => status === 429 || (status >= 500 && status < 600));
            const first = (message) => String(message).split("\n")[0];
            const reported = first(report.error.message ?? "the advisory endpoint did not answer");
            console.log(String(report.error.code ?? "") === "ERR_PNPM_AUDIT_NO_LOCKFILE"
              ? "unreadable|" + reported
              : transient
                ? "transient|" + first("the advisory endpoint answered " + statuses.join(" and "))
                : "unreachable|" + reported);
            process.exit(0);
          }
          const advisories = report && report.advisories ? Object.keys(report.advisories).length : -1;
          if (advisories > 0) {
            const counts = report.metadata?.vulnerabilities ?? {};
            const summary = ["critical", "high", "moderate", "low", "info"]
              .map((severity) => (counts[severity] ?? 0) + " " + severity)
              .filter((entry) => !entry.startsWith("0 "))
              .join(", ");
            console.log("advisories|" + advisories + " advisories (" + (summary || "severities unreported") + ")");
            process.exit(0);
          }
          console.log(advisories === 0
            ? process.env.AUDIT_EXIT === "0"
              ? "clean|no known vulnerabilities found"
              : "unreadable|the audit report carried an empty advisories map and exited " + process.env.AUDIT_EXIT
            : "unreadable|the audit report carried no advisories field and exited " + process.env.AUDIT_EXIT);
          ')
            verdict="${result%%|*}"
            detail="${result#*|}"
            echo "attempt $attempt of $attempts, pnpm audit --json exited $code: $verdict — $detail"
            case "$verdict" in
              clean)
                echo "$detail"
                exit 0
                ;;
              advisories)
                echo "$detail"
                echo "advisory ids and patched versions:"
                node -e '
          const report = JSON.parse(require("node:fs").readFileSync("audit.json", "utf8"));
          for (const advisory of Object.values(report.advisories ?? {})) {
            console.log("  " + advisory.module_name + " " + advisory.severity + ": " + advisory.title
              + " (vulnerable " + advisory.vulnerable_versions + ", patched " + advisory.patched_versions + ")");
          }
          '
                exit 1
                ;;
              transient)
                cat audit.err
                if [ "$attempt" -lt "$attempts" ]; then
                  echo "$detail — a registry outage, not a finding; retrying"
                  sleep "$delay"
                  continue
                fi
                echo "$detail — the advisory endpoint was still unavailable after $attempts attempts"
                exit 1
                ;;
              *)
                cat audit.err
                echo "$detail — the lockfile was NOT audited, so this run reports nothing about it"
                exit 1
                ;;
            esac
          done
          exit 1
