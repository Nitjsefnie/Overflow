name: ci

# The complete release gate. It exercises the real migration path against
# PostgreSQL before running every behavioral, static, and production-build check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      APP_URL: https://overflow.invalid
      GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      MODERATOR_GITHUB_USER_IDS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      - name: Test suite
        run: pnpm test --run

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Page geometry check
        run: node scripts/check-page-geometry.mjs

      # A pull_request run tests refs/pull/N/merge — the head merged with the
      # base as it stood at event time — and branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # scripts/ci-base-freshness.sh, which certifies when the base is
      # unchanged OR advanced only disjointly from the files this pull request
      # changes — an advance that touched none of them carried its own required
      # checks, and only cross-file interaction goes unverified — and refuses
      # on everything else: an overlapping advance, a failed or empty API
      # response, an unrepresentative compare (issue 510; the first version
      # demanded main frozen for the whole run, which no run could satisfy at
      # the repository's merge cadence). Push and workflow_dispatch runs test
      # main itself and skip the gate.
      - name: Base freshness
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-base-freshness.sh
