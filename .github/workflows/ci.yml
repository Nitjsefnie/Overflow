name: ci

# The complete release gate. It exercises the real migration path against
# PostgreSQL before running every behavioral, static, and production-build check.
#
# pull_request_target so the executed workflow definition is main's: a pull
# request that edits its own workflow files cannot shape the job that judges
# it (issue 822). The boundary: pull-request code runs in a job whose
# definition is main's, with contents: read and no secret reference anywhere
# in this file — the App key lives only in the ledger relay's environment,
# and only the relay posts the required contexts. The verify job checks out
# the pull request's merge ref explicitly (under pull_request_target the
# default checkout is main's tip): the suite must test the pull request's
# change, and the merge ref preserves the HEAD^1/HEAD^2 parent semantics the
# docs-only and ratchet steps rely on. persist-credentials: false is what
# actions/checkout's fork guard requires before it admits a PR ref under
# pull_request_target.
on:
  push:
    branches: [main]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base:
        description: "Full SHA of the main commit to measure this dispatch against"
        required: false
        type: string
      simulate-refused-raise:
        description: "calibrate self-test: fabricate a coverage raise so the push is refused by branch protection and the job fails visibly (issue 684)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One group for every pull request, so the repository's Actions minutes stop
  # scaling with the number of open pull requests: a per-pull-request group
  # bounds one contributor's parallelism and nothing else, and N open pull
  # requests produced N concurrent runs. GitHub keeps one PENDING run per group
  # and cancels the superseded one, so `ci-repo-wide` is a single slot.
  # Every other leg — push, workflow_dispatch — keys on its own SHA: the deploy
  # gate reads the check conclusion for the SHA it deploys and refuses a
  # `cancelled` one (issue 474), so nothing a merge depends on may share a group
  # with another event. The parentheses are load-bearing; && binds tighter than
  # || in a GitHub expression, and without them the pull_request arm falls
  # through to github.sha and the bound is gone.
  #
  # cancel-in-progress is false, and NOT an event test gating on the pull
  # request. GitHub's documented behaviour: "By default, any existing pending job
  # or workflow in the same concurrency group will be canceled and the new queued
  # job or workflow will take its place. To also cancel any currently running job
  # or workflow in the same concurrency group, specify cancel-in-progress: true."
  # Read that carefully: the PENDING run is cancelled whatever this flag says.
  # The flag decides only whether the RUNNING job is destroyed as well.
  #
  # WHAT `false` GUARANTEES: no in-flight run is ever cancelled, so no required
  # context concludes `cancelled` because a peer pushed while it was running.
  # `verify` is a required context in .github/required-checks.json and
  # ledger-relay mirrors a run conclusion onto it, so a running run destroyed
  # here is a peer's blocked pull request. That is worth avoiding, and it is
  # common: see the rates below.
  #
  # WHAT `false` DOES NOT PREVENT — the residual this design cannot remove:
  # GitHub still cancels the PENDING run when a newer arrival claims the single
  # pending slot. Under a per-pull-request group that pending run is always the
  # SAME pull request's superseded head, and the push that superseded it created
  # a replacement, so it heals itself. Under this shared group the pending run
  # can be a DIFFERENT pull request's current head, and nothing creates a
  # replacement: the relay mirrors the cancelled conclusion onto `verify`, and
  # this workflow triggers on opened/synchronize/reopened with no `edited`, so a
  # retitle or relabel produces no new run. That pull request stays blocked until
  # its author pushes again. This is inherent to sharing one group — no value of
  # this flag removes it, and a `true` makes it strictly worse by also
  # destroying in-flight runs.
  #
  # RATES, from the 483 ci runs of the 6.13 days ending 2026-09-30. Only the
  # 370 pull-request arrivals ever enter `ci-repo-wide`: the 106 push and 7
  # workflow_dispatch runs key their own github.sha and cannot contend with
  # anything, so counting them inflated both the arrival rate and rho. Load is
  # also not steady - per-day all-event arrivals were 5, 0, 215, 122, 78, 17, 46.
  # M/M/1 with one waiting place over the PR arrivals (mean PR-leg service 6.44
  # min), where pending-cancelled is n*pi2 and running-cancelled-if-true is
  # n*(pi1+pi2) - the flag is what adds the second, so it is the larger figure:
  #   date        PR arrivals   rho   pending-cancelled   running-cancelled-if-true
  #   09-26               171  0.76             ~43/day                 ~98/day
  #   09-27                95  0.42             ~11/day                 ~36/day
  #   09-28                59  0.26              ~3/day                 ~15/day
  #   window mean           60  0.27              ~3/day                 ~15/day
  # These are a LOWER bound: a Poisson fit understates a bursty arrival process.
  # Replaying the real arrival timestamps instead gave materially higher figures
  # (97 and 134 pending cancellations per window, depending on arrival set and
  # service-time treatment) and neither replay reproduced stably, so no single
  # replayed number is quoted. For reference, main already shows the mechanism
  # inside per-PR groups: 9 of 482 completed ci runs concluded cancelled, every
  # one a same-PR self-supersede.
  #
  # ON RUNNER MINUTES, stated plainly because the direction is counter-intuitive:
  # `true` would bill FEWER minutes, not more — a destroyed run stops accruing.
  # So `false` costs minutes relative to `true`; it is bought deliberately, as the
  # price of not destroying a check someone is waiting on. The bound itself is
  # unaffected either way: one running slot per group caps concurrency at 1 no
  # matter what this flag says, and that cap is the whole point of the change. A
  # run dropped from the pending slot never started and costs 0 minutes, so the
  # cheap kind of cancellation is the one that remains.
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'repo-wide' || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      docs_only: ${{ steps.detect-docs.outputs.docs_only }}

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      APP_URL: https://overflow.invalid
      GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      MODERATOR_GITHUB_USER_IDS: "1"

    steps:
      # Under pull_request_target the checkout plants the pull request's merge
      # ref (under that event the default checkout is main's tip): the suite
      # must test the pull request's change, and the merge ref preserves the
      # HEAD^1/HEAD^2 parent semantics the docs-only and ratchet steps rely
      # on. persist-credentials: false is what actions/checkout's fork guard
      # requires before it admits a PR ref under pull_request_target. The
      # step is event-gated because github.event.pull_request.number is null
      # on push and workflow_dispatch, where a ref built from it would break
      # the checkout (fix round 1, finding A).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: "refs/pull/${{ github.event.pull_request.number }}/merge"
          persist-credentials: false

      # Every other event checks out the event's own commit by default: the
      # pushed main tip on a push, the dispatched ref's commit on a
      # workflow_dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request_target' }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      # A change that touched only documentation cannot move coverage, so the
      # measurement below would compare the same tree against itself. Detect
      # it instead of measuring it: the script checks the endpoint diff and
      # every first-parent commit since the base. A pull_request_target run
      # uses the merge ref's first parent (the whole PR change), a push uses
      # its before SHA, and a dispatch uses its validated optional base. A
      # dispatch with no base, an unknown event, or an undecidable push
      # counts as code.
      # Rename detection is off, so a code source renamed to a doc counts as
      # code (issue 646).
      - name: Detect docs-only change
        id: detect-docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |
          git fetch --depth=2 origin "${GITHUB_SHA}"
          base=""
          if [ "${EVENT_NAME}" = pull_request_target ]; then
            git fetch --depth=2 origin "+refs/pull/${PR_NUMBER}/merge"
            base=HEAD^1
          elif [ "${EVENT_NAME}" = push ]; then
            base="${PUSH_BEFORE}"
            if [ -z "${base}" ] || [ -z "${base//0/}" ] \
              || ! git fetch --depth=1 origin "${base}"; then
              base=""
            else
              git fetch --no-tags --unshallow origin "${GITHUB_SHA}"
            fi
          elif [ "${EVENT_NAME}" = workflow_dispatch ] && [ -n "${DISPATCH_BASE}" ]; then
            base="${DISPATCH_BASE}"
            if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Dispatch base has invalid format; expected 40 lowercase hexadecimal characters" >&2
              exit 1
            fi
            if [ "${base}" = "${GITHUB_SHA}" ]; then
              echo "::error::Dispatch base must differ from the dispatched commit" >&2
              exit 1
            fi
            git fetch --no-tags --unshallow origin "${GITHUB_SHA}"
            if ! git merge-base --is-ancestor "${base}" "${GITHUB_SHA}"; then
              echo "::error::Dispatch base must be an ancestor of the dispatched commit" >&2
              exit 1
            fi
          fi
          changed=$(node scripts/docs-only.ts "${base}")
          echo "docs_only=${changed}" >> "$GITHUB_OUTPUT"

      - name: Test suite
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: pnpm test --run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=cobertura --coverage.include='src/**'

      - name: Test suite (docs-only)
        if: ${{ steps.detect-docs.outputs.docs_only == 'true' }}
        run: pnpm test --run

      - name: Coverage floor
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: node scripts/check-coverage-floor.ts

      # Informational, never a gate. The diff base is the checked-out
      # commit's first parent — on a pull_request_target run that is the merge
      # commit's base-side parent (GitHub merges the head into the base, so
      # the base tip is the first parent and the head the second), which
      # makes HEAD^1..HEAD exactly the change the pull request carries.
      # Never the event's base SHA, which can trail the base tip the merge
      # ref was actually built against.
      - name: Patch coverage report
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: git diff HEAD^1 HEAD | node scripts/patch-coverage.ts coverage/cobertura-coverage.xml

      - name: Upload patch coverage report
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-coverage
          path: coverage/patch-coverage.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage summary
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Lint
        run: pnpm lint

      - name: Module size ceilings
        run: node scripts/check-module-size.ts

      # A pull request must not relax its own ratchet documents (issue 647):
      # the coverage floor, the module size ceilings and the module size
      # baseline may only tighten. The merge ref merges the head into the
      # base, so HEAD^1 is the base tip and HEAD^2 the head, and the check
      # compares each document at their merge base with the head's copy. The
      # history is still shallow by the time this step runs (the docs-only
      # detection above fetched only to depth 2), and a shallow history makes
      # git merge-base fail — or worse, return a wrong base without erroring
      # — so the step first completes the history of both sides before
      # checking.
      - name: Ratchet documents
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --unshallow origin main "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          node scripts/check-ratchets.ts HEAD^1 HEAD^2

      # Compares the base tip (HEAD^1) against the merge ref itself (HEAD), not the raw PR head (HEAD^2) — the merge result already carries migrations main added after the branch was cut, and a raw-head comparison false-positives such a migration as "deleted" (issue 841).
      - name: Migration immutability
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --depth=2 origin "+refs/pull/${PR_NUMBER}/merge"
          node scripts/check-migration-edits.ts HEAD^1 HEAD

      # Unlike the migration step above — which compares the range's two
      # endpoints, so depth=2 carries everything it reads — the legal-revision
      # gate walks EVERY commit of base..head: a legal page edited in one
      # commit and its revision record bumped in the next still violates, so a
      # reordered pair cannot slip through. The per-commit walk needs the
      # range's full ancestry, and the checkout is shallow by the time this
      # step runs, so the step first completes the history of both sides (the
      # Ratchet documents step is the precedent).
      - name: Legal revision currency
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --unshallow origin main "+refs/pull/${PR_NUMBER}/merge"
          node scripts/check-legal-revisions.ts HEAD^1 HEAD

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Page geometry check
        run: node scripts/check-page-geometry.mjs

      # A pull_request_target run tests refs/pull/N/merge — the head merged with the
      # base as it stood at event time — and branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # scripts/ci-base-freshness.sh, which certifies when the base is
      # unchanged OR advanced only disjointly from the files this pull request
      # changes — an advance that touched none of them carried its own required
      # checks, and only cross-file interaction goes unverified — and refuses
      # on everything else: an overlapping advance, a failed or empty API
      # response, an unrepresentative compare (issue 510; the first version
      # demanded main frozen for the whole run, which no run could satisfy at
      # the repository's merge cadence). Push and workflow_dispatch runs test
      # main itself and skip the gate.
      - name: Base freshness
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-base-freshness.sh

  # Raises the committed coverage floor when a main push measured higher
  # than the record by more than the hysteresis, and doubles as the calibrate
  # self-test: a workflow_dispatch carrying simulate-refused-raise fabricates
  # a coverage raise so the push to main is refused by branch protection —
  # a bot commit can never carry the required checks — and the job FAILS
  # visibly, which is the point (issue 684). Push-only otherwise: a pull
  # request must never write to the branch it targets. Docs-only runs produce
  # no coverage summary and are skipped by the verify job's docs_only output.
  calibrate:
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.docs_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.simulate-refused-raise == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/push-recalibration.ts reads the recorded floor from
          # HEAD^1 for its refusal message; a depth-1 checkout would degrade
          # the message to its "floors could not be read" fallback.
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage summary
        if: ${{ inputs.simulate-refused-raise != true }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
          path: coverage

      - name: Calibrate the coverage floor
        if: ${{ inputs.simulate-refused-raise != true }}
        run: node scripts/calibrate-coverage.ts

      # The self-test half: in place of a measurement, calibrate-coverage
      # fabricates a raise off the recorded document alone, so the push below
      # is guaranteed to be refused and the job's failure is the thing under
      # test.
      - name: Fabricate the simulated raise
        if: ${{ inputs.simulate-refused-raise == true }}
        run: node scripts/calibrate-coverage.ts --simulate-refused-raise

      # The push half lives in scripts/push-recalibration.ts: it commits
      # scripts/coverage.json as github-actions[bot] and pushes main, with the
      # job token riding in the push URL alone — never persisted to
      # .git/config. A refused push is EXPECTED here — main's branch
      # protection cannot be satisfied by a GITHUB_TOKEN push — so the script
      # names the measured and recorded floors in a ::error:: and exits 1:
      # a refusal fails the job visibly instead of reading as green. On a
      # warranted raise racing main it fetches, rebases and retries once
      # before refusing.
      - name: Push the recalibrated floor
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/push-recalibration.ts
