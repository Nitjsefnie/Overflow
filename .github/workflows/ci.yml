name: ci

# The complete release gate for main. It exercises the real migration path
# against PostgreSQL before running every behavioral, static, and
# production-build check.
#
# THE PULL-REQUEST LEG IS NOT HERE (issue 1090). It is
# .github/workflows/ci-pr.yml, whose only trigger is `pull_request_target`,
# because it fetches a pull request's merge commit and reads its number, head
# and base, and a privileged trigger would run those steps with the default
# branch's privileges. What is left here — push to main and workflow_dispatch —
# tests main itself and reads no pull-request data at all: no `refs/pull`
# fetch, no `pull_request.*` value in any step's `run` or `env`.
# tests/ci/pr-data-triggers.test.ts decides that from the workflow text rather
# than from this comment, and refuses any job that both runs a
# checkout/fetch/pull and names a pull-request-derived value outside a
# pull_request_target-only workflow.
#
# Both files produce the `verify` job name, and
# .github/required-checks.json pins that context to BOTH paths, so a
# required-context conclusion arrives on a pull-request head and on a main push
# alike.
#
# workflow_dispatch is the deploy-recovery dispatch and stays here (deploy/
# README.md): it re-measures a commit on demand, against an optional `base`.
# Its inputs are honoured below, including the docs-only detection path that
# reads `inputs.base`, and nothing in this file can reach a pull request's data
# — which is what makes a privileged dispatch safe here.
#
# calibrate stays in this file because it `needs: verify` for the `docs_only`
# output: the push leg's verify job must be in the same workflow. No secret is
# referenced anywhere in this file — the App key lives only in the ledger
# relay's environment, and the relay posts the required contexts only from
# trusted runs (pull_request_target, or push/dispatch/schedule on main), never
# from a pull_request run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Full SHA of the main commit to measure this dispatch against"
        required: false
        type: string
      simulate-refused-raise:
        description: "calibrate self-test: fabricate a coverage raise so the push is refused by branch protection and the push-recalibration job fails visibly (issue 684)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Every leg here keys on its own SHA, so no push to main and no dispatch
  # shares a group: GitHub keeps one PENDING run per group and cancels the
  # superseded one even with cancel-in-progress false, and a cancelled
  # conclusion on a merged SHA makes the deploy gate refuse immediately (issue
  # 474). There is no pull-request leg in this file to bound — the one
  # repository-level group is ci-pr-repo-wide, in the sibling.
  #
  # cancel-in-progress is false so no in-flight run is destroyed; on a per-SHA
  # group the run it could destroy is this SHA's own earlier attempt, and
  # `verify` is a required context ledger-relay mirrors the conclusion onto.
  # It does NOT stop GitHub cancelling the group's PENDING run — that happens
  # by default, and the flag is the boolean false rather than an event
  # expression because nothing here needs the two halves apart. The full
  # argument, and the measured rates, are in ci-pr.yml's concurrency block.
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      docs_only: ${{ steps.detect-docs.outputs.docs_only }}

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      APP_URL: https://overflow.invalid
      GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      MODERATOR_GITHUB_USER_IDS: "1"
      # Actions `env:` is step-scoped. A pin on only the install step leaves
      # later `pnpm` steps resolving the checkout's `packageManager`. At job
      # scope every `pnpm` step inherits both pins, so there is no step left
      # on which to forget them.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      # No ref input: the default checkout takes the event's own commit — the
      # pushed main tip on a push, the dispatched ref's commit on a
      # workflow_dispatch. Full history (issue 1098): the suite this job runs
      # includes the secret-scan baseline's provenance check, which skips
      # wherever the checkout is shallower than the baseline's entries, and at
      # the previous default depth of 1 it ran in no CI context at all. This
      # is MAIN's own history — no refs/pull fetch and no pull_request.* value
      # anywhere in this file — so the depth carries no pull-request data into
      # a privileged job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Issue 988 ports this mechanical check: in the claim repository,
      # claim#56 shipped a conflict marker through three review rounds.
      # A conflict marker is text that looks like prose in a Markdown file,
      # so only a mechanical check can see it. git grep reads the tracked
      # files out of the working tree, which on a clean checkout is what
      # the repository ships, and -I keeps a binary from being reported as
      # a match. The three markers are matched in the shapes git writes
      # them: `<<<<<<< ` and `>>>>>>> ` carry the label after seven
      # characters, and the separator is exactly seven `=`; diff3's extra
      # `||||||| base` line changes nothing, because the other three are
      # still written. It runs first, before anything is installed, and
      # searches this file's only tree: the checked-out event commit. The
      # pull_request_target leg of this same gate, over the materialised
      # merge tree, is the sibling step in ci-pr.yml.
      - name: Check no tracked file carries a merge-conflict marker
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      # A change that touched only documentation cannot move coverage, so the
      # measurement below would compare the same tree against itself. Detect
      # it instead of measuring it: the script checks the endpoint diff and
      # every first-parent commit since the base. A push uses its before SHA
      # and a dispatch its validated optional base; a dispatch with no base, or
      # an undecidable push, counts as code. The base checkout's copy over a
      # pull request's materialised merge tree is in ci-pr.yml; both write this
      # same output, which the steps below read. Rename detection is off, so a
      # code source renamed to a doc counts as code (issue 646).
      - name: Detect docs-only change
        id: detect-docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          git fetch --depth=2 origin "${GITHUB_SHA}"
          base=""
          if [ "${EVENT_NAME}" = push ]; then
            base="${PUSH_BEFORE}"
            if [ -z "${base}" ] || [ -z "${base//0/}" ] \
              || ! git fetch --depth=1 origin "${base}"; then
              base=""
            else
              git fetch --no-tags --unshallow origin "${GITHUB_SHA}"
            fi
          elif [ "${EVENT_NAME}" = workflow_dispatch ] && [ -n "${DISPATCH_BASE}" ]; then
            base="${DISPATCH_BASE}"
            if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Dispatch base has invalid format; expected 40 lowercase hexadecimal characters" >&2
              exit 1
            fi
            if [ "${base}" = "${GITHUB_SHA}" ]; then
              echo "::error::Dispatch base must differ from the dispatched commit" >&2
              exit 1
            fi
            git fetch --no-tags --unshallow origin "${GITHUB_SHA}"
            if ! git merge-base --is-ancestor "${base}" "${GITHUB_SHA}"; then
              echo "::error::Dispatch base must be an ancestor of the dispatched commit" >&2
              exit 1
            fi
          fi
          changed=$(node "${GITHUB_WORKSPACE}/scripts/docs-only.ts" "${base}")
          echo "docs_only=${changed}" >> "$GITHUB_OUTPUT"

      # Every step from here that runs the event commit's own code — the
      # package manager, the suite, the build — needs no event gate, because
      # this file admits nothing else: every leg that does carries the
      # pull_request_target-only workflow's reach instead, and a trigger added
      # here has to pass ci-pr.yml's structural split to reach pull-request
      # data at all.
      - name: Test suite
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: pnpm test --run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=cobertura --coverage.include='src/**'

      - name: Test suite (docs-only)
        if: ${{ steps.detect-docs.outputs.docs_only == 'true' }}
        run: pnpm test --run

      - name: Coverage floor
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: node scripts/check-coverage-floor.ts

      # Informational, never a gate. The diff base is the checked-out
      # commit's first parent. On a pull request this report is produced by
      # pr-suite.yml over its own merge commit; here it covers push and
      # dispatch runs, whose calibrate job and coverage history read the
      # same artifact names.
      - name: Patch coverage report
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: git diff HEAD^1 HEAD | node scripts/patch-coverage.ts coverage/cobertura-coverage.xml

      - name: Upload patch coverage report
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-coverage
          path: coverage/patch-coverage.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage summary
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Lint
        run: pnpm lint

      # The base checkout's script, run over the checked-out commit — which on
      # both of this file's events is main's own tip or the dispatched commit.
      # The ceilings and baseline document the script reads is that commit's.
      - name: Module size ceilings
        run: node "${GITHUB_WORKSPACE}/scripts/check-module-size.ts"

      # No ratchet-document step here: ratchet-guard.yml runs main's copy of
      # scripts/check-ratchets.ts on every pull request (and every push to
      # main) as its own required context, reading the head only as git
      # objects, so a second copy in this job would add no judge.

      # Base freshness is PR-only and lives in ci-pr.yml, where it is the last
      # step of the job: a push or a dispatch tests main itself, which is
      # exactly what the freshness certificate refuses to certify.

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Page geometry check
        run: node scripts/check-page-geometry.mjs

  # Raises the committed coverage floor when a main push measured higher
  # than the record by more than the hysteresis, and doubles as the calibrate
  # self-test: a workflow_dispatch carrying simulate-refused-raise fabricates
  # a coverage raise so the push to main is refused by branch protection —
  # a bot commit can never carry the required checks — and the push job below
  # fails visibly, which is the point (issue 684). Push-only otherwise: a pull
  # request must never write to the branch it targets, and the pull-request
  # leg of this gate is ci-pr.yml, which calibrate cannot reach — ci.yml
  # carries no pull-request trigger, so nothing in this file ever runs on a
  # pull request.
  # Docs-only runs produce no coverage summary and are skipped by the
  # verify job's docs_only output.
  #
  # Issue 1036 splits the job along its privilege boundary. This job runs
  # repository scripts — calibrate-coverage.ts and check-coverage-floor.ts,
  # which import only Node built-ins, so there is no install and no pnpm —
  # and therefore holds no write token: it publishes the computed document as
  # the outputs the push-recalibration job consumes. That job alone holds
  # contents: write and runs no repository or dependency code at all, so no
  # code this workflow executes can reach a write token.
  calibrate:
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.docs_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.simulate-refused-raise == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No job-level permissions block: the workflow's contents: read is every
    # scope this job's steps use, the same inheritance verify relies on.
    outputs:
      changed: ${{ steps.document.outputs.changed }}
      document: ${{ steps.document.outputs.document }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The document the job exports is judged against the record HEAD
          # carries; the HEAD^1 read the old depth-2 checkout served moved to
          # the push job with the refusal message (issue 1036).
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Download coverage summary
        if: ${{ inputs.simulate-refused-raise != true }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
          path: coverage

      - name: Calibrate the coverage floor
        if: ${{ inputs.simulate-refused-raise != true }}
        run: node scripts/calibrate-coverage.ts

      # The self-test half: in place of a measurement, calibrate-coverage
      # fabricates a raise off the recorded document alone, so the push below
      # is guaranteed to be refused and the push job's failure is the thing
      # under test.
      - name: Fabricate the simulated raise
        if: ${{ inputs.simulate-refused-raise == true }}
        run: node scripts/calibrate-coverage.ts --simulate-refused-raise

      # The document leaves this job as an output, not as a push: calibrate
      # holds no write token (issue 1036). `changed` is the diff of the
      # document against the record HEAD carries — a within-hysteresis
      # measurement writes nothing, so a run with nothing to raise sets it
      # false and the push job below is skipped. The heredoc delimiter cannot
      # occur in the machine-written JSON document.
      - name: Export the recalibrated document
        id: document
        run: |
          if git diff --quiet -- scripts/coverage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'document<<COVERAGE_FLOOR_DOCUMENT_END'
            cat scripts/coverage.json
            echo 'COVERAGE_FLOOR_DOCUMENT_END'
          } >> "$GITHUB_OUTPUT"

  # The push half (issue 1036): the only contents: write holder in this file,
  # and it runs no repository or dependency code — plain git over the document
  # bytes calibrate exported, so no code this workflow runs can reach a write
  # token. The refusal semantics are the superseded script's own, kept on its
  # deletion: the bot identity set per command, the commit message, the
  # HEAD:refs/heads/main refspec, the one fetch-rebase-retry on a warranted
  # raise racing main, and a ::error:: naming the recorded and measured floors
  # plus the manual remedy — a refusal is EXPECTED under main's branch
  # protection (a bot commit can never carry the required checks) and fails
  # the job visibly instead of reading as green (issue 684).
  push-recalibration:
    needs: calibrate
    if: ${{ needs.calibrate.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The refusal message reads the recorded floor from HEAD^1; a
          # depth-1 checkout would degrade it to the unreadable-floors
          # fallback.
          fetch-depth: 2

     - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -f gcc scripts/*.sh

    - name: Commit and push the recalibrated floor
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENT: ${{ needs.calibrate.outputs.document }}
          # Network git must fail, not hang waiting for credentials.
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: "true"
        run: |
          DOC_PATH="scripts/coverage.json"

          if [ -n "${PUSH_REMOTE_URL:-}" ]; then
            PUSH_URL="${PUSH_REMOTE_URL}"
          else
            PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          # The document arrives through env and is written verbatim; the
          # diff below judges it against the record HEAD carries.
          printf '%s\n' "$DOCUMENT" > "$DOC_PATH"

          # Secrets that must never reach the output: the push and fetch URLs
          # carry the token and git echoes failing URLs verbatim, so every
          # line git produced passes through redact() before printing — the
          # same rule the script applied. The token is replaced literally,
          # never as a regex, and an unset token — the behavioral tests' —
          # replaces nothing.
          redact() {
            if [ -n "${GH_TOKEN:-}" ]; then
              printf '%s\n' "${1//"$GH_TOKEN"/***}"
            else
              printf '%s\n' "$1"
            fi
          }

          # The refusal alarm. Runs once the push has definitely failed for
          # good; exits 1 even when the floors themselves cannot be read, so
          # the alarm cannot be swallowed by a secondary failure.
          refuse() {
            local floors recorded measured
            if recorded=$(git show "HEAD^1:${DOC_PATH}" | sed -n 's/^ *"floor": *\([0-9.][0-9.]*\).*/\1/p') &&
              measured=$(git show "HEAD:${DOC_PATH}" | sed -n 's/^ *"floor": *\([0-9.][0-9.]*\).*/\1/p') &&
              [ -n "$recorded" ] && [ -n "$measured" ]; then
              floors="recorded floor ${recorded}% vs measured floor ${measured}%"
            else
              floors="the floors could not be read from HEAD^1 and HEAD (shallow checkout?)"
            fi
            echo "::error::coverage-floor recalibration refused ($1): ${floors}. Cause: main's branch protection refuses pushes from GITHUB_TOKEN — a bot commit can never carry the required checks. Remedy: record the raise by hand: run the suite with coverage, run node scripts/calibrate-coverage.ts, commit scripts/coverage.json, open an ordinary pull request — CONTRIBUTING.md, 'Coverage is floored'."
            exit 1
          }

          # The job's if: on calibrate's changed output is the first gate;
          # this re-check is the second, the same one the script applied: a
          # raced main that already carries the raise pushes nothing.
          if git diff --quiet -- "$DOC_PATH"; then
            echo "coverage floor already current; nothing to push"
            exit 0
          fi

          # Identity set per command, like the push URL: nothing about the
          # bot is persisted to the repository's config either.
          git add -- "$DOC_PATH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ci: update CI ratchets"

          if output=$(git push "$PUSH_URL" HEAD:refs/heads/main 2>&1); then
            echo "coverage floor recalibration: pushed $(git rev-parse HEAD) to main"
            exit 0
          fi
          redact "$output" >&2

          # Refused. Expected whenever a warranted raise races main or
          # protection refuses bots: fetch the remote main, replay, retry
          # once.
          if ! fetched=$(git fetch --depth=2 "$PUSH_URL" main 2>&1); then
            redact "$fetched" >&2
            refuse "could not fetch main after the refusal"
          fi
          if ! rebased=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase FETCH_HEAD 2>&1); then
            git rebase --abort || true
            redact "$rebased" >&2
            refuse "rebase onto main failed"
          fi
          if output=$(git push "$PUSH_URL" HEAD:refs/heads/main 2>&1); then
            echo "coverage floor recalibration: pushed $(git rev-parse HEAD) to main"
            exit 0
          fi
          redact "$output" >&2
          refuse "push refused twice"
