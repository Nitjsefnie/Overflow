name: ci

# The complete release gate. It exercises the real migration path against
# PostgreSQL before running every behavioral, static, and production-build check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      docs_only: ${{ steps.detect-docs.outputs.docs_only }}

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      APP_URL: https://overflow.invalid
      GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      MODERATOR_GITHUB_USER_IDS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      # A change that touched only documentation cannot move coverage, so the
      # measurement below would compare the same tree against itself. Detect
      # it instead of measuring it: fetch the checkout commit's parent, list
      # the changed paths NUL-delimited, and let scripts/docs-only.ts decide.
      # An empty diff counts as code, so an undecidable change is measured.
      - name: Detect docs-only change
        id: detect-docs
        run: |
          git fetch --depth=2 origin "${GITHUB_SHA}"
          changed=$(git diff --name-only -z HEAD^1 HEAD | node scripts/docs-only.ts)
          echo "docs_only=${changed}" >> "$GITHUB_OUTPUT"

      - name: Test suite
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: pnpm test --run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.include='src/**'

      - name: Test suite (docs-only)
        if: ${{ steps.detect-docs.outputs.docs_only == 'true' }}
        run: pnpm test --run

      - name: Coverage floor
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        run: node scripts/check-coverage-floor.ts

      - name: Upload coverage summary
        if: ${{ steps.detect-docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Lint
        run: pnpm lint

      - name: Module size ceilings
        run: node scripts/check-module-size.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Page geometry check
        run: node scripts/check-page-geometry.mjs

      # A pull_request run tests refs/pull/N/merge — the head merged with the
      # base as it stood at event time — and branch protection keeps strict
      # up-to-date checking disabled, so a run that went green against an older
      # main stays green after main advances: the tree GitHub actually lands
      # (its rebase onto current main) was never tested by a required check
      # (issue 441). LAST step, deliberately: the freshness certificate is
      # issued as late as the workflow can issue it, because an earlier step
      # re-opens the whole run duration as the stale-base window. The step runs
      # scripts/ci-base-freshness.sh, which certifies when the base is
      # unchanged OR advanced only disjointly from the files this pull request
      # changes — an advance that touched none of them carried its own required
      # checks, and only cross-file interaction goes unverified — and refuses
      # on everything else: an overlapping advance, a failed or empty API
      # response, an unrepresentative compare (issue 510; the first version
      # demanded main frozen for the whole run, which no run could satisfy at
      # the repository's merge cadence). Push and workflow_dispatch runs test
      # main itself and skip the gate.
      - name: Base freshness
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-base-freshness.sh

  # Raises the committed coverage floor when a main push measured higher
  # than the record by more than the hysteresis. Push-only: a pull request
  # must never write to the branch it targets. Docs-only runs produce no
  # coverage summary and are skipped by the verify job's docs_only output.
  calibrate:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-summary
          path: coverage

      - name: Calibrate the coverage floor
        run: node scripts/calibrate-coverage.ts

      # The job token rides in the push URL only — never persisted to
      # .git/config. A rejected push (main moved under us) retries once
      # after a rebase; a second rejection is left to the next main run,
      # which recalibrates against the newer tree anyway.
      - name: Push the recalibrated floor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- scripts/coverage.json; then
            echo "coverage floor already current; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/coverage.json
          git commit -m "ci: update CI ratchets"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git push "$remote" "HEAD:refs/heads/main"; then
            echo "pushed the recalibrated coverage floor"
            exit 0
          fi
          echo "push rejected; retrying once after a rebase onto main"
          git fetch "$remote" --depth=2 main
          if git rebase FETCH_HEAD; then
            if git push "$remote" "HEAD:refs/heads/main"; then
              echo "pushed the recalibrated coverage floor after rebase"
            else
              echo "push rejected twice; leaving the recalibration to the next main run"
            fi
          else
            echo "rebase onto main failed; leaving the recalibration to the next main run"
            git rebase --abort
          fi
