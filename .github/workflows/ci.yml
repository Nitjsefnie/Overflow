name: ci

# The complete release gate for main. It exercises the real migration path
# against PostgreSQL before running every behavioral, static, and
# production-build check.
#
# THE PULL-REQUEST LEG IS NOT HERE. It is
# .github/workflows/ci-pr.yml, whose only trigger is pr suite's workflow_run
# completion. Its default-branch scripts API-bind the upstream run to a PR and
# judge its merge tree as data, without executing the pull request's code.
# What is left here — push to main and workflow_dispatch — tests main itself and reads no pull-request data at all: no `refs/pull`
# fetch, no `pull_request.*` value in any step's `run` or `env`.
# tests/ci/pr-data-triggers.test.ts decides that from the workflow text rather
# than from this comment, and refuses any job that both runs a
# checkout/fetch/pull and names a pull-request-derived value outside a
# pull_request_target-only workflow, or ci-pr.yml's admitted workflow_run.
#
# Both files produce the `verify` job name, and
# .github/required-checks.json pins that context to BOTH paths, so a
# required-context conclusion arrives on a pull-request head and on a main push
# alike.
#
# workflow_dispatch is the deploy-recovery dispatch and stays here (deploy/
# README.md): it re-measures a commit on demand. Nothing in this file can
# reach a pull request's data, which is what makes a privileged dispatch safe
# here.
#
# The tests run through Nitjsefnie-Actions/test-ratchet: plan, the test
# matrix and report. report gates the coverage floor in
# .github/ci-thresholds.json and, on a push to main, commits the raised
# records with the main-push environment's deploy key; its job runs no
# repository or dependency code. The App key stays in the ledger relay's
# environment. The relay posts the required contexts only from
# trusted runs (API-validated ci-pr workflow_run, pull_request_target, or
# push/dispatch/schedule on main), never
# from a pull_request run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every leg here keys on its own SHA, so no push to main and no dispatch
  # shares a group: GitHub keeps one PENDING run per group and cancels the
  # superseded one even with cancel-in-progress false, and a cancelled
  # conclusion on a merged SHA makes the deploy gate refuse immediately. The
  # sibling ci-pr.yml also isolates heads by SHA, using its triggering suite's
  # head rather than the workflow_run's default-branch SHA.
  #
  # cancel-in-progress is false so no in-flight run is destroyed; on a per-SHA
  # group the run it could destroy is this SHA's own earlier attempt, and
  # `verify` is a required context ledger-relay mirrors the conclusion onto.
  # It does NOT stop GitHub cancelling the group's PENDING run — that happens
  # by default, and the flag is the boolean false rather than an event
  # expression because nothing here needs the two halves apart. ci-pr.yml
  # preserves its in-flight work too, even if suite completions arrive out of
  # head order.
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The service image both CI workflows start is resolved at run time from the
  # digest-pinned ci/Dockerfile; the Dependabot /ci/ docker lane is its only
  # writer.
  postgres-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      records-only: ${{ steps.changes.outputs.records-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the push diff
        id: changes
        env:
          OVERFLOW_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_records.py classify >> "$GITHUB_OUTPUT"

      - name: Resolve the PostgreSQL service image reference
        id: image
        run: |
          image="$(awk 'tolower($1)=="from"{print $2; exit}' ci/Dockerfile)"
          if [ -z "${image}" ]; then
            echo "::error::no FROM line in ci/Dockerfile" >&2
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # Splits the test files into shards balanced by the run times recorded in
  # .github/test-times.json. It reads only the repository and the times file.
  # A records-only push runs it only when record-source found no usable run (an
  # empty run id); `!cancelled()` keeps record-source's skip on a code push from
  # skipping it.
  plan:
    needs: [postgres-image, record-source]
    if: ${{ !cancelled() && needs.postgres-image.result == 'success' && (needs.postgres-image.outputs.records-only != 'true' || (needs.record-source.result == 'success' && needs.record-source.outputs.run-id == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          tests: |
            tests/**/*.test.ts
            tests/**/*.test.tsx
          times: .github/test-times.json
          cell: ubuntu-latest-node24.22.3
          max-minutes: 10

  # One shard of the suite with coverage measured over src/, against the real
  # migration path on PostgreSQL. Full history: the suite includes the
  # secret-scan baseline's provenance check, which skips wherever the checkout
  # is shallower than the baseline's entries. This is MAIN's own history, so
  # the depth carries no pull-request data into a privileged job.
  test:
    needs: [postgres-image, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # The reference is read at run time from the digest-pinned ci/Dockerfile by
        # the postgres-image job; zizmor cannot resolve a needs expression to a digest,
        # so this line carries the audit's suppression directive.
        image: ${{ needs.postgres-image.outputs.image }}  # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      OVERFLOW_DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      OVERFLOW_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      OVERFLOW_APP_URL: https://overflow.invalid
      OVERFLOW_GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      OVERFLOW_MODERATOR_GITHUB_USER_IDS: "1"
      # At job scope so every `pnpm` step inherits both pins.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      - uses: Nitjsefnie-Actions/test-ratchet/run@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          runner: vitest
          tests: |
            tests/**/*.test.ts
            tests/**/*.test.tsx
          times: .github/test-times.json
          cell: ubuntu-latest-node24.22.3
          shard: ${{ matrix.shard }}
          source: src/**
          javascript: src/**

  # Keep all repository code and API polling outside the job holding the deploy key.
  # It retries failed API calls and waits for the code push it borrows, so its cap
  # outlasts that run's postgres-image, plan, test, report and verify timeouts
  # end to end, with room for queueing and retry sleeps.
  record-source:
    needs: postgres-image
    if: needs.postgres-image.outputs.records-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the successful main push that tested this code
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          OVERFLOW_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_records.py source >> "$GITHUB_OUTPUT"

  # Only the pinned action runs with the records key. The one-point coverage
  # gap keeps the floor close. Half-point hysteresis limits record churn,
  # and two decimal places preserve small gains when the floor advances.
  report:
    needs: [postgres-image, test, record-source]
    if: ${{ !cancelled() && (needs.postgres-image.outputs.records-only != 'true' || needs.record-source.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: main-push
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/test-ratchet/report@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.record-source.outputs.run-id || github.run_id }}
          cell: ubuntu-latest-node24.22.3
          times: .github/test-times.json
          precision: '2'
          records-only-rise: 'true'
          push-key: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}

  # verify always concludes: the deploy gate refuses every conclusion but
  # success (scripts/deploy-revision.sh), so a run whose test matrix or
  # report failed, or was cancelled, records verify as a failure naming the
  # job instead of a skip.
  verify:
    needs: [postgres-image, test, record-source, report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # The reference is read at run time from the digest-pinned ci/Dockerfile by
        # the postgres-image job; zizmor cannot resolve a needs expression to a digest,
        # so this line carries the audit's suppression directive.
        image: ${{ needs.postgres-image.outputs.image }}  # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: overflow
          POSTGRES_PASSWORD: overflow
          POSTGRES_DB: overflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overflow -d overflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders satisfy configuration validation without carrying production
    # credentials or granting access to an external system.
    env:
      OVERFLOW_DATABASE_URL: postgresql://overflow:overflow@127.0.0.1:5432/overflow_ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_GITHUB_ID: ci-placeholder-github-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-client-secret
      OVERFLOW_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      OVERFLOW_APP_URL: https://overflow.invalid
      OVERFLOW_GITHUB_WEBHOOK_URL: https://overflow.invalid/api/github/webhooks
      OVERFLOW_MODERATOR_GITHUB_USER_IDS: "1"
      # At job scope so every `pnpm` step inherits both pins.
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      - name: Require the test matrix and report
        env:
          OVERFLOW_RECORDS_ONLY: ${{ needs.postgres-image.outputs.records-only }}
          OVERFLOW_SOURCE_RESULT: ${{ needs.record-source.result }}
          OVERFLOW_TEST_RESULT: ${{ needs.test.result }}
          OVERFLOW_REPORT_RESULT: ${{ needs.report.result }}
        run: |
          case "$OVERFLOW_RECORDS_ONLY/$OVERFLOW_TEST_RESULT/$OVERFLOW_SOURCE_RESULT/$OVERFLOW_REPORT_RESULT" in
            false/success/skipped/success | true/skipped/success/success | true/success/success/success) exit 0 ;;
          esac
          echo "::error::records-only=$OVERFLOW_RECORDS_ONLY test=$OVERFLOW_TEST_RESULT source=$OVERFLOW_SOURCE_RESULT report=$OVERFLOW_REPORT_RESULT"
          exit 1

      # No ref input: the default checkout takes the event's own commit — the
      # pushed main tip on a push, the dispatched ref's commit on a
      # workflow_dispatch. This is MAIN's own history — no refs/pull fetch and
      # no pull_request.* value anywhere in this file — so the depth carries no
      # pull-request data into a privileged job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A conflict marker is text that looks like prose in a Markdown file,
      # so only a mechanical check can see it. git grep reads the tracked
      # files out of the working tree, which on a clean checkout is what
      # the repository ships, and -I keeps a binary from being reported as
      # a match. The three markers are matched in the shapes git writes
      # them: `<<<<<<< ` and `>>>>>>> ` carry the label after seven
      # characters, and the separator is exactly seven `=`; diff3's extra
      # `||||||| base` line changes nothing, because the other three are
      # still written. It runs first, before anything is installed, and
      # searches this file's only tree: the checked-out event commit. The
      # pull_request_target leg of this same gate, over the materialised
      # merge tree, is the sibling step in ci-pr.yml.
      - name: Check no tracked file carries a merge-conflict marker
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      # No ratchet-document step here: ratchet-guard.yml runs main's copy of
      # scripts/check-ratchets.ts on every pull request (and every push to
      # main) as its own required context, reading the head only as git
      # objects, so a second copy in this job would add no judge.

      # Base freshness is PR-only and lives in ci-pr.yml, where it is the last
      # step of the job: a push or a dispatch tests main itself, which is
      # exactly what the freshness certificate refuses to certify.

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prerendered routes check
        run: node scripts/check-prerendered-routes.ts

      - name: Page geometry check
        run: node scripts/check-page-geometry.mjs

      - name: SQL statement budget check
        run: node scripts/check-perf-budget.ts

  # ShellCheck over the repository's shell scripts. Its own job:
  # nothing it needs — no database, no install, no build — so it lints beside
  # verify rather than lengthening it, and a scripts-only defect fails in
  # minutes. The pull-request leg is NOT here: ci-pr.yml
  # runs under pull_request_target, where only the base checkout's gate scripts
  # may run and nothing may be installed, so the request's OWN scripts are
  # linted by the ShellCheck steps in pr-suite.yml — the one workflow whose
  # checkout is the request's tree. Nothing in this job reads pull-request
  # data: the checkout below is the event's own commit, and tests/ci/
  # pr-data-triggers.test.ts holds that shape.
  #
  # WHY THE VERSION IS PINNED, AND WHY v0.11.0. New shellcheck releases grow
  # new checks, and a floating version would redden main for reasons no change
  # in this repository caused — the same argument secret-scan.sh makes for its
  # gitleaks pin. v0.11.0 is the latest release, so nothing newer exists for a
  # dependabot lane to propose. The binary comes from the release itself and is
  # checksum-verified before it runs, exactly as the actionlint workflows
  # install theirs; that release publishes no checksums file of its own, so the
  # sha256 below was computed from the downloaded artifact and pins its bytes.
  # Bump the version and the checksum together.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVERFLOW_SHELLCHECK_REPO: koalaman/shellcheck
      OVERFLOW_SHELLCHECK_VERSION: 0.11.0
      # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz; bump with the version.
      OVERFLOW_SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

    steps:
      # The default checkout: the pushed main tip on a push, the dispatched
      # ref's commit on a workflow_dispatch — the scripts this job lints. The
      # check reads the working tree's files only, so the default depth needs
      # no override.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          tarball="shellcheck-v${OVERFLOW_SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/${OVERFLOW_SHELLCHECK_REPO}/releases/download/v${OVERFLOW_SHELLCHECK_VERSION}/${tarball}"
          echo "${OVERFLOW_SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" --strip-components=1 "shellcheck-v${OVERFLOW_SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version

      # The gate: any diagnostic fails the job, so a red run means a script in
      # this repository carries something shellcheck flags — fix it, or carry a
      # reasoned directive beside it as deploy-revision.sh does.
      - name: ShellCheck
        run: ./shellcheck -f gcc scripts/*.sh
