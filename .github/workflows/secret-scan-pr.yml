name: secret scan pull request

# The pull-request leg of the full-history secret scan, in a file of its own so
# that the only trigger it can be started by is `pull_request_target` (issue
# 1090).
#
# WHY THE SPLIT. This job fetches a pull request's head ref so gitleaks walks
# it. `push`, `schedule` and `workflow_dispatch` all run a workflow from the
# default branch with the default branch's privileges, so a step reading
# pull-request content under one of them is untrusted content entering a
# privileged job — the shape CodeQL's
# `actions/cache-poisoning/poisonable-step` and `actions/untrusted-checkout`
# alerts report. The `if: github.event_name == 'pull_request_target'` gates
# that used to hold the shapes apart made the paths safe, not structural.
# tests/ci/pr-data-triggers.test.ts decides which jobs read pull-request data
# from the workflow text and requires this file's whole `on:` set to be
# {pull_request_target}.
#
# The other half — push, the daily sweep and dispatch — is
# .github/workflows/secret-scan.yml. That file's job reads no pull-request
# data at all: no `refs/pull` fetch, no `pull_request.*` value in any step's
# `run` or `env`. Both files produce the `secret-scan` job name, and this
# file's `name` is in the ledger relay's `workflows:` filter so its completions
# are relayed like any other producer's.
#
# Under pull_request_target the default checkout and executed scripts come from
# main. PR history enters only as git objects in refs/remotes/pr/head; none of
# the PR's code is checked out or executed, and the baseline that suppresses
# known findings is MAIN'S, never the pull request's own.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Each PR has its own group: a newer run can replace only that PR's pending
  # scan, never another PR's, so this leg stays unbounded on purpose — it is in
  # tests/ci/concurrency.test.ts's UNBOUNDED_BY_CHOICE table with that reason.
  # The group keys on the pull request number, which exists on a
  # pull_request_target event. false preserves every in-flight full-history
  # scan as a detection record.
  group: secret-scan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each event must have a comparison path; otherwise a new trigger could
      # produce a green job that ran only setup-node.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request_target" ]]; then
            echo "::error::Unhandled secret-scan event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # No ref input under pull_request_target: the default checkout is main,
      # so only trusted scripts execute. Full history is required, so the PR's
      # commits are in the object set gitleaks walks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read PR content only as git objects. Event values enter through env,
      # never interpolation into run. gitleaks walks all refs, including this one.
      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      # The gitleaks ACTION is deliberately not used: it decides the scanner's
      # version, so a bump inside it would move the rule set under a committed
      # baseline with nothing in this repository to change. The release
      # tarball is downloaded, checksum-verified and extracted here instead, so
      # the version this job scans with is the version the file records.
      # Values reach the shell through env:, never through ${{ }} in run:.
      #
      # `echo "$install_dir" >> "$GITHUB_PATH"` is load-bearing and not
      # decoration. Every `run:` block is a fresh shell whose PATH is the
      # runner's, NOT this step's working directory, so a binary extracted
      # anywhere in this step is invisible to the next one — and the next step
      # resolves `gitleaks` by bare name, through
      # scripts/secret-scan.sh's `command -v`. Without that line this job
      # failed every run with "no gitleaks on PATH", and because the header
      # above tells the reader that a version message means a drifted scanner,
      # the real cause pointed somewhere else. Extracting into $RUNNER_TEMP
      # rather than the workspace is a second, smaller choice with the same
      # reason behind it: the checkout above just fetched a full history with
      # fetch-depth: 0, and a downloaded executable does not belong in that
      # tree. tests/ci/secret-scan-workflow.test.ts executes both steps against
      # a simulated runner, so the line cannot be dropped again silently.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # gitleaks_8.30.1_checksums.txt. Bump the version and checksum
          # together, and with PINNED_GITLEAKS_VERSION in
          # scripts/secret-scan.sh.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The github-env ignore covers the constant value written:
        # "${RUNNER_TEMP}/gitleaks-bin"; no untrusted value reaches GITHUB_PATH
        # under any event, and bare-name resolution (command -v gitleaks in
        # scripts/secret-scan.sh) depends on this line. (issue 984)
        run: | # zizmor: ignore[github-env]
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          # sha256sum is the LAST stage of this pipeline, which is what makes it
          # safe under a runner's `bash -e`: with no pipefail a pipeline's
          # status is the last stage's, so the step inherits THIS check's
          # status. That is a property of the order, not of the flags — an
          # earlier stage failing while a later one succeeded would be
          # invisible, and the downloader's own flags (`-f -sS -L
          # --retry 3`) are what cover the download. Do not reorder these two
          # commands, and do not append a stage after sha256sum.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          tar -xzf "$tarball" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      # The exit code of this step IS the signal. No continue-on-error, no
      # `if: always()` — anything that lets the run proceed past a nonzero exit
      # turns a detection signal into decoration. The script checks the
      # gitleaks version before scanning, so a drifted scanner fails here with a
      # message rather than producing findings the baseline cannot explain.
      - name: Scan the full history
        env:
          GITLEAKS_REPORT_PATH: gitleaks-report.json
        run: bash scripts/secret-scan.sh

      # `if: always()` is the only thing that makes a RED run leave the report
      # behind, and the report is what a human reads to learn which commit and
      # which line carried the finding. Uploading a report from a clean run is
      # harmless: it is an empty array.
      - name: Upload the findings report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

      # Baseline commits must be reachable from HEAD or from the fetched PR
      # head. This runs after the upload so an unreachable entry does not
      # discard the scan's report. Full depth lets ancestry distinguish an
      # orphaned entry from a commit a shallow checkout simply never fetched.
      #
      # tests/ci/secret-scan-workflow.test.ts EXECUTES this step's `run:` block
      # verbatim against repositories it builds, with and without an entry that is
      # not an ancestor of HEAD, so the check is shown to reject rather than only
      # to be shaped like a check.
      - name: Check the baseline's commits are reachable from main or the PR
        run: bash scripts/secret-scan-baseline.sh refs/remotes/pr/head
