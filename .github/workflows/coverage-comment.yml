name: coverage comment

# Issue 592 mechanism 3: the patch coverage report, commented onto the pull
# request. The pr suite workflow (pr-suite.yml) measures it — that is where a
# pull request's own code runs, under `pull_request` — but holds no
# PR-writing token; this workflow_run job holds one and therefore touches
# nothing from the pull request:
#
#   - it checks out NOTHING — the workspace stays empty, run blocks reference
#     env names only, and the artifact is parsed as data only;
#   - only a run triggered by pull_request or pull_request_target can have a
#     destination: the pr suite triggers on the former, and the latter is
#     kept accepted, while any other event's run measured no diff a pull
#     request owns, so it exits silently;
#   - the destination pull request is resolved from the triggering event
#     only — its head repository, head branch and head SHA (issue 656): a
#     candidate from another repository, or whose head has moved past the
#     event's SHA, is never selected; zero matches exits silently, more than
#     one fails loudly, and a claim inside a same-repository artifact that
#     mismatches the event-resolved PR fails loudly;
#   - a fork's pull request IS resolved and commented on, but only from its
#     two totals: a pull_request_target run reports the FORK as its head
#     repository, so the binding finds that fork's own pull request and
#     same_repo is false for it — the artifact's markdown and file list are
#     never posted, and the body is rendered here from total_added and
#     total_covered alone, validated as non-negative integers with covered
#     <= added;
#   - one marker-identified comment is posted or updated in place, never
#     duplicated — and only a comment github-actions[bot] wrote counts, so a
#     marker planted in anyone else's comment is neither edited nor able to
#     hide the bot's own;
#   - a red or cancelled run, a missing artifact, and an unmeasurable report
#     all substitute a "not measured" body, so a stale percentage never looks
#     current;
#   - a body over the API's 65536-character limit is refused (exit 1), never
#     truncated;
#   - the outcome is published as a "coverage comment" check run on the
#     triggering run's head SHA: success when a comment was posted or updated
#     (either body variant), failure on any loud failure.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] — checks out nothing, executes nothing from the artifact, binds the destination PR to the event's head repository, branch and SHA, and posts a fork's report only as validated integer totals; the pinning and behavior suites hold that shape
    workflows: [pr suite]
    types: [completed]

# pull-requests: write to upsert the comment, checks: write to publish the
# check run, actions: read to download the triggering run's artifact.
permissions:
  pull-requests: "write"
  checks: "write"
  actions: "read"

# Serializes runs for one head repository and branch so concurrent runs
# cannot each post a fresh comment and duplicate it; older runs still
# complete so a cancelled successor does not silently drop the update. The
# key is a cancellation authority: a group keeps at most one pending run, and
# a newly queued run supersedes the pending one even with cancel-in-progress
# off. Keyed on the branch alone, another repository's same-named branch (two
# forks' patch-1, say) would share the group and drop this PR's pending
# update, leaving its older percentage looking current — so the head
# repository is part of the key. The group safely holds the attacker-
# controlled names: it is an opaque string key, never executed.
concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The destination comes from the triggering event only: its head
      # repository, head branch and head SHA. The branch is attacker-
      # controlled, so it travels through env and reaches the API as a -f
      # field, which gh URL-encodes into the query — never interpolated into
      # the run block or spliced into the path, where & or # could inject
      # parameters. GitHub's head=owner:branch filter scopes by owner; the jq
      # filter then binds every candidate to the exact repository and SHA.
      - name: Resolve the destination pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          # Only a pull-request-triggered run measured a pull request's own
          # diff; any other event has no destination: silent exit. The pr
          # suite runs on pull_request. A same-repository pull request's run
          # carries this repository as its head repository and the pull
          # request's own head SHA, so the binding below resolves that pull
          # request unchanged. A fork's run
          # reports the FORK, so the fork's own pull request is the candidate
          # that matches, and it is selected with same_repo false — the body
          # step then renders from the two validated totals and never posts
          # the artifact's markdown or file list.
          #
          # Contingency: were GitHub ever to report a fork's run as this
          # repository instead, the query would ask for a pull request
          # head-labelled <base owner>:<branch>, which a fork's pull request
          # (<fork owner>:<branch>) is not, so nothing would match and the
          # run would exit silently.
          if [[ "$RUN_EVENT" != "pull_request" && "$RUN_EVENT" != "pull_request_target" ]]; then
            echo "the triggering pr suite run was a ${RUN_EVENT} run, not a pull_request or pull_request_target run; nothing to comment on"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A deleted head repository leaves nothing to bind the destination
          # to: silent exit, exit 0.
          if [[ -z "$HEAD_OWNER" || -z "$HEAD_REPO" ]]; then
            echo "the triggering run's head repository no longer exists; nothing to comment on"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prs=$(gh api -X GET "repos/$REPO_SLUG/pulls" \
            -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" -f per_page=100)
          # A deleted fork has head.repo null; null.full_name is null in jq, so
          # it simply does not match.
          matches=$(printf '%s' "$prs" | jq -c --arg repo "$HEAD_REPO" --arg sha "$HEAD_SHA" \
            '[.[] | select(.head.repo.full_name == $repo and .head.sha == $sha) | .number]')
          count=$(printf '%s' "$matches" | jq 'length')
          # Zero matches — a merged or closed PR, a main push, or a PR head
          # that moved on (the newer run posts) — is a silent exit: nothing to
          # report, exit 0. More than one is ambiguous: refuse loudly rather
          # than guess.
          case "$count" in
            0)
              echo "no open pull request from this head repository and branch is at the triggering run's head SHA; nothing to comment on (a newer run posts if the head moved on)"
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            1)
              pr_number=$(printf '%s' "$matches" | jq -r '.[0]')
              same_repo=false
              if [[ "$HEAD_REPO" == "$REPO_SLUG" ]]; then
                same_repo=true
              fi
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
              echo "same_repo=${same_repo}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::found ${count} open pull requests carrying this head branch; refusing to guess the destination"
              exit 1
              ;;
          esac

      # Cross-run artifact download: run-id scopes it to the triggering run,
      # and github-token is required for cross-run downloads. The
      # continue-on-error is the no-report path — a docs-only run uploads
      # nothing and a failed download retrieves nothing, and either must
      # reach the not-measured body, not fail the job.
      - name: Download the patch coverage artifact
        id: artifact
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-coverage
          path: patch-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # JSON parsed as data only (jq), never executed. A same-repository head
      # gets the pre-rendered markdown field verbatim. A fork head wrote the
      # whole artifact, so nothing it rendered is posted: the body is built
      # here from total_added and total_covered alone, mirroring the heading,
      # informational line and totals line of renderMarkdown in
      # scripts/patch-coverage.ts, and totals that are not non-negative
      # integers with covered <= added get the not-measurable body.
      - name: Determine the comment body
        id: body
        if: steps.pr.outputs.found == 'true'
        shell: bash
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          SAME_REPO: ${{ steps.pr.outputs.same_repo }}
        run: |
          set -euo pipefail
          marker="<!-- overflow:coverage-comment -->"
          body_file="comment-body.md"
          stale="a percentage carried over from an earlier run is stale, not current"

          if [[ "$CONCLUSION" != "success" ]]; then
            printf '%s\n\nThe pr suite run concluded %s, so patch coverage was not measured for it; %s.\n' "$marker" "$CONCLUSION" "$stale" > "$body_file"
          elif [[ ! -f patch-coverage/patch-coverage.json ]]; then
            printf '%s\n\nNo patch coverage report could be retrieved for this run, so patch coverage was not measured for it; %s.\n' "$marker" "$stale" > "$body_file"
          elif [[ "$(jq -r '.measured // false' patch-coverage/patch-coverage.json)" != "true" ]]; then
            printf '%s\n\nThe patch-coverage artifact from this run is not measurable, so patch coverage was not measured for it; %s.\n' "$marker" "$stale" > "$body_file"
          elif [[ "${SAME_REPO:-}" != "true" ]]; then
            # Fork head: only the two totals are read, and only as validated
            # integers. jq 1.7 prints an untouched literal as written (3.0,
            # 1E+3, -0), so each is re-derived by arithmetic before printing;
            # the safe-integer bound keeps it in plain notation.
            totals=$(jq -r '
              def count: type == "number" and . >= 0 and . == floor and . <= 9007199254740991;
              if (.total_added | count) and (.total_covered | count) and .total_covered <= .total_added
              then (.total_added | floor + 0) as $added
                | (.total_covered | floor + 0) as $covered
                | "\($covered) \($added) \(if $added == 0 then 0 else (($covered / $added) * 100 * 100 | round) / 100 end)"
              else empty end' patch-coverage/patch-coverage.json)
            if [[ -z "$totals" ]]; then
              printf '%s\n\nThe patch-coverage artifact from this run is not measurable, so patch coverage was not measured for it; %s.\n' "$marker" "$stale" > "$body_file"
            else
              read -r covered added pct <<< "$totals"
              {
                printf '%s\n\n## Patch coverage\n\nInformational — not a gate; the coverage floor remains the merge criterion.\n\n' "$marker"
                if (( added == 0 )); then
                  printf 'No added line was executable in the cobertura report, so there is nothing to measure.\n'
                else
                  printf '**%s** of **%s** added lines covered (%s%%).\n' "$covered" "$added" "$pct"
                fi
                printf '\n%s\n' "The per-file table is omitted because this pull request's head is from a fork."
              } > "$body_file"
            fi
          else
            # Any claim inside the artifact must match the event-resolved PR
            # and the event's head branch; today's artifact carries neither
            # field, so this is the loud failure for a future shape that does.
            claimed_pr=$(jq -r '.pr // .pr_number // empty' patch-coverage/patch-coverage.json)
            if [[ -n "$claimed_pr" && "$claimed_pr" != "$PR_NUMBER" ]]; then
              echo "::error::the artifact claims pull request ${claimed_pr} but the triggering event resolves to pull request ${PR_NUMBER}; refusing to comment"
              exit 1
            fi
            claimed_branch=$(jq -r '.head_branch // .branch // empty' patch-coverage/patch-coverage.json)
            if [[ -n "$claimed_branch" && "$claimed_branch" != "$HEAD_BRANCH" ]]; then
              echo "::error::the artifact claims branch ${claimed_branch} but the triggering event carries branch ${HEAD_BRANCH}; refusing to comment"
              exit 1
            fi
            {
              printf '%s\n\n' "$marker"
              jq -r '.markdown // empty' patch-coverage/patch-coverage.json
            } > "$body_file"
          fi

          # Refuse, never truncate: an oversized body is a loud failure.
          chars=$(wc -m < "$body_file")
          if (( chars > 65536 )); then
            echo "::error::the assembled comment body is ${chars} characters, over the 65536-character comment limit; refusing to truncate"
            exit 1
          fi

      # One comment per pull request: found by the marker on a comment
      # github-actions[bot] wrote, updated in place, never duplicated. The
      # body rides in as a file through -F body=@file — never interpolated
      # into the command line.
      - name: Post or update the marker-identified comment
        id: comment
        if: steps.pr.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO_SLUG/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- overflow:coverage-comment -->"))) | .id')
          nl=$'\n'
          comment_id=${ids%%"$nl"*}
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/$REPO_SLUG/issues/comments/$comment_id" -F body=@"comment-body.md"
            echo "updated comment ${comment_id} in place"
          else
            gh api -X POST "repos/$REPO_SLUG/issues/$PR_NUMBER/comments" -F body=@"comment-body.md"
            echo "posted a new comment"
          fi

      # Success when a comment was posted or updated (either body variant),
      # failure on any loud failure — and every silent exit of the resolve
      # step (not a pull_request or pull_request_target run, a deleted head
      # repository, or no open PR from that head at that SHA) publishes
      # nothing at all.
      - name: Publish the coverage comment check run
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_FOUND: ${{ steps.pr.outputs.found }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          COMMENT_OUTCOME: ${{ steps.comment.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PR_FOUND" != "true" && "$PR_OUTCOME" == "success" ]]; then
            echo "no destination pull request; nothing to report"
            exit 0
          fi
          conclusion=success
          summary="posted or updated the patch coverage comment"
          if [[ "$PR_FOUND" != "true" || "$COMMENT_OUTCOME" != "success" ]]; then
            conclusion=failure
            summary="the coverage comment job failed before it could post or update the comment; see the job log"
          fi
          gh api -X POST "repos/$REPO_SLUG/check-runs" \
            -F name="coverage comment" \
            -F head_sha="$HEAD_SHA" \
            -F status=completed \
            -F conclusion="$conclusion" \
            -F output.title="patch coverage" \
            -F output.summary="$summary"
