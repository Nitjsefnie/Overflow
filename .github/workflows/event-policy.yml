name: Actions event policy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  # A per-PR group lets a newer run cancel only the same PR's older check.
  # Other PRs have separate groups; push and schedule runs key on their SHA
  # and never cancel an in-flight run.
  group: event-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  event-policy:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: overflow-ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"

      - name: Check Actions event policy
        env:
          GH_TOKEN: ${{ github.token }}
          OVERFLOW_LEDGER_APP_ID: "5118623"
          OVERFLOW_LEDGER_INSTALLATION_ID: "166057493"
          OVERFLOW_LEDGER_APP_KEY: ${{ secrets.LEDGER_APP_KEY }}
        run: node scripts/check-actions-event-policy.ts

  event-policy-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.17.0"

      - name: Check Actions event policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-actions-event-policy.ts
