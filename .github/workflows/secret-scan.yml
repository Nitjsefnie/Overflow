name: secret scan

# Full-history secret scan on every push to main, with a daily sweep and manual
# dispatch.
#
# THE PULL-REQUEST LEG IS NOT HERE (issue 1090). It is
# .github/workflows/secret-scan-pr.yml, whose only trigger is
# `pull_request_target`, because it fetches a pull request's head ref and a
# privileged trigger would run that step with the default branch's privileges.
# What is left here — push, schedule and dispatch — reads no pull-request data
# at all: no `refs/pull` fetch, no `pull_request.*` value in any step's `run`
# or `env`. tests/ci/pr-data-triggers.test.ts decides that from the workflow
# text rather than from this comment. Both files produce the `secret-scan` job
# name, and both `name:` fields are in the ledger relay's `workflows:` filter so
# their completions are relayed like any other producer's.
#
# The committed baseline suppresses known findings; any additional finding makes
# the scan fail and leaves a redacted report. The checkout and executed scripts
# come from main under every leg here.
#
# THE BASELINE, AND HOW TO REGENERATE IT. .github/gitleaks-baseline.json is the
# redacted report gitleaks 8.30.1 produced over this repository's whole
# history: 8 findings, every one a test-fixture literal under tests/, no live
# secret was ever committed. To regenerate it after a deliberate scanner or
# rule change, run from the repository root, with NO --baseline-path:
#
#   gitleaks git --redact --no-banner --report-format json \
#     --report-path .github/gitleaks-baseline.json .
#
# Commit the file as emitted — do not hand-edit, reorder or trim it, and do
# not reduce it to a list of fingerprints. gitleaks 8.30.1 compares a baseline
# entry by WHOLE-RECORD equality, so a fingerprint-only baseline suppresses
# nothing and the scan still exits 1. Prove the result by re-running with
# --baseline-path naming the committed file and seeing exit 0.
#
# "DO NOT REORDER" IS ABOUT THE ENTRIES ALREADY IN THE FILE, NOT ABOUT
# POSITION. The array is ordered newest-first by `Date`, so a hand-added entry
# goes at the head and the entries already there keep their existing relative
# order. That is what the case below describes, and it is not the reordering
# this paragraph forbids: moving an entry that is already in the file past
# another one is.
#
# THE MORE LIKELY TRIGGER, WHICH IS NOT A SCANNER CHANGE. The baseline keys on
# COMMIT SHA, so editing any file that carries a baselined fixture produces a
# new finding under a new SHA that the old baseline cannot suppress — and the
# next scan goes RED on a change that contains no secret. It fails loudly,
# which is the good case, but the remedy is to ADD the new entry to the existing
# baseline rather than regenerate the whole file: regenerating wholesale would
# absorb a genuinely new finding at the same time and bury it. So read `git diff`
# of old against new baseline, and every added entry should be a finding you can
# point at in the diff that caused it.
#
# ON A PULL REQUEST THE BASELINE IS MAIN'S, NOT YOURS. The
# pull_request_target scan in secret-scan-pr.yml uses the trusted main checkout
# and main's committed baseline. An entry added in your PR cannot suppress its
# own finding. The
# merge lands your entry, but this repository merges with `--rebase`, which
# re-creates your commits under new SHAs. The old entry lands as an orphan that
# suppresses nothing, so post-merge daily/push scans stay red until a maintainer
# removes it and adds the surviving finding's entry for the new commit SHA.
# Follow the ADD and REMOVE procedures below against the re-stamped history;
# the merge alone does not clear the finding. Never trust the PR's
# baseline file: PR content must never silence its own scan.
#
# ...AND THERE IS A THIRD CASE, WHICH IS THE OPPOSITE OF ADDING. A `--rebase`
# merge re-creates the branch's commits at merge time, so a baseline generated
# while the pre-rebase copies were still REACHABLE — still on a ref, which is
# what gitleaks walks, since it reads `git log --all` — records one logical
# finding at BOTH SHAs. The pairs c6e607f0/2d2b1482 and 1194584b/baece42a were
# exactly that. Only the post-rebase half is in the history this repository
# ships, so the pre-rebase half is an orphan: it suppresses nothing, and the last
# step of this workflow fails on it by name, naming the entry's fingerprint and
# the commit it names.
#
# "IN NO SHIPPED HISTORY" IS ABOUT THE REF SET, NOT THE OBJECT STORE, and the
# difference is the whole diagnosis. The four entries removed in eb110114 were
# never missing objects: they were the head commits of merged pull requests,
# sitting on `refs/remotes/pr/*` in the worktree that generated the baseline.
# gitleaks walked `--all`, saw them and recorded them; a checkout fetches
# branches and tags; only the PR leg explicitly fetches its head, so other
# PR refs belong to nothing this checkout scans. And where the object does
# survive locally — a shared worktree, a mirror, a local clone, which hardlinks the whole objects directory
# — it is PRESENT AND UNREFERENCED, which is why an existence check waves it
# through and only `git merge-base --is-ancestor <sha> HEAD` catches it. A
# reviewer who probes for this in a shared worktree and asks only "does git have
# the commit?" will conclude the guard is dead. It is not; it asks a different
# question, on purpose.
#
# The remedy is the opposite of the case above — REMOVE the entry that does
# not resolve, keeping the one that does. Check with `git merge-base --is-ancestor
# <sha> origin/main` before editing, and confirm the surviving entry really is
# the same finding (same file, line and rule).
#
# ...AND THE ADD WILL LAND YOU IN A SECOND RED, WHICH IS CORRECT. If the new
# entry's Match keeps source context around the redaction — a `generic-api-key`
# finding does, a `gitlab-pat` one does not — it is one more entry the
# provenance check can meaningfully examine, and tests/ci/secret-scan-script.test.ts
# pins that count as EXPECTED_CHECKABLE_ENTRIES against the committed baseline.
# Bump it in the same commit, having read the baseline diff: a change there is a
# finding for a reviewer to look at, not a number to keep in step. The two tests
# that assert it run at every checkout depth, so this red is immediate rather
# than waiting for the daily sweep.
#
# A RED RUN MEANS THE SCANER EXITED NONZERO — either the history carries a
# secret this baseline does not cover, or gitleaks itself failed. Read the
# uploaded gitleaks-report.json: it names the commit, the file, the line and
# the rule. The version is checked by scripts/secret-scan.sh BEFORE the scan
# runs, so a scanner that drifted cannot produce a confusing red run here; if
# the scan step fails with a version message, that is the cause.
on:
  # No paths filter: every push to main scans its full history.
  push:
    branches: [main]
  schedule:
    # Daily 04:41 UTC, off the top of the hour where the Actions queue is
    # busiest.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push/daily/dispatch runs group per SHA so different main tips do not
  # displace each other; runs at the same tip share a group. There is no
  # pull-request leg in this file, so nothing here keys on a pull request and
  # the bound this repository applies to pull-request-reachable workflows does
  # not apply — see secret-scan-pr.yml for the per-pull-request group its own
  # leg uses. false preserves every in-flight full-history scan as a
  # detection record.
  group: secret-scan-${{ github.sha }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each event must have a scan path; otherwise a new trigger could
      # produce a green job that ran only setup-node.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Unhandled secret-scan event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # Push checks out the pushed tip; schedule and dispatch keep their
      # default checkout. Full history is required on every leg, and
      # credentials are never persisted for the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks ACTION is deliberately not used: it decides the scanner's
      # version, so a bump inside it would move the rule set under a committed
      # baseline with nothing in this repository to change. The release
      # tarball is downloaded, checksum-verified and extracted here instead, so
      # the version this job scans with is the version the file records.
      # Values reach the shell through env:, never through ${{ }} in run:.
      #
      # `echo "$install_dir" >> "$GITHUB_PATH"` is load-bearing and not
      # decoration. Every `run:` block is a fresh shell whose PATH is the
      # runner's, NOT this step's working directory, so a binary extracted
      # anywhere in this step is invisible to the next one — and the next step
      # resolves `gitleaks` by bare name, through
      # scripts/secret-scan.sh's `command -v`. Without that line this job
      # failed every run with "no gitleaks on PATH", and because the header
      # above tells the reader that a version message means a drifted scanner,
      # the real cause pointed somewhere else. Extracting into $RUNNER_TEMP
      # rather than the workspace is a second, smaller choice with the same
      # reason behind it: the checkout above just fetched a full history with
      # fetch-depth: 0, and a downloaded executable does not belong in that
      # tree. tests/ci/secret-scan-workflow.test.ts executes both steps against
      # a simulated runner, so the line cannot be dropped again silently.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # gitleaks_8.30.1_checksums.txt. Bump the version and checksum
          # together, and with PINNED_GITLEAKS_VERSION in
          # scripts/secret-scan.sh.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The github-env ignore covers the constant value written:
        # "${RUNNER_TEMP}/gitleaks-bin"; no untrusted value reaches GITHUB_PATH
        # under any event, and bare-name resolution (command -v gitleaks in
        # scripts/secret-scan.sh) depends on this line. (issue 984)
        run: | # zizmor: ignore[github-env]
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          # sha256sum is the LAST stage of this pipeline, which is what makes it
          # safe under a runner's `bash -e`: with no pipefail a pipeline's
          # status is the last stage's, so the step inherits THIS check's
          # status. That is a property of the order, not of the flags — an
          # earlier stage failing while a later one succeeded would be
          # invisible, and the downloader's own flags (`-f -sS -L
          # --retry 3`) are what cover the download. Do not reorder these two
          # commands, and do not append a stage after sha256sum.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          tar -xzf "$tarball" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      # The exit code of this step IS the signal. No continue-on-error, no
      # `if: always()` — anything that lets the run proceed past a nonzero exit
      # turns a detection signal into decoration. The script checks the
      # gitleaks version before scanning, so a drifted scanner fails here with a
      # message rather than producing findings the baseline cannot explain.
      - name: Scan the full history
        env:
          GITLEAKS_REPORT_PATH: gitleaks-report.json
        run: bash scripts/secret-scan.sh

      # `if: always()` is the only thing that makes a RED run leave the report
      # behind, and the report is what a human reads to learn which commit and
      # which line carried the finding. Uploading a report from a clean run is
      # harmless: it is an empty array.
      - name: Upload the findings report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

      # Baseline commits must be reachable from HEAD. This runs after the upload
      # so an unreachable entry does not discard the scan's report. Full depth
      # lets ancestry distinguish an orphaned entry from a commit a shallow
      # checkout simply never fetched.
      #
      # tests/ci/secret-scan-workflow.test.ts EXECUTES this step's `run:` block
      # verbatim against repositories it builds, with and without an entry that is
      # not an ancestor of HEAD, so the check is shown to reject rather than only
      # to be shaped like a check.
      - name: Check the baseline's commits are reachable
        run: bash scripts/secret-scan-baseline.sh
