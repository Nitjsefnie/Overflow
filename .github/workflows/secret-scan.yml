name: secret scan

# Scan main's full history on push, daily and dispatch through
# Nitjsefnie-Actions/secret-scan. The PR producer is pr-gates.yml's
# secret-scan job, which runs the same action over PR history fetched only as
# git objects. Reports are uploaded even when scanning fails.

on:
  # No paths filter: every push to main scans its full history.
  push:
    branches: [main]
  schedule:
    # Daily 04:41 UTC, off the top of the hour where the Actions queue is
    # busiest.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push/daily/dispatch runs group per SHA so different main tips do not
  # displace each other; runs at the same tip share a group. There is no
  # pull-request leg in this file, so nothing here keys on a pull request and
  # the bound this repository applies to pull-request-reachable workflows does
  # not apply — see pr-gates.yml, job secret-scan for the per-pull-request group its own
  # leg uses. false preserves every in-flight full-history scan as a
  # detection record.
  group: secret-scan-${{ github.sha }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each event must have a scan path; otherwise a new trigger could
      # produce a green job that ran only setup-node.
      - name: Refuse unhandled events
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Unhandled secret-scan event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # Push checks out the pushed tip; schedule and dispatch keep their
      # default checkout. Full history is required on every leg, and
      # credentials are never persisted for the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action's exit status is the gate: it fails on any finding the
      # .gitleaksignore of the commit the change is judged against does not
      # list. No continue-on-error and no
      # `if: always()` here, or a findings run finishes green.
      - name: Scan the full history
        uses: Nitjsefnie-Actions/secret-scan@74f89d79a41106c9a65c23f20895b23240665f26 # v1.0.0

      # The action writes no report file. This step reruns its scan with a JSON
      # report so a red run leaves the findings behind as an artifact.
      # shortcut: it uses the binary and trusted config that the pinned
      # action.yml leaves under $RUNNER_TEMP, so re-check it on every re-pin,
      # until the action writes one (Nitjsefnie-Actions/secret-scan#10).
      - name: Write the findings report
        if: ${{ always() }}
        run: |
          "$RUNNER_TEMP/gitleaks" detect --redact --ignore-gitleaks-allow --exit-code 0 \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted" \
            --log-opts='--full-history --all --diff-filter=uxdb --diff-merges=first-parent' \
            --report-format json --report-path gitleaks-report.json

      # Upload once more on failure: the action rethrows a network error
      # (ETIMEDOUT, ECONNRESET) without retrying, so each first attempt is
      # tolerated and its identical retry, overwriting whatever the first
      # left, carries the step's failure.
      # `if: always()` is the only thing that makes a RED run leave the report
      # behind, and the report is what a human reads to learn which commit and
      # which line carried the finding. Uploading a report from a clean run is
      # harmless: it is an empty array.
      - name: Upload the findings report
        id: upload-findings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

      - name: Upload the findings report (retry)
        if: ${{ always() && steps.upload-findings.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error
          overwrite: true

      # The commits .gitleaksignore names must be reachable from HEAD. This runs
      # after the upload so an unreachable entry does not discard the report. Full depth
      # lets ancestry distinguish an orphaned entry from a commit a shallow
      # checkout simply never fetched.
      #
      # tests/ci/secret-scan-workflow.test.ts EXECUTES this step's `run:` block
      # verbatim against repositories it builds, with and without an entry that is
      # not an ancestor of HEAD, so the check is shown to reject rather than only
      # to be shaped like a check.
      - name: Check the ignore list's commits are reachable
        run: bash scripts/secret-scan-baseline.sh
