name: secret scan

# Weekly full-history secret scan, baselined. GitHub's secret scanning and push
# protection already gate every commit as it arrives, so nothing reaching a
# branch today can slip past them. What neither ever sees is HISTORY: a
# credential committed before scanning was enabled is still sitting in an old
# commit, and no amount of push protection retires it. This is the sweep for
# exactly that, which is why it is scheduled and manually dispatchable and
# carries no pull_request trigger — a pull-request leg would be metered for a
# signal that already exists.
#
# THE BASELINE, AND HOW TO REGENERATE IT. .github/gitleaks-baseline.json is the
# redacted report gitleaks 8.30.1 produced over this repository's whole
# history: 11 findings, every one a test-fixture literal under tests/, no live
# secret was ever committed. To regenerate it after a deliberate scanner or
# rule change, run from the repository root, with NO --baseline-path:
#
#   gitleaks git --redact --no-banner --report-format json \
#     --report-path .github/gitleaks-baseline.json .
#
# Commit the file as emitted — do not hand-edit, reorder or trim it, and do
# not reduce it to a list of fingerprints. gitleaks 8.30.1 compares a baseline
# entry by WHOLE-RECORD equality, so a fingerprint-only baseline suppresses
# nothing and the scan still exits 1. Prove the result by re-running with
# --baseline-path naming the committed file and seeing exit 0.
#
# A RED RUN MEANS THE SCANER EXITED NONZERO — either the history carries a
# secret this baseline does not cover, or gitleaks itself failed. Read the
# uploaded gitleaks-report.json: it names the commit, the file, the line and
# the rule. The version is checked by scripts/secret-scan.sh BEFORE the scan
# runs, so a scanner that drifted cannot produce a confusing red run here; if
# the scan step fails with a version message, that is the cause.
on:
  schedule:
    # Wednesdays 04:41 UTC, off the top of the hour where the Actions queue is
    # busiest.
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same shape as dependency-audit.yml, and for the same first reason: this
  # workflow has no pull_request trigger, so its pull_request arm of the group
  # always resolves null and falls through to github.ref, and its
  # cancel-in-progress test is never true — the group is already per-ref on a
  # schedule tick, and this workflow never receives the event that would make a
  # repository-level group contend. Both arms that would make a repository-wide
  # group contend are dead.
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is the entire point of this job. The default shallow
      # checkout walks one commit, finds nothing, and exits 0 — a green run
      # that scanned nothing. persist-credentials: false because the token is
      # read-only and never needed by the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks ACTION is deliberately not used: it decides the scanner's
      # version, so a bump inside it would move the rule set under a committed
      # baseline with nothing in this repository to change. The release
      # tarball is downloaded, checksum-verified and extracted here instead, so
      # the version this job scans with is the version the file records.
      # Values reach the shell through env:, never through ${{ }} in run:.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # gitleaks_8.30.1_checksums.txt. Bump the version and checksum
          # together, and with PINNED_GITLEAKS_VERSION in
          # scripts/secret-scan.sh.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # The exit code of this step IS the signal. No continue-on-error, no
      # `if: always()` — anything that lets the run proceed past a nonzero exit
      # turns a detection signal into decoration. The script checks the
      # gitleaks version before scanning, so a drifted scanner fails here with
      # a message rather than producing findings the baseline cannot explain.
      - name: Scan the full history
        env:
          GITLEAKS_REPORT_PATH: gitleaks-report.json
        run: bash scripts/secret-scan.sh

      # `if: always()` is the only thing that makes a RED run leave the report
      # behind, and the report is what a human reads to learn which commit and
      # which line carried the finding. Uploading a report from a clean run is
      # harmless: it is an empty array.
      - name: Upload the findings report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error
